        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 20px;
            overflow-x: hidden;

        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        #video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            width: fit-content;
            max-width: 100vw;
            margin: 0 auto;
            transition: width 0.2s;
        }

        #canvas-area {
            position: relative;
            aspect-ratio: 4 / 3;
            background: #000;
            width: 768px; /* Default zoom 3x */
            transition: width 0.2s;
        }

        #screen-wrapper:fullscreen #canvas-area,
        .ios-fullscreen-fix #canvas-area {
            width: calc(100vh * 4 / 3) !important;
            height: 100vh !important;
            max-width: 100vw !important;
        }

        #palette-histogram {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 10px 5px; /* Enlarge touch region (vertical padding) */
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            box-sizing: border-box;
            cursor: pointer;
            transition: height 0.3s, opacity 0.3s;
            z-index: 30;
        }

        #palette-histogram.hidden {
            height: 15px; /* Also larger when hidden */
            padding: 0;
            opacity: 0.6;
        }

        #palette-histogram.hidden .hist-row {
            display: none;
        }

        .hist-row {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            width: calc(100% / 16);
            height: 100%;
            gap: 4px;
        }

        .hist-color-box {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .hist-bar {
            width: 14px; /* Back to matching color box width */
            background-color: #00ffcc;
            border-radius: 1px 1px 0 0;
            transition: height 0.1s;
        }

        #playlist-sidebar {
            width: 100%;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            transition: max-height 0.3s, opacity 0.3s;
            z-index: 30;
            overflow: hidden;
            position: relative;

        #playlist-sidebar.hidden {
            max-height: 20px;
            opacity: 0.6;

        #playlist-folder {

            justify-content: center;

            transition: background 0.2s;
            flex-shrink: 0;

        #playlist-folder:hover {

            transform: rotate(90deg);
        }

        #playlist-sidebar.hidden #playlist-folder svg {
            transform: rotate(270deg);
        }

        .playlist-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 250px;

        .playlist-header {
            padding: 5px 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;

        .playlist-header-btn {

            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.2s;

        .playlist-header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-header-btn svg {
            fill: #888;
        }

        .playlist-header-btn:hover svg {
            fill: #fff;
        }

        .playlist-items {
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #555 transparent;

        .playlist-item {

            align-items: center;

            cursor: pointer;

        .playlist-item:hover {

        }

        .playlist-item.active {

        #msx-screen {

            align-items: flex-end;

        #osd-controls {

        #canvas-area:hover #osd-controls,

        .osd-center-controls {

        .osd-icon-btn:hover {

        .osd-icon-btn:active {

        .osd-frame-controls {

        .osd-frame-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;

            justify-content: center;

        .osd-frame-btn:hover {

        .btn-osd-track svg {

        }

        #btn-osd-play-pause svg {

        }

        .osd-bottom-bar {

            flex-direction: column;
            gap: 5px;
            width: 100%;
            pointer-events: auto;
        }

        .osd-slider-row {
            display: flex;
            align-items: center;
            gap: 10px;

        #osd-seek-slider {
            flex-grow: 1; /* Ensure slider takes full width */

            accent-color: #ff0000;
            margin: 0;

        .osd-time {
            font-family: monospace;
            font-size: 11px; /* Smaller font */
            color: #ddd;
            min-width: 80px; /* Reduced min-width */
            text-align: left;
        }

    <script>
        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.gainNode = this.audioCtx.createGain();
                this.gainNode.connect(this.audioCtx.destination);
                this.frames = [];
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.lastVolume = 1.0;
                this.playlist = [];
                this.currentPlayIndex = -1;
                this.repeatMode = 'off';
                this.shuffleList = [];
                this.initUI();
                this.initWorker();
            }

            setRepeatMode(mode) {
                this.repeatMode = mode;
                if (mode === 'shuffle') this.generateShuffleList();
                this.updateRepeatUI();
            }

            generateShuffleList() {
                this.shuffleList = Array.from({ length: this.playlist.length }, (_, i) => i);
                for (let i = this.shuffleList.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.shuffleList[i], this.shuffleList[j]] = [this.shuffleList[j], this.shuffleList[i]];
                }
                const currentInShuffle = this.shuffleList.indexOf(this.currentPlayIndex);
                if (currentInShuffle > -1) {
                    this.shuffleList.splice(currentInShuffle, 1);
                    this.shuffleList.unshift(this.currentPlayIndex);
                }
            }

            updateRepeatUI() {
                const btn = document.getElementById('btn-repeat');
                const icons = { off: 'icon-repeat-off', all: 'icon-repeat-all', one: 'icon-repeat-one', shuffle: 'icon-shuffle' };
                Object.values(icons).forEach(id => document.getElementById(id).style.display = 'none');
                document.getElementById(icons[this.repeatMode]).style.display = 'block';
                btn.title = `Repeat Mode: ${this.repeatMode.charAt(0).toUpperCase() + this.repeatMode.slice(1)}`;
                if (this.repeatMode !== 'off') btn.classList.add('osd-btn-active');
                else btn.classList.remove('osd-btn-active');
            }

            async handleEnded() {
                if (this.repeatMode === 'one') await this.playPlaylistItem(this.currentPlayIndex);
                else if (this.repeatMode === 'all') await this.playPlaylistItem((this.currentPlayIndex + 1) % this.playlist.length);
                else if (this.repeatMode === 'shuffle') {
                    if (this.playlist.length <= 1) await this.playPlaylistItem(this.currentPlayIndex);
                    else {
                        let curIdx = this.shuffleList.indexOf(this.currentPlayIndex);
                        let nextIdx = (curIdx + 1) % this.shuffleList.length;
                        if (nextIdx === 0) this.generateShuffleList();
                        await this.playPlaylistItem(this.shuffleList[nextIdx]);
                    }
                } else {
                    if (this.currentPlayIndex < this.playlist.length - 1) await this.playPlaylistItem(this.currentPlayIndex + 1);
                    else { this.pause(); this.pauseTime = 0; this.renderFrame(0); }
                }
            }

            updatePlaylistUI() {
                const container = document.getElementById('playlist-items');
                container.innerHTML = '';
                this.playlist.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = `playlist-item ${index === this.currentPlayIndex ? 'active' : ''}`;
                    el.draggable = true;
                    el.onclick = (e) => {
                        e.stopPropagation();
                        if (e.target.closest('.btn-remove-item')) return;
                        this.playPlaylistItem(index);
                    };

                    const thumb = document.createElement('img');
                    thumb.className = 'playlist-thumbnail';
                    if (item.thumbnail) thumb.src = item.thumbnail;
                    else thumb.style.background = '#222'; // Placeholder

                    const name = document.createElement('span');
                    name.className = 'playlist-item-name';
                    name.innerText = item.name;
                    name.title = item.name;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn-remove-item';
                    removeBtn.innerHTML = '×';
                    removeBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.removeFromPlaylist(index);
                    };

                    el.appendChild(thumb);
                    el.appendChild(name);
                    el.appendChild(removeBtn);
                    container.appendChild(el);

                    // Re-bind drag events for the new structure
                    el.ondragstart = (e) => { e.dataTransfer.setData('text/plain', index); el.classList.add('dragging'); };
                    el.ondragend = () => { el.classList.remove('dragging'); this.updatePlaylistUI(); };
                    el.ondragover = (e) => {
                        e.preventDefault();
                        const draggingItem = container.querySelector('.dragging');
                        if (draggingItem && draggingItem !== el) {
                            const rect = el.getBoundingClientRect();
                            const next = (e.clientY - rect.top) > (rect.height / 2);
                            container.insertBefore(draggingItem, next ? el.nextSibling : el);
                        }
                    };
                    el.ondrop = (e) => {
                        e.preventDefault();
                        const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                        const toIndex = Array.from(container.children).indexOf(el);
                        if (fromIndex !== toIndex) this.movePlaylistItem(fromIndex, toIndex);
                    };
                });
            }

            movePlaylistItem(from, to) {
                const item = this.playlist.splice(from, 1)[0];
                this.playlist.splice(to, 0, item);
                if (this.currentPlayIndex === from) this.currentPlayIndex = to;
                else if (from < this.currentPlayIndex && to >= this.currentPlayIndex) this.currentPlayIndex--;
                else if (from > this.currentPlayIndex && to <= this.currentPlayIndex) this.currentPlayIndex++;
                this.updatePlaylistUI();
            }

            async addToPlaylist(file) {
                if (!file) return;
                const item = { file, name: file.name, thumbnail: null };
                this.playlist.push(item);
                this.updatePlaylistUI();

                // Async thumbnail generation
                this.generateThumbnail(file).then(thumb => {
                    item.thumbnail = thumb;
                    this.updatePlaylistUI();
                });

                if (this.playlist.length === 1) await this.playPlaylistItem(0);
            }

            async generateThumbnail(file) {
                try {
                    let data;
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        const zip = new JSZip();
                        const content = await zip.loadAsync(file);
                        const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                        if (!entry) return null;
                        data = await entry.async('uint8array');
                    } else {
                        data = new Uint8Array(await file.arrayBuffer());
                    }

                    const sig = String.fromCharCode(...data.slice(0, 8));
                    const ver = String.fromCharCode(...data.slice(16, 21));
                    let frameData = null;
                    let palette = null;

                    if (sig === "MMCSD_MV" && ver === "v1.00") {
                        // MV1: 16k header, each frame 16k. 150th frame = 16384 + (150 * 16384)
                        const totalFrames = Math.floor((data.length - 16384) / 16384);
                        const targetFrame = totalFrames > 150 ? 150 : Math.min(totalFrames - 1, 10);
                        if (targetFrame < 0) return null;
                        const off = 16384 + (targetFrame * 16384);
                        const b = data.subarray(off, off + 16384);
                        frameData = { pgt: b.slice(0, 6144), ct: b.slice(6144, 12288) };
                        palette = [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)];
                    } else {
                        // MV2
                        const head = sig.startsWith("MV2") ? 512 : 16384;
                        let off = head;
                        let framesFound = 0;
                        const targetFrameIdx = 150; // We'll try to find up to 150
                        while (off < data.length && framesFound <= targetFrameIdx) {
                            const sz = (head === 512 && off === 512) ? 15872 : 16384;
                            if (off + sz > data.length) break;
                            if (framesFound === targetFrameIdx || (off + sz * 2 > data.length)) {
                                const b = data.subarray(off, off + sz);
                                frameData = { pgt: b.slice(0, 6144), ct: b.slice(6144, 12288) };
                                palette = [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)];
                                if (framesFound === targetFrameIdx) break;
                            }
                            off += sz;
                            framesFound++;
                        }
                        // Fallback if 150 not reached
                        if (!frameData && framesFound > 0) { /* should be caught by last-frame logic above */ }
                    }

                    if (!frameData) return null;

                    const canvas = document.createElement('canvas');
                    canvas.width = 256; canvas.height = 192;
                    const ctx = canvas.getContext('2d');
                    const img = ctx.createImageData(256, 192);
                    for (let y = 0; y < 192; y++) {
                        for (let cx = 0; cx < 32; cx++) {
                            const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                            const p = frameData.pgt[off], c = frameData.ct[off], fg = c >> 4, bg = c & 15;
                            for (let px = 0; px < 8; px++) {
                                const cIdx = (p & (1 << (7 - px))) ? fg : bg;
                                const rgb = palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                                img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                            }
                        }
                    }
                    ctx.putImageData(img, 0, 0);
                    return canvas.toDataURL('image/jpeg', 0.7);
                } catch (e) {
                    console.error("Thumbnail gen error:", e);
                    return null;
                }
            }

            removeFromPlaylist(index) {
                this.playlist.splice(index, 1);
                if (index === this.currentPlayIndex) { this.currentPlayIndex = -1; this.reset(); }
                else if (index < this.currentPlayIndex) this.currentPlayIndex--;
                this.updatePlaylistUI();
            }

            async playPlaylistItem(index) {
                if (index < 0 || index >= this.playlist.length) return;
                this.currentPlayIndex = index;
                this.updatePlaylistUI();
                await this.loadFile(this.playlist[index].file);
            }

            async playNextTrack() {
                if (this.playlist.length === 0) return;
                await this.playPlaylistItem((this.currentPlayIndex + 1) % this.playlist.length);
            }

            async playPrevTrack() {
                if (this.playlist.length === 0) return;
                let prev = this.currentPlayIndex - 1;
                if (prev < 0) prev = this.playlist.length - 1;
                await this.playPlaylistItem(prev);
            }

            initUI() {
                const histContainer = document.getElementById('palette-histogram');
                histContainer.innerHTML = '';
                for (let i = 0; i < 16; i++) {
                    const row = document.createElement('div'); row.className = 'hist-row';
                    row.innerHTML = `<div class="hist-bar" id="hist-bar-${i}" style="height: 0%"></div><div class="hist-color-box" id="hist-clr-${i}"></div>`;
                    histContainer.appendChild(row);
                }
            }

            reset() {
                this.pause();
                this.frames = [];
                this.audioBuffer = null;
                this.rawAudio = null;
                this.pauseTime = 0;
                this.lastFrame = -1;
                this.duration = 0;
                const seek = document.getElementById('osd-seek-slider');
                seek.value = 0; seek.disabled = true;
                document.getElementById('osd-time-cur').innerText = "00:00";
                document.getElementById('osd-time-total').innerText = "00:00";
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let cur = this.audioCtx.currentTime - this.startTime;
                    if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);
                    document.getElementById('osd-seek-slider').value = (cur / this.duration) * 100;
                    document.getElementById('osd-time-cur').innerText = this.formatTime(cur);
                    if (frame < this.totalFrames) {
                        if (this.lastFrame !== frame) { this.renderFrame(frame); this.lastFrame = frame; }
                    } else this.handleEnded();
                };
            }

            async loadFile(file) {
                this.reset();
                document.getElementById('canvas-msg-overlay').style.display = 'none';
                const status = document.getElementById('status');
                status.innerText = "파일 분석 중...";
                try {
                    let data;
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        const zip = new JSZip();
                        const content = await zip.loadAsync(file);
                        const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                        if (!entry) throw new Error("ZIP 파일 내에 .MV 또는 .MV2 파일이 없습니다.");
                        data = await entry.async('uint8array');
                    } else data = new Uint8Array(await file.arrayBuffer());
                    await this.processData(data);
                } catch (err) {
                    console.error("File loading error:", err);
                    status.innerText = `에러: ${err.message} (자동으로 다음 트랙으로 넘어갑니다)`;
                    status.style.color = "#ff4444";

                    // Wait a moment so user can see the error message before skipping
                    await new Promise(r => setTimeout(r, 2000));

                    // Use currentPlayIndex since the file object comparison might fail
                    if (this.currentPlayIndex > -1) {
                        const indexToRemove = this.currentPlayIndex;
                        this.removeFromPlaylist(indexToRemove);

                        if (this.playlist.length > 0) {
                            // If we still have files, play the next one
                            // (which is now at the same index, or wraps around)
                            const nextToPlay = indexToRemove % this.playlist.length;
                            await this.playPlaylistItem(nextToPlay);
                        } else {
                            this.reset();
                            status.innerText = "모든 파일 로드 실패 또는 플레이리스트가 비어 있습니다.";
                        }
                    }
                }
            }

            async processData(data) {
                const sig = String.fromCharCode(...data.slice(0, 8)), ver = String.fromCharCode(...data.slice(16, 21));
                const status = document.getElementById('status');
                try {
                    if (sig === "MMCSD_MV" && ver === "v1.00") { this.fps = 12; this.isMV1 = true; await this.parseMV1(data); }
                    else if (sig === "MMCSD_MV" && ver === "v2.00") { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, 16384); }
                    else if (sig.startsWith("MV2")) { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, 512); }
                    else throw new Error("올바른 .MV 또는 .MV2 포맷이 아닙니다.");
                    status.innerText = `파싱 완료! (${this.isMV1 ? 'MV1' : 'MV2'}, ${this.fps}FPS, ${this.totalFrames} 프레임)`;
                    status.style.color = "#4CAF50";
                    this.duration = this.totalFrames / this.fps;
                    document.getElementById('osd-time-total').innerText = this.formatTime(this.duration);
                    document.getElementById('osd-seek-slider').disabled = false;
                    await this.play();
                } catch (err) {
                    console.error(err); status.innerText = `에러: ${err.message}`; status.style.color = "#ff4444";
                }
            }

            async parseMV1(data) {
                this.frames = []; let off = 16384, pcm = [];
                while (off + 16384 <= data.length) {
                    const b = data.subarray(off, off + 16384);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)], eqRaw: b.slice(13264, 13273) });
                    pcm.push(b.slice(12288, 13232)); off += 16384;
                }
                this.totalFrames = this.frames.length;
                this.rawAudio = new Uint8Array(pcm.length * 944); pcm.forEach((c, i) => this.rawAudio.set(c, i * 944));
                this.audioBuffer = this.audioCtx.createBuffer(1, this.rawAudio.length, 944 * 12);
                const ch = this.audioBuffer.getChannelData(0); for (let i = 0; i < this.rawAudio.length; i++) ch[i] = (this.rawAudio[i] - 128) / 128;
            }

            async parseMV2(data, head) {
                this.frames = []; let off = head, mp3 = [];
                while (off < data.length) {
                    const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break;
                    const b = data.subarray(off, off + sz);
                    const mp3Chunk = b.slice(12801, 12801 + (b[12800] * 32));
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)], eqRaw: b.slice(12320, 12329), mp3Chunk: mp3Chunk.length > 0 ? mp3Chunk : null });
                    if (mp3Chunk.length > 0) mp3.push(mp3Chunk); off += sz;
                }
                this.totalFrames = this.frames.length;
                const total = mp3.reduce((a, c) => a + c.length, 0);
                if (total === 0) { this.audioBuffer = this.audioCtx.createBuffer(1, Math.ceil((this.totalFrames / this.fps) * 44100), 44100); return; }
                this.rawAudio = new Uint8Array(total); let cur = 0; mp3.forEach(c => { this.rawAudio.set(c, cur); cur += c.length; });
                try {
                    this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudio.buffer.slice(0));
                } catch (err) {
                    console.warn(err); this.audioBuffer = this.audioCtx.createBuffer(1, Math.max(1, Math.ceil((this.totalFrames / this.fps) * 44100)), 44100);
                }
            }

            extractPal(d, n) {
                let p = []; for (let i = 0; i < n; i++) p.push([Math.round(((d[i * 2] >> 4) & 7) * 255 / 7), Math.round((d[i * 2 + 1] & 7) * 255 / 7), Math.round((d[i * 2] & 7) * 255 / 7)]); return p;
            }

            renderFrame(idx) {
                const frame = this.frames[idx]; if (!frame) return;
                const img = this.ctx.createImageData(256, 192), counts = new Array(16).fill(0);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8), p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; counts[cIdx]++;
                            const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                this.ctx.putImageData(img, 0, 0);
                if (!document.getElementById('palette-histogram').classList.contains('hidden')) {
                    const maxLog = Math.log10(256 * 192 + 1);
                    for (let i = 0; i < 16; i++) {
                        const rgb = frame.palette[i];
                        document.getElementById(`hist-clr-${i}`).style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                        document.getElementById(`hist-bar-${i}`).style.height = `${(Math.log10(counts[i] + 1) / maxLog) * 100}%`;
                    }
                }
                const eqOverlay = document.getElementById('eq-overlay');
                if (!eqOverlay.classList.contains('hidden')) {
                    const bars = eqOverlay.children;
                    for (let i = 0; i < 9; i++) bars[i].style.height = ((15 - Math.min(frame.eqRaw[i], 15)) / 15 * 100) + '%';
                }
            }

            renderFrameToCanvas(idx, targetCtx, withOverlay = true) {
                const frame = this.frames[idx];
                const img = targetCtx.createImageData(256, 192);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8), p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                targetCtx.putImageData(img, 0, 0);
                if (withOverlay) {
                    const op = getComputedStyle(document.documentElement).getPropertyValue('--eq-opacity').trim();
                    targetCtx.fillStyle = `rgba(255,255,255,${op})`; const eqW = 256 * 0.25, eqH = 192 * 0.25, barW = (eqW / 9) - 1;
                    for (let i = 0; i < 9; i++) { const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * (eqH * 0.9); targetCtx.fillRect(2 + i * (barW + 1), eqH - h + 2, barW, Math.max(1, h)); }
                }
            }

            async exportMP4() {
                if (!this.frames || this.totalFrames === 0) { alert("먼저 추출할 파일을 열어주세요."); return; }
                const btn = document.getElementById('btn-export'), status = document.getElementById('status');
                btn.disabled = true; status.innerText = "내보내기 준비 중...";
                try {
                    const codecChoice = document.getElementById('audio-codec-select').value;
                    const originalSampleRate = this.audioBuffer ? this.audioBuffer.sampleRate : 44100;
                    const targetSampleRate = (codecChoice === 'mp3') ? originalSampleRate : (codecChoice === 'opus' ? 48000 : 44100);
                    let resampledAudioBuffer = null;
                    if (codecChoice !== 'none' && codecChoice !== 'mp3') {
                        const offlineCtx = new OfflineAudioContext(1, Math.ceil(this.duration * targetSampleRate), targetSampleRate);
                        const source = offlineCtx.createBufferSource(); source.buffer = this.audioBuffer; source.connect(offlineCtx.destination); source.start(0);
                        resampledAudioBuffer = await offlineCtx.startRendering();
                    }
                    const muxer = new Mp4Muxer.Muxer({
                        target: new Mp4Muxer.ArrayBufferTarget(),
                        video: { codec: 'avc', width: 768, height: 576 },
                        audio: (codecChoice !== 'none') ? { codec: codecChoice, sampleRate: targetSampleRate, numberOfChannels: 1 } : undefined,
                        fastStart: 'in-memory'
                    });
                    const videoEncoder = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => console.error(e) });
                    videoEncoder.configure({ codec: 'avc1.42001f', width: 768, height: 576, bitrate: 5_000_000, framerate: this.fps });
                    let audioEncoder = null;
                    if (codecChoice !== 'none' && codecChoice !== 'mp3') {
                        audioEncoder = new AudioEncoder({ output: (chunk, meta) => muxer.addAudioChunk(chunk, meta), error: e => console.error(e) });
                        audioEncoder.configure({ codec: codecChoice === 'opus' ? 'opus' : 'mp4a.40.2', sampleRate: targetSampleRate, numberOfChannels: 1, bitrate: 128_000 });
                        const channelData = resampledAudioBuffer.getChannelData(0), step = codecChoice === 'opus' ? 960 : 1024;
                        for (let i = 0; i < channelData.length; i += step) {
                            const chunk = channelData.subarray(i, i + step);
                            const audioData = new AudioData({ format: 'f32-planar', sampleRate: targetSampleRate, numberOfFrames: chunk.length, numberOfChannels: 1, timestamp: Math.round(i / targetSampleRate * 1_000_000), data: chunk });
                            audioEncoder.encode(audioData); audioData.close();
                        }
                    } else if (codecChoice === 'mp3') {
                        const microsPerFrame = (1 / this.fps) * 1_000_000;
                        for (let i = 0; i < this.totalFrames; i++) {
                            const chunkData = this.frames[i].mp3Chunk;
                            if (chunkData) muxer.addAudioChunk(new EncodedAudioChunk({ type: 'key', timestamp: Math.round(i * microsPerFrame), duration: Math.round(microsPerFrame), data: chunkData }));
                        }
                    }
                    const baseCanvas = document.createElement('canvas'); baseCanvas.width = 256; baseCanvas.height = 192;
                    const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
                    const scaleCanvas = document.createElement('canvas'); scaleCanvas.width = 768; scaleCanvas.height = 576;
                    const scaleCtx = scaleCanvas.getContext('2d'); scaleCtx.imageSmoothingEnabled = false;
                    const includeEQ = !document.getElementById('eq-overlay').classList.contains('hidden'), durationMicros = Math.round(1 / this.fps * 1_000_000);
                    for (let i = 0; i < this.totalFrames; i++) {
                        this.renderFrameToCanvas(i, baseCtx, includeEQ); scaleCtx.drawImage(baseCanvas, 0, 0, 256, 192, 0, 0, 768, 576);
                        const frame = new VideoFrame(scaleCanvas, { timestamp: Math.round(i / this.fps * 1_000_000), duration: durationMicros });
                        videoEncoder.encode(frame); frame.close();
                        if (i % 30 === 0) { status.innerText = `인코딩 중... (${i}/${this.totalFrames})`; await new Promise(r => setTimeout(r, 0)); }
                    }
                    await videoEncoder.flush(); if (audioEncoder) await audioEncoder.flush();
                    muxer.finalize();
                    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([muxer.target.buffer], { type: 'video/mp4' }));
                    a.download = `msx_export_${Date.now()}.mp4`; a.click();
                    status.innerText = "내보내기 완료!"; status.style.color = "#4CAF50";
                } catch (err) {
                    console.error(err); status.innerText = "에러 발생 (콘솔 확인)"; status.style.color = "#ff4444";
                } finally { btn.disabled = false; }
            }

            togglePlay() { this.isPlaying ? this.pause() : this.play(); }

            async play() {
                if (this.isPlaying || !this.audioBuffer) return;
                this.isPlaying = true; document.getElementById('canvas-area').classList.remove('paused');
                if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
                if (this.src) { try { this.src.stop(); } catch (e) { } try { this.src.disconnect(); } catch (e) { } }
                this.src = this.audioCtx.createBufferSource(); this.src.buffer = this.audioBuffer; this.src.connect(this.gainNode);
                const safePauseTime = isFinite(this.pauseTime) ? this.pauseTime : 0;
                this.src.start(0, safePauseTime); this.startTime = this.audioCtx.currentTime - safePauseTime;
                this.updatePlayIcon(true); this.timerWorker.postMessage('start');
            }

            pause() {
                if (!this.isPlaying) return;
                this.isPlaying = false; document.getElementById('canvas-area').classList.add('paused');
                if (this.src) { try { this.src.stop(); } catch (e) { } try { this.src.disconnect(); } catch (e) { } this.src = null; }
                if (!this.isScrubbing) this.pauseTime = this.audioCtx.currentTime - this.startTime;
                this.updatePlayIcon(false); this.timerWorker.postMessage('stop');
            }

            updatePlayIcon(p) {
                document.getElementById('icon-play').style.display = p ? 'none' : 'block';
                document.getElementById('icon-pause').style.display = p ? 'block' : 'none';
            }
        }

        const player = new MSXMediaDemuxer('msx-screen');

        // Zoom Logic
        let currentZoom = 3;
        const setZoom = (z) => {
            currentZoom = z;
            const width = 256 * z;
            document.getElementById('canvas-area').style.width = width + 'px';
            document.getElementById('btn-zoom').setAttribute('data-zoom', z + 'x');
            document.getElementById('info-block').style.width = width + 'px';
        };
        document.getElementById('btn-zoom').onclick = () => { let next = currentZoom + 1; if (next > 5) next = 1; setZoom(next); };

        // Adaptive UI
        const applyAdaptiveUI = () => {
            const isMobile = window.innerWidth < 768;
            if (isMobile) {
                document.getElementById('playlist-sidebar').classList.add('hidden');
                document.getElementById('palette-histogram').classList.add('hidden');
                setZoom(1);
            } else {
                document.getElementById('playlist-sidebar').classList.remove('hidden');
                document.getElementById('palette-histogram').classList.remove('hidden');
                setZoom(3);
            }
        };
        applyAdaptiveUI();
        window.addEventListener('resize', applyAdaptiveUI);

        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        const playlistFolder = document.getElementById('playlist-folder');
        const playlistSidebar = document.getElementById('playlist-sidebar');
        playlistFolder.onclick = (e) => { e.stopPropagation(); playlistSidebar.classList.toggle('hidden'); };
        playlistSidebar.onclick = function(e) { if (this.classList.contains('hidden')) this.classList.remove('hidden'); };

        document.getElementById('btn-osd-open').onclick = () => document.getElementById('file-input').click();
        document.getElementById('btn-osd-save').onclick = () => player.exportMP4();

        document.getElementById('btn-add-playlist').onclick = (e) => { e.stopPropagation(); document.getElementById('file-input').click(); };
        document.getElementById('playlist-items').onclick = (e) => { if (e.target === e.currentTarget) document.getElementById('file-input').click(); };
        document.getElementById('file-input').onchange = async e => {
            if (e.target.files.length) {
                const start = player.playlist.length;
                for (let file of e.target.files) await player.addToPlaylist(file);
                e.target.value = '';
                await player.playPlaylistItem(start);
            }
        };

        const canvasArea = document.getElementById('canvas-area');
        canvasArea.ondragover = e => { e.preventDefault(); canvasArea.classList.add('dragover'); };
        canvasArea.ondragleave = () => canvasArea.classList.remove('dragover');
        canvasArea.ondrop = async e => {
            e.preventDefault(); canvasArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                const start = player.playlist.length;
                for (let file of e.dataTransfer.files) player.addToPlaylist(file);
                await player.playPlaylistItem(start);
            }
        };

        const eqOverlay = document.getElementById('eq-overlay');
        let isDraggingEq = false, startY = 0, startOpacity = 0.25, hasMoved = false;
        const handleEqStart = (e) => { isDraggingEq = true; hasMoved = false; startY = e.touches ? e.touches[0].clientY : e.clientY; startOpacity = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--eq-opacity')); if (e.touches) e.preventDefault(); };
        const handleEqMove = (e) => { if (!isDraggingEq) return; const currentY = e.touches ? e.touches[0].clientY : e.clientY, deltaY = startY - currentY; if (Math.abs(deltaY) > 5) hasMoved = true; let op = startOpacity + (deltaY / 200); document.documentElement.style.setProperty('--eq-opacity', Math.max(0.05, Math.min(1.0, op))); };
        const handleEqEnd = () => { if (!isDraggingEq) return; isDraggingEq = false; if (!hasMoved) { eqOverlay.classList.toggle('hidden'); if (player.frames.length) player.renderFrame(Math.floor(player.pauseTime * player.fps)); } };
        eqOverlay.addEventListener('mousedown', handleEqStart); window.addEventListener('mousemove', handleEqMove); window.addEventListener('mouseup', handleEqEnd);
        eqOverlay.addEventListener('touchstart', handleEqStart, { passive: false }); window.addEventListener('touchmove', handleEqMove, { passive: false }); window.addEventListener('touchend', handleEqEnd);

        document.getElementById('palette-histogram').onclick = function() { this.classList.toggle('hidden'); };
        document.getElementById('btn-osd-play-pause').onclick = () => player.togglePlay();
        document.getElementById('btn-osd-prev-track').onclick = () => player.playPrevTrack();
        document.getElementById('btn-osd-next-track').onclick = () => player.playNextTrack();
        document.getElementById('btn-osd-prev-frame').onclick = () => moveFrame(-1);
        document.getElementById('btn-osd-next-frame').onclick = () => moveFrame(1);
        document.getElementById('btn-repeat').onclick = () => { const modes = ['off', 'all', 'one', 'shuffle']; player.setRepeatMode(modes[(modes.indexOf(player.repeatMode) + 1) % modes.length]); };

        const volBtn = document.getElementById('btn-volume'), volSlider = document.getElementById('volume-slider');
        volBtn.onclick = () => {
            if (player.gainNode.gain.value > 0) { player.lastVolume = player.gainNode.gain.value; player.gainNode.gain.value = 0; volSlider.value = 0; }
            else { player.gainNode.gain.value = player.lastVolume || 1.0; volSlider.value = player.gainNode.gain.value; }
            document.getElementById('icon-vol-on').style.display = player.gainNode.gain.value > 0 ? 'block' : 'none';
            document.getElementById('icon-vol-off').style.display = player.gainNode.gain.value > 0 ? 'none' : 'block';
        };
        volSlider.oninput = (e) => {
            const v = parseFloat(e.target.value); player.gainNode.gain.value = v;
            document.getElementById('icon-vol-on').style.display = v > 0 ? 'block' : 'none';
            document.getElementById('icon-vol-off').style.display = v > 0 ? 'none' : 'block';
        };

        const seek = document.getElementById('osd-seek-slider');
        let wasPlayingBeforeSeek = false;
        seek.onmousedown = seek.ontouchstart = () => wasPlayingBeforeSeek = player.isPlaying;
        seek.oninput = e => {
            player.isScrubbing = true; if (player.isPlaying) player.pause();
            const t = (e.target.value / 100) * player.duration;
            document.getElementById('osd-time-cur').innerText = player.formatTime(t);
            player.renderFrame(Math.min(Math.floor(t * player.fps), player.totalFrames - 1));
        };
        seek.onchange = e => { player.pauseTime = (e.target.value / 100) * player.duration; player.isScrubbing = false; if (wasPlayingBeforeSeek) player.play(); };

        const moveFrame = (d) => {
            if (!player.frames.length) return; player.pause();
            const cur = Math.round(player.pauseTime * player.fps), tar = Math.max(0, Math.min(player.totalFrames - 1, cur + d));
            player.pauseTime = tar / player.fps; seek.value = (player.pauseTime / player.duration) * 100;
            document.getElementById('osd-time-cur').innerText = player.formatTime(player.pauseTime); player.renderFrame(tar);
        };

        const btnFs = document.getElementById('btn-fullscreen-toggle'), screenWrapper = document.getElementById('screen-wrapper');
        const toggleFs = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || screenWrapper.classList.contains('ios-fullscreen-fix'));
            if (!isFs) {
                const req = screenWrapper.requestFullscreen || screenWrapper.webkitRequestFullscreen || screenWrapper.mozRequestFullScreen || screenWrapper.msRequestFullscreen;
                if (req) req.call(screenWrapper).catch(() => { screenWrapper.classList.add('ios-fullscreen-fix'); updateFsUI(); });
                else { screenWrapper.classList.add('ios-fullscreen-fix'); updateFsUI(); }
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (exit) exit.call(document); screenWrapper.classList.remove('ios-fullscreen-fix'); updateFsUI();
            }
        };
        btnFs.onclick = toggleFs;

        const updateFsUI = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || screenWrapper.classList.contains('ios-fullscreen-fix'));
            document.getElementById('icon-expand').style.display = isFs ? 'none' : 'block';
            document.getElementById('icon-compress').style.display = isFs ? 'block' : 'none';
            if (isFs) document.getElementById('palette-histogram').classList.add('hidden');
            else applyAdaptiveUI();
        };
        document.addEventListener('fullscreenchange', updateFsUI); document.addEventListener('webkitfullscreenchange', updateFsUI);
        document.addEventListener('mozfullscreenchange', updateFsUI); document.addEventListener('MSFullscreenChange', updateFsUI);

        const showOSD = () => {
            canvasArea.classList.add('touch-active'); clearTimeout(window.tTimer);
            if (player.isPlaying) window.tTimer = setTimeout(() => { if (player.isPlaying) canvasArea.classList.remove('touch-active'); }, 3000);
        };
        canvasArea.addEventListener('mousemove', showOSD);
        canvasArea.addEventListener('touchstart', () => showOSD(), { passive: true });
        const op = player.play.bind(player); player.play = async () => { await op(); showOSD(); };
        const opa = player.pause.bind(player); player.pause = () => { opa(); showOSD(); };

        document.getElementById('btn-info-toggle').onclick = () => {
            const info = document.getElementById('info-block'); info.style.display = info.style.display === 'block' ? 'none' : 'block';
        };
    </script>
</body>
