<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MSX2 MV Player & Recorder</title>
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --eq-opacity: 0.25;
            --accent: #d9534f;
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #2a2a2a;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            height: 100%;
            overflow: hidden;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }

        /* ── App Bar ── */
        #app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            height: 40px;
            flex-shrink: 0;
            z-index: 10;
        }

        .app-bar-title {
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-bar-title svg {
            fill: var(--accent);
        }

        #btn-info-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: #888;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: fill 0.2s;
        }

        #btn-info-toggle:hover {
            fill: var(--accent);
        }

        /* ── Screen Wrapper & Video ── */
        #screen-wrapper {
            position: relative;
            background-color: #000;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        #video-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #000;
            width: 100%;
            max-width: min(100vw, calc((100vh - 120px) * 5 / 3));
            margin: 0 auto;
            flex-shrink: 0;
        }

        /* 가로 모드 사이드카 히스토그램을 위해 overflow visible */
        #canvas-area {
            position: relative;
            aspect-ratio: 5 / 3;
            background: #000;
            width: 100%;
            max-width: 100%;
            overflow: visible;
        }

        /* 🚀 [신규] 고해상도 초미세 그리드 */
        #grid-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            display: none;
            mix-blend-mode: difference;
            z-index: 5;
            /* 8x8 MSX 픽셀 단위를 CSS 비율로 계산 (100% / 32칸, 100% / 24칸) */
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.5) 1px, transparent 1px);
            background-size: calc(100% / 32) calc(100% / 24);
        }
        #grid-overlay.active { display: block; }

        @media (min-width: 768px) {
            #video-container {
                max-width: min(960px, calc((100vh - 150px) * 5 / 3));
            }
        }

        /* ── 정상적인 전체화면 (PC, 안드로이드, 아이폰 가로로 눕혔을 때) ── */
        #screen-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        #screen-wrapper:fullscreen #video-container {
            max-width: 100% !important;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #screen-wrapper:fullscreen #canvas-area {
            width: 100% !important;
            height: 100% !important;
            max-width: calc(100vh * 5 / 3) !important;
            max-height: calc(100vw * 3 / 5) !important;
            margin: auto;
        }

        @media (orientation: landscape) {
            #screen-wrapper:fullscreen #playlist-sidebar {
                display: none !important;
            }
        }

        /* ── 아이폰 전용 강제 가로모드 (세로로 들고 있을 때 가짜 전체화면 발동) ── */
        @media screen and (orientation: portrait) {
            .ios-fullscreen-fix {
                position: fixed !important;
                top: 50% !important;
                left: 50% !important;
                width: 100vh !important;
                height: 100vw !important;
                width: 100dvh !important;
                height: 100dvw !important;
                transform: translate(-50%, -50%) rotate(90deg) !important;
                transform-origin: center center !important;
                background: #000 !important;
                z-index: 9999 !important;
                margin: 0 !important;
                padding: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .ios-fullscreen-fix #video-container {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                max-height: 100% !important;
                margin: 0 !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .ios-fullscreen-fix #canvas-area {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                max-height: 100% !important;
                aspect-ratio: 5 / 3 !important;
                margin: auto !important;
            }

            .ios-fullscreen-fix #playlist-sidebar {
                display: none !important;
            }
        }

        /* ── 4:3 비율 토글 ── */
        body.aspect-4-3 #video-container {
            max-width: min(100vw, calc((100vh - 120px) * 4 / 3));
        }

        @media (min-width: 768px) {
            body.aspect-4-3 #video-container {
                max-width: min(960px, calc((100vh - 150px) * 4 / 3));
            }
        }

        body.aspect-4-3 #canvas-area {
            aspect-ratio: 4 / 3 !important;
        }

        body.aspect-4-3 #screen-wrapper:fullscreen #canvas-area {
            max-width: calc(100vh * 4 / 3) !important;
            max-height: calc(100vw * 3 / 4) !important;
        }

        @media screen and (orientation: portrait) {
            body.aspect-4-3 .ios-fullscreen-fix #canvas-area {
                aspect-ratio: 4 / 3 !important;
            }
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            object-fit: fill;
            image-rendering: pixelated;
            display: block;
        }

        #canvas-msg-overlay {
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 0;
            right: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #777;
            z-index: 20;
            border: 1px dashed #333;
            margin: 0 40px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            transition: background 0.2s, color 0.2s;
        }

        #canvas-area.empty #canvas-msg-overlay {
            display: flex;
        }

        #canvas-msg-overlay:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
        }

        /* ── EQ Overlay & Toggle Zone ── */
        #eq-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 25%;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 2%;
            gap: 2%;
            z-index: 40;
            transition: opacity 0.2s;
        }

        #eq-overlay.hidden {
            opacity: 0;
        }

        .overlay-eq-bar {
            flex: 1;
            background-color: rgba(255, 255, 255, var(--eq-opacity));
            height: 0%;
            border-radius: 1px 1px 0 0;
            transition: height 0.05s ease-out;
        }

        /* ── OSD Controls ── */
        #osd-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 30%, transparent 70%, rgba(0, 0, 0, 0.4) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 25;
            pointer-events: none;
        }

        @media (min-width: 768px) {
            #osd-controls {
                padding: 15px;
            }
        }

        @media (hover: hover) {
            #canvas-area:hover #osd-controls {
                opacity: 1;
                pointer-events: auto;
            }
        }

        .osd-visible #osd-controls,
        .paused #osd-controls {
            opacity: 1;
            pointer-events: auto;
        }

        #canvas-area.empty #osd-controls {
            display: none !important;
        }

        .osd-center-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 20px;
            pointer-events: auto;
        }

        @media (min-width: 768px) {
            .osd-center-controls {
                gap: 30px;
            }
        }

        .osd-icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            fill: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            min-height: 44px;
            transition: background 0.2s, transform 0.1s;
        }

        .osd-icon-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .osd-icon-btn:active {
            transform: scale(0.9);
        }

        .btn-osd-track svg {
            width: 28px;
            height: 28px;
        }

        @media (min-width: 768px) {
            .btn-osd-track svg {
                width: 36px;
                height: 36px;
            }
        }

        #btn-osd-play-pause {
            min-width: 56px;
            min-height: 56px;
        }

        #btn-osd-play-pause svg {
            width: 36px;
            height: 36px;
        }

        @media (min-width: 768px) {
            #btn-osd-play-pause svg {
                width: 48px;
                height: 48px;
            }
        }

        .osd-frame-controls {
            position: relative;
            display: none;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
            pointer-events: auto;
        }

        #seek-frame-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 8px;
            background: rgba(128, 128, 128, 0.5);
            color: #ffffff;
            font-weight: bold;
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            white-space: nowrap;
        }

        @media (min-width: 600px) {
            .osd-frame-controls {
                display: flex;
            }
        }

        .osd-frame-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            fill: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            min-height: 44px;
            transition: all 0.2s;
        }

        .osd-frame-btn:hover {
            fill: #fff;
        }

        .osd-bottom-bar {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            pointer-events: auto;
        }

        .osd-slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .osd-controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .osd-left-controls,
        .osd-right-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        @media (min-width: 768px) {

            .osd-left-controls,
            .osd-right-controls {
                gap: 5px;
            }
        }

        #btn-volume,
        #btn-repeat,
        #btn-zoom,
        #btn-fullscreen-toggle,
        #btn-osd-open,
        #btn-osd-save {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: white;
            padding: 8px;
            display: flex;
            align-items: center;
            min-width: 40px;
            min-height: 40px;
            justify-content: center;
            transition: transform 0.1s;
        }

        #btn-osd-open:active,
        #btn-osd-save:active {
            transform: scale(0.9);
        }

        #btn-zoom {
            display: none !important;
        }

        #osd-codec-container {
            display: flex;
            align-items: center;
            width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
            gap: 5px;
        }

        .osd-save-group {
            display: flex;
            align-items: center;
        }

        .osd-save-group:hover #osd-codec-container {
            width: 130px;
            opacity: 1;
            margin-left: 5px;
        }

        #osd-seek-slider {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #ff0000;
            margin: 0;
            height: 20px;
        }

        .osd-time {
            font-family: monospace;
            font-size: 11px;
            color: #ddd;
            min-width: 85px;
            text-align: right;
            white-space: nowrap;
            cursor: pointer;
        }

        .osd-volume-group {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        #volume-slider {
            width: 0;
            opacity: 0;
            transition: width 0.2s, opacity 0.2s;
            cursor: pointer;
            accent-color: #fff;
        }

        @media (min-width: 768px) {
            .osd-volume-group:hover #volume-slider {
                width: 60px;
                opacity: 1;
            }
        }

        .osd-btn-active {
            fill: var(--accent) !important;
        }

        /* ── 1. 세로 모드 전용 하단 히스토그램 (58px로 확장, 피크홀드 탑재) ── */
        #portrait-histogram {
            width: 100%;
            max-width: 960px;
            height: 58px;
            margin: 0 auto;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: row;
            flex-shrink: 0;
            padding: 4px 5px 4px 5px;
            gap: 2px;
            z-index: 5;
            cursor: pointer;
            transition: height 0.3s ease, padding 0.3s ease;
            overflow: hidden;
        }


        /* ── Tooltip for Histogram Bars ── */
        .hist-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            margin-top: -8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .p-hist-row,
        .l-hist-row {
            transition: transform 0.1s ease;
            transform-origin: bottom center;
        }

        #landscape-histogram-l .l-hist-row {
            transform-origin: right center;
        }

        #landscape-histogram-r .l-hist-row {
            transform-origin: left center;
        }

        @media (hover: hover) and (pointer: fine) {

            .p-hist-row:hover,
            .l-hist-row:hover {
                transform: scale(1.1);
                z-index: 20;
                position: relative;
            }
        }

        /* ── Metadata Info Overlay ── */
        #metadata-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.92);
            color: #ddd;
            border-radius: 12px;
            padding: 20px 24px;
            z-index: 100;
            min-width: 220px;
            max-width: 80%;
            max-height: 70%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.6;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        #metadata-overlay.visible {
            display: block;
        }

        #metadata-overlay h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #fff;
        }

        #metadata-overlay .meta-row {
            display: flex;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        #metadata-overlay .meta-key {
            color: #888;
            min-width: 80px;
        }

        #metadata-overlay .meta-val {
            color: #eee;
            word-break: break-all;
        }

        #metadata-overlay .meta-empty {
            color: #666;
            font-style: italic;
        }

        @media (orientation: landscape) {
            #portrait-histogram {
                display: none !important;
            }
        }

        #screen-wrapper:fullscreen #portrait-histogram,
        .ios-fullscreen-fix #portrait-histogram {
            display: none !important;
        }

        /* ── Portrait Histogram Modes ── */
        .p-hist-fold-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 8px;
            user-select: none;
        }

        /* [상태 0] 1st phase: 원본 컬러 바닥면 (12px) - 아이콘: ▼ */
        #portrait-histogram.p-hist-mode-0 {
            height: 12px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        #portrait-histogram.p-hist-mode-0 .p-hist-graph-area {
            display: none;
        }

        #portrait-histogram.p-hist-mode-0 .p-hist-color {
            /* no override: real palette colors show naturally */
        }

        #portrait-histogram.p-hist-mode-0 .p-hist-fold-btn {
            font-size: 14px;
        }

        /* [상태 1] 2nd phase: 풀 사이즈 (58px) - 아이콘: ▲ */
        #portrait-histogram.p-hist-mode-1 {
            height: 58px;
        }

        /* [상태 2] 3rd phase: 딤드 컬러 바닥면 (12px) - 아이콘: ▼ */
        #portrait-histogram.p-hist-mode-2 {
            height: 12px;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        #portrait-histogram.p-hist-mode-2 .p-hist-graph-area {
            display: none;
        }

        #portrait-histogram.p-hist-mode-2 .p-hist-color {
            background-color: #030303 !important;
            opacity: 0.3;
        }

        #portrait-histogram.p-hist-mode-2 .p-hist-fold-btn {
            font-size: 14px;
            opacity: 0.5;
        }

        .p-hist-row {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 1px;
            cursor: pointer;
        }

        .p-hist-row.color-hidden .p-hist-color {
            opacity: 0.15;
            filter: grayscale(100%);
        }

        .l-hist-row.color-hidden {
            opacity: 0.15 !important;
            filter: grayscale(100%);
        }

        .p-hist-graph-area {
            flex: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* 푸른색 바는 최대 66% 까지만 차오름 */
        /* .p-hist-bar { position: absolute; bottom: 0; width: 80%; border-radius: 2px 2px 0 0; background-color: rgba(120, 190, 255, 0.5); } */
        /* .p-hist-bar { position: absolute; bottom: 0; width: 60%; border-radius: 2px 2px 0 0; background-color: rgba(120, 200, 255, 0.95); } */
        .p-hist-bar {
            position: absolute;
            bottom: 0;
            width: 65%;
            border-radius: 2px 2px 0 0;
            background-color: rgba(14, 252, 254, 0.5);
        }

        /* 순백의 피크 선은 0~100% 공간을 물리엔진으로 날아다님 */
        .p-hist-peak {
            position: absolute;
            width: 80%;
            height: 1px;
            background: rgba(255, 255, 255, 1);
            z-index: 2;
            transition: none;
        }

        .p-hist-color {
            height: 11px;
            border-radius: 1px;
            width: 100%;
            flex-shrink: 0;
            cursor: pointer;
        }

        /* ── 2. 가로 모드 전용 사이드카 히스토그램 (좌우 바깥 영역) ── */
        #landscape-histogram-l,
        #landscape-histogram-r {
            position: absolute;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s, width 0.3s, left 0.3s, right 0.3s;
            z-index: 10;
            pointer-events: none;
            gap: 0;
        }

        #landscape-histogram-l {
            right: 100%;
        }

        #landscape-histogram-r {
            left: 100%;
        }

        @media (orientation: portrait) {

            #landscape-histogram-l,
            #landscape-histogram-r {
                display: none !important;
            }
        }

        /* [상태 0] 접힘 상태 (아이콘만 표시) */
        #landscape-histogram-l.hist-mode-0,
        #landscape-histogram-r.hist-mode-0 {
            opacity: 1;
            width: 30px;
            background-color: transparent;
            pointer-events: none;
        }

        #canvas-area.osd-visible #landscape-histogram-l.hist-mode-0,
        #canvas-area.paused #landscape-histogram-l.hist-mode-0,
        #canvas-area.osd-visible #landscape-histogram-r.hist-mode-0,
        #canvas-area.paused #landscape-histogram-r.hist-mode-0 {
            opacity: 1;
        }

        #landscape-histogram-l.hist-mode-0 .l-hist-row,
        #landscape-histogram-r.hist-mode-0 .l-hist-row {
            display: none;
        }

        /* [상태 1] 컬러 띠 (아이콘 + 얇은 띠) */
        #landscape-histogram-l.hist-mode-1,
        #landscape-histogram-r.hist-mode-1 {
            opacity: 1;
            width: calc(100% / 64);
            min-width: 30px;
            background-color: transparent;
            pointer-events: none;
        }

        #landscape-histogram-l.hist-mode-1 .l-hist-bar,
        #landscape-histogram-r.hist-mode-1 .l-hist-bar {
            width: 100% !important;
            border-radius: 0;
        }

        /* [상태 2] 수량 로그 히스토그램 (최대 1/16 폭으로 확장, 수평으로 수량에 따라 넓이 변화) */
        #landscape-histogram-l.hist-mode-2,
        #landscape-histogram-r.hist-mode-2 {
            opacity: 1;
            width: calc(100% / 16);
            background-color: transparent;
        }

        #landscape-histogram-l.hist-mode-2 .l-hist-row {
            justify-content: flex-start;
            pointer-events: auto;
            cursor: pointer;
        }

        /* 좌측(바깥쪽)을 베이스로 오른쪽(안쪽)으로 자람 */
        #landscape-histogram-r.hist-mode-2 .l-hist-row {
            justify-content: flex-end;
            pointer-events: auto;
            cursor: pointer;
        }

        .l-hist-fold-btn {
            display: block;
            color: #888;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            padding: 10px 0;
            user-select: none;
            pointer-events: auto;
        }

        #landscape-histogram-l.hist-mode-2,
        #landscape-histogram-r.hist-mode-2 {
            pointer-events: auto;
            cursor: pointer;
        }

        /* 우측(바깥쪽)을 베이스로 왼쪽(안쪽)으로 자람 */

        #landscape-histogram-l.hist-mode-2 .l-hist-bar {
            border-radius: 0 4px 4px 0;
        }

        #landscape-histogram-r.hist-mode-2 .l-hist-bar {
            border-radius: 4px 0 0 4px;
        }

        .l-hist-row {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: center;
            /* 2nd phase 이제 수평 방향. 세로 높이는 100%로 꽉 채움. */
            width: 100%;
            margin: 0;
            padding: 0;
            gap: 0;
            overflow: visible;
        }

        .l-hist-bar {
            width: 100%;
            height: 100%;
            transition: height 0.1s, width 0.1s;
        }

        /* ── Playlist Sidebar ── */
        #playlist-sidebar {
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border);
            overflow: hidden;
            flex-grow: 1;
            flex-shrink: 1;
            min-height: 0;
        }

        #playlist-sidebar.hidden .playlist-content {
            display: none;
        }

        .playlist-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-grow: 1;
            min-height: 0;
            overflow: hidden;
        }

        .playlist-header {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
        }

        .playlist-header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
            min-width: 44px;
            min-height: 44px;
        }

        .playlist-header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-header-btn svg {
            fill: #888;
        }

        .playlist-header-btn:hover svg {
            fill: #fff;
        }

        .playlist-items {
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #555 transparent;
            min-height: 0;
            -webkit-overflow-scrolling: touch;
        }

        .playlist-item {
            padding: 10px 12px;
            font-size: 13px;
            color: #ccc;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-align: left;
            min-height: 56px;
            transition: background 0.15s;
        }

        .playlist-thumbnail {
            width: 64px;
            height: 48px;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        @media (max-width: 599px) {
            .playlist-thumbnail {
                width: 48px;
                height: 36px;
            }
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .playlist-item:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .playlist-item.active {
            background: rgba(217, 83, 79, 0.2);
            color: #fff;
            font-weight: 600;
            border-left: 3px solid var(--accent);
        }

        .playlist-item-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .btn-remove-item {
            background: transparent;
            border: none;
            color: #555;
            padding: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            min-width: 44px;
            min-height: 44px;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-remove-item:hover {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .playlist-item-meta {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            flex-shrink: 0;
            text-align: right;
            line-height: 1.5;
        }

        .meta-info-icon {
            color: #fff;
            font-weight: bold;
            margin-right: 2px;
            font-family: serif;
        }

        .playlist-item-meta .meta-duration {
            color: #888;
            font-family: monospace;
        }

        #status {
            display: none;
        }

        #status-icon {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        #status-icon.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        #status-icon.success {
            border-color: #4CAF50;
        }

        #status-icon.error {
            border-color: #ff4444;
        }

        #status-icon .tooltip {
            position: absolute;
            bottom: 48px;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #ccc;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        #status-icon:hover .tooltip {
            opacity: 1;
        }

        #info-block {
            margin: 10px auto 20px;
            width: 100%;
            max-width: 960px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            font-size: 13px;
            line-height: 1.6;
            color: #aaa;
            display: none;
        }

        #info-block h3 {
            margin-top: 0;
            color: #eee;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            cursor: pointer;
        }

        #info-block h3:hover {
            color: #fff;
        }

        .info-link {
            color: var(--accent);
            text-decoration: none;
        }

        .info-link:hover {
            text-decoration: underline;
        }

        .dragover #canvas-msg-overlay,
        #playlist-sidebar.dragover {
            border-color: #4CAF50;
            color: #4CAF50;
        }
    </style>
</head>

                            viewBox="0 0 24 24" width="20" height="20">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                        </svg></div>
                </div>
                <div class="playlist-items" id="playlist-items"></div>
            </div>
        </div>
    </div>

    <div id="status">Ready</div>
    <div id="status-icon"><span class="tooltip">Ready</span>ℹ️</div>

    <div id="info-block">
        <h3>MV2 and MV Media Formats</h3>
        <p><strong>Inventor: Yeongman Seo (서영만)</strong></p>
        <p>Article: <a href="https://sharksym.blogspot.com/2025/10/slt-turbo-17-z80.html" target="_blank"
                class="info-link">https://sharksym.blogspot.com/2025/10/slt-turbo-17-z80.html</a></p>
        <h3 style="margin-top: 20px;">MV Player by Pasta & Gemini AI</h3>
    </div>

    <input type="file" id="file-input" accept=".mv,.mv2,.zip,application/octet-stream,application/zip" multiple
        style="display:none;" />

    <script>
        // ── 극한의 최적화: LUT (Look-Up Table) 사전 생성 (O(1) 연산) ──
        // 0 ~ 49152 개의 픽셀 수량에 대한 Log10 퍼센티지(0~100)를 메모리에 상주
        const maxMSXPixels = 256 * 192;
        const logLUT = new Float32Array(maxMSXPixels + 1);
        const maxLogVal = Math.log10(maxMSXPixels + 1);
        for (let i = 0; i <= maxMSXPixels; i++) {
            logLUT[i] = (Math.log10(i + 1) / maxLogVal) * 100;
        }

        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');

                this.renderImg = this.ctx.createImageData(256, 192);
                this.renderBuf32 = new Uint32Array(this.renderImg.data.buffer);
                this.renderPending = false;

                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.gainNode = this.audioCtx.createGain();
                this.gainNode.connect(this.audioCtx.destination);
                this.frames = [];
                this.fileData = null;
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.lastVolume = 1.0;
                this.playlist = [];
                this.currentPlayIndex = -1;
                this.repeatMode = 'off';
                this.shuffleList = [];
                this.isScrubbing = false;
                this.thumbQueue = [];
                this.isProcessingThumbs = false;

                // ── 상태 추가 ──
                this.timeDisplayMode = 'time'; // 'time' or 'frame'
                this.hiddenColors = new Array(16).fill(false); // 특정 색상별 렌더링 활성/비활성 여부

                // ── 피크 홀드 물리 엔진 배열 (위치 & 가속도) ──
                this.peakY = new Float32Array(16); // 피크 선의 높이 (0~100%)
                this.peakV = new Float32Array(16); // 피크 선의 속도/가속도
                this.targetCounts = new Float32Array(16); // 물리 엔진 타겟 배열
                this.actualCounts = new Float32Array(16); // 툴팁용 실제 픽셀 수

                this.timeDisplayMode = 'time'; // 'time' or 'frame'
                this.hiddenColors = new Array(16).fill(false);
                this.showGrid = false;
                this.currentRenderedFrameIdx = null;

                window.landscapeHistMode = 0;

                this.initUI();
                this.initWorker();

                // ── 분리된 루프 애니메이션 시작 ──
                this.loopHistogramPhysics();
                this.setupTooltip();
            }

            setupTooltip() {
                this.histTooltip = document.createElement('div');
                this.histTooltip.className = 'hist-tooltip';
                document.body.appendChild(this.histTooltip);

                const showTooltip = (e, i) => {
                    // Only show tooltip when paused
                    if (this.isPlaying && !this.isScrubbing) return;

                    // Only for PC browser (hover capable)
                    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

                    const count = Math.floor(this.actualCounts[i] || 0);
                    const pct = ((count / (256 * 192)) * 100).toFixed(1);
                    this.histTooltip.innerHTML = `${count}, ${pct}%`;

                    this.histTooltip.style.opacity = '1';
                    this.histTooltip.style.left = e.pageX + 'px';
                    this.histTooltip.style.top = e.pageY + 'px';
                };

                const hideTooltip = () => {
                    this.histTooltip.style.opacity = '0';
                };

                const moveTooltip = (e) => {
                    if (this.histTooltip.style.opacity === '1') {
                        this.histTooltip.style.left = e.pageX + 'px';
                        this.histTooltip.style.top = e.pageY + 'px';
                    }
                };

                setTimeout(() => {
                    for (let i = 0; i < 16; i++) {
                        const attachEvents = (row) => {
                            if (!row) return;
                            row.addEventListener('mouseenter', (e) => showTooltip(e, i));
                            row.addEventListener('mouseleave', hideTooltip);
                            row.addEventListener('mousemove', moveTooltip);
                        };

                        const pClr = document.getElementById(`p-hist-clr-${i}`);
                        if (pClr) attachEvents(pClr.closest('.p-hist-row'));

                        const lBarL = document.getElementById(`l-hist-bar-l-${i}`);
                        if (lBarL) attachEvents(lBarL.parentElement);

                        const lBarR = document.getElementById(`l-hist-bar-r-${i}`);
                        if (lBarR) attachEvents(lBarR.parentElement);
                    }
                }, 500);
            }


            setRepeatMode(mode) {
                this.repeatMode = mode;
                if (mode === 'shuffle') this.generateShuffleList();
                this.updateRepeatUI();
            }

            generateShuffleList() {
                this.shuffleList = Array.from({ length: this.playlist.length }, (_, i) => i);
                for (let i = this.shuffleList.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.shuffleList[i], this.shuffleList[j]] = [this.shuffleList[j], this.shuffleList[i]];
                }
                const currentInShuffle = this.shuffleList.indexOf(this.currentPlayIndex);
                if (currentInShuffle > -1) {
                    this.shuffleList.splice(currentInShuffle, 1);
                    this.shuffleList.unshift(this.currentPlayIndex);
                }
            }

            updateRepeatUI() {
                const btn = document.getElementById('btn-repeat');
                const icons = { off: 'icon-repeat-off', all: 'icon-repeat-all', one: 'icon-repeat-one', shuffle: 'icon-shuffle' };
                Object.values(icons).forEach(id => document.getElementById(id).style.display = 'none');
                document.getElementById(icons[this.repeatMode]).style.display = 'block';
                btn.title = `Repeat Mode: ${this.repeatMode.charAt(0).toUpperCase() + this.repeatMode.slice(1)}`;
                if (this.repeatMode !== 'off') btn.classList.add('osd-btn-active');
                else btn.classList.remove('osd-btn-active');
            }

            async handleEnded() {
                if (this.repeatMode === 'one') await this.playPlaylistItem(this.currentPlayIndex);
                else if (this.repeatMode === 'all') await this.playPlaylistItem((this.currentPlayIndex + 1) % this.playlist.length);
                else if (this.repeatMode === 'shuffle') {
                    if (this.playlist.length <= 1) await this.playPlaylistItem(this.currentPlayIndex);
                    else {
                        let curIdx = this.shuffleList.indexOf(this.currentPlayIndex);
                        let nextIdx = (curIdx + 1) % this.shuffleList.length;
                        if (nextIdx === 0) this.generateShuffleList();
                        await this.playPlaylistItem(this.shuffleList[nextIdx]);
                    }
                } else {
                    if (this.currentPlayIndex < this.playlist.length - 1) await this.playPlaylistItem(this.currentPlayIndex + 1);
                    else { this.pause(); this.pauseTime = 0; this.renderFrame(0); document.getElementById('osd-seek-slider').value = 0; document.getElementById('osd-time-cur').innerText = this.formatTime(0); }
                }
            }

            updatePlaylistUI() {
                const container = document.getElementById('playlist-items'); container.innerHTML = '';
                if (this.playlist.length === 0) { document.getElementById('canvas-area').classList.add('empty'); return; }
                else { document.getElementById('canvas-area').classList.remove('empty'); }

                this.playlist.forEach((item, index) => {
                    const el = document.createElement('div');
                    el.className = `playlist-item ${index === this.currentPlayIndex ? 'active' : ''}`;
                    el.onclick = (e) => { e.stopPropagation(); if (e.target.closest('.btn-remove-item')) return; this.playPlaylistItem(index); };
                    const thumb = document.createElement('img'); thumb.className = 'playlist-thumbnail';
                    if (item.thumbnail) thumb.src = item.thumbnail; else thumb.style.background = '#222';
                    const name = document.createElement('span'); name.className = 'playlist-item-name'; name.innerText = item.name; name.title = item.name;
                    const meta = document.createElement('span'); meta.className = 'playlist-item-meta';
                    let metaHTML = `${item.totalFrames || 0}F<br><span class="meta-duration">${this.formatTime(item.duration || 0)}</span>`;
                    if (item.hasMetadata) {
                        metaHTML = `<span class="meta-info-icon" title="Metadata Available">ⓘ</span> ` + metaHTML;
                    }
                    meta.innerHTML = metaHTML;
                    const removeBtn = document.createElement('button'); removeBtn.className = 'btn-remove-item'; removeBtn.innerHTML = '×';
                    removeBtn.onclick = (e) => { e.stopPropagation(); this.removeFromPlaylist(index); };
                    el.appendChild(thumb); el.appendChild(name); el.appendChild(meta); el.appendChild(removeBtn); container.appendChild(el);
                });
            }

            scrollToActive() {
                const container = document.getElementById('playlist-items'), activeItems = container.querySelectorAll('.playlist-item.active');
                if (activeItems.length > 0) {
                    const target = activeItems[0], targetRect = target.getBoundingClientRect(), containerRect = container.getBoundingClientRect();
                    if (targetRect.top < containerRect.top || targetRect.bottom > containerRect.bottom) container.scrollTo({ top: target.offsetTop - container.offsetTop, behavior: 'smooth' });
                }
            }

            async addToPlaylist(file, prepend = false) {
                if (!file) return;
                const item = { file, name: file.name, thumbnail: null };

                if (prepend) {
                    this.playlist.unshift(item);
                    if (this.currentPlayIndex !== -1) this.currentPlayIndex++;
                } else {
                    this.playlist.push(item);
                }

                this.updatePlaylistUI();
                this.thumbQueue.push(item);
                this.processThumbQueue();
            }

            async processThumbQueue() {
                if (this.isProcessingThumbs) return; this.isProcessingThumbs = true;
                while (this.thumbQueue.length > 0) {
                    const item = this.thumbQueue.shift(); await new Promise(r => setTimeout(r, 100));
                    const meta = await this.generateThumbnail(item.file);
                    if (meta) {
                        item.thumbnail = meta.thumb;
                        item.totalFrames = meta.totalFrames;
                        item.duration = meta.duration;
                        item.hasMetadata = meta.hasMetadata;
                        this.updatePlaylistUI();
                    }
                }
                this.isProcessingThumbs = false;
            }

            async generateThumbnail(file) {
                try {
                    let data;
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        const zip = new JSZip(); const content = await zip.loadAsync(file);
                        const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                        if (!entry) return null; data = await entry.async('uint8array');
                    } else data = new Uint8Array(await file.arrayBuffer());

                    const sig = String.fromCharCode(...data.slice(0, 8)), ver = String.fromCharCode(...data.slice(16, 21));
                    let frameOffset = 0, palette = null, totalFrames = 0, fps = 15;

                    if (sig === "MMCSD_MV" && ver === "v1.00") {
                        fps = 12; totalFrames = Math.floor((data.length - 16384) / 16384);
                        const targetFrame = totalFrames > 10 ? 10 : 0; frameOffset = 16384 + (targetFrame * 16384);
                        if (frameOffset + 16384 > data.length) return null;
                        palette = [[0, 0, 0], ...this.extractPal(data.slice(frameOffset + 13232, frameOffset + 13262), 15)];
                    } else {
                        fps = 15; const isMv2 = sig.startsWith("MV2"), head = isMv2 ? 512 : 16384;
                        if (isMv2) totalFrames = 1 + Math.floor((data.length - 16384) / 16384);
                        else totalFrames = Math.floor((data.length - 16384) / 16384);
                        const targetFrame = totalFrames > 10 ? 10 : 0; let off = head;
                        for (let i = 0; i < targetFrame; i++) { const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break; off += sz; }
                        frameOffset = off; palette = [[0, 0, 0], ...this.extractPal(data.slice(frameOffset + 12288, frameOffset + 12318), 15)];
                    }

                    let hasMetadata = false;
                    try {
                        const check = data.subarray(0x100, 0x100 + 4);
                        if (check[0] === 123) hasMetadata = true; // '{'
                    } catch (e) { }

                    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 192;
                    const ctx = canvas.getContext('2d'), img = ctx.createImageData(256, 192), buf32 = new Uint32Array(img.data.buffer);
                    for (let y = 0; y < 192; y++) {
                        for (let cx = 0; cx < 32; cx++) {
                            const off = ((y >> 3) * 32 + cx) * 8 + (y & 7);
                            const p = data[frameOffset + off], c = data[frameOffset + 6144 + off], fg = c >> 4, bg = c & 15;
                            for (let px = 0; px < 8; px++) {
                                const cIdx = (p & (1 << (7 - px))) ? fg : bg, rgb = palette[cIdx];
                                buf32[y * 256 + (cx * 8 + px)] = (255 << 24) | (rgb[2] << 16) | (rgb[1] << 8) | rgb[0];
                            }
                        }
                    }
                    ctx.putImageData(img, 0, 0); return { thumb: canvas.toDataURL('image/jpeg', 0.7), totalFrames, duration: totalFrames / fps, hasMetadata };
                } catch (e) { console.error(e); return null; }
            }

            removeFromPlaylist(index) {
                this.playlist.splice(index, 1);
                if (this.playlist.length === 0) { this.currentPlayIndex = -1; this.reset(); }
                else if (index === this.currentPlayIndex) { this.currentPlayIndex = -1; this.reset(); }
                else if (index < this.currentPlayIndex) { this.currentPlayIndex--; }
                this.updatePlaylistUI();
            }

            async playPlaylistItem(index) {
                if (index < 0 || index >= this.playlist.length) return;
                this.currentPlayIndex = index; this.updatePlaylistUI(); this.scrollToActive();
                await this.loadFile(this.playlist[index].file);
            }

            async playNextTrack() { if (this.playlist.length === 0) return; await this.playPlaylistItem((this.currentPlayIndex + 1) % this.playlist.length); }
            async playPrevTrack() { if (this.playlist.length === 0) return; let prev = this.currentPlayIndex - 1; if (prev < 0) prev = this.playlist.length - 1; await this.playPlaylistItem(prev); }

            initUI() {
                const pHist = document.getElementById('portrait-histogram');
                if (pHist) {
                    pHist.innerHTML = '<div class="p-hist-fold-btn" id="p-hist-fold">▼</div>';
                    window.portraitHistMode = 0;
                    pHist.className = `p-hist-mode-0`;

                    for (let i = 0; i < 16; i++) {
                        pHist.innerHTML += `
                        <div class="p-hist-row">
                            <div class="p-hist-graph-area">
                                <div class="p-hist-bar" id="p-hist-bar-${i}"></div>
                                <div class="p-hist-peak" id="p-hist-peak-${i}"></div>
                            </div>
                            <div class="p-hist-color" id="p-hist-clr-${i}"></div>
                        </div>`;
                    }

                    setTimeout(() => {
                        // 접기/펴기 3단계 순환 로직
                        pHist.onclick = (e) => {
                            // 개별 컬러를 컨트롤 할때는 화면 크기 조작 안함. 명시적인 빈 공간이나 아이콘 클릭 시 작동
                            if (e.target.closest('.p-hist-fold-btn') || e.target === pHist) {
                                window.portraitHistMode = (window.portraitHistMode + 1) % 3;
                                pHist.className = `p-hist-mode-${window.portraitHistMode}`;

                                const foldBtn = document.getElementById('p-hist-fold');
                                // Mode 1 = full histogram => upward triangle ▲; Mode 0,2 = basements => downward triangle ▼
                                foldBtn.innerText = window.portraitHistMode === 1 ? '▲' : '▼';

                                this.peakY.fill(0);
                                this.peakV.fill(0);
                            }
                        };
                    }, 50);

                    // Add color toggles
                    setTimeout(() => {
                        for (let i = 0; i < 16; i++) {
                            const setupToggle = (el, row) => {
                                if (!el) return;
                                el.onclick = (e) => {
                                    e.stopPropagation();
                                    this.hiddenColors[i] = !this.hiddenColors[i];
                                    if (row) row.classList.toggle('color-hidden', this.hiddenColors[i]);
                                    const lR = document.getElementById(`l-hist-bar-r-${i}`);
                                    const lL = document.getElementById(`l-hist-bar-l-${i}`);
                                    if (lR) lR.parentElement.classList.toggle('color-hidden', this.hiddenColors[i]);
                                    if (lL) lL.parentElement.classList.toggle('color-hidden', this.hiddenColors[i]);

                                    if (!this.isPlaying && this.frames.length > 0) {
                                        this.renderFrame(Math.min(Math.floor(this.pauseTime * this.fps), this.totalFrames - 1));
                                    }
                                };
                            };
                            const t1 = document.getElementById(`p-hist-clr-${i}`);
                            const t2 = document.getElementById(`p-hist-bar-${i}`);
                            const t3 = document.getElementById(`l-hist-bar-l-${i}`);
                            const t4 = document.getElementById(`l-hist-bar-r-${i}`);

                            setupToggle(t1, t1 ? t1.closest('.p-hist-row') : null);
                            setupToggle(t2 ? t2.parentElement : null, t1 ? t1.closest('.p-hist-row') : null);
                            setupToggle(t3 ? t3.parentElement : null, null);
                            setupToggle(t4 ? t4.parentElement : null, null);
                        }
                    }, 100);
                }

                const lHistL = document.getElementById('landscape-histogram-l');
                const lHistR = document.getElementById('landscape-histogram-r');
                if (lHistL && lHistR) {
                    lHistL.innerHTML = '<div class="l-hist-fold-btn" id="l-hist-fold-l">&lt;&lt;</div>';
                    lHistR.innerHTML = '<div class="l-hist-fold-btn" id="l-hist-fold-r">&gt;&gt;</div>';
                    for (let i = 0; i < 16; i++) {
                        lHistL.innerHTML += `<div class="l-hist-row"><div class="l-hist-bar" id="l-hist-bar-l-${i}"></div></div>`;
                        lHistR.innerHTML += `<div class="l-hist-row"><div class="l-hist-bar" id="l-hist-bar-r-${i}"></div></div>`;
                    }
                    setTimeout(() => {
                        const cycleFunc = (e) => {
                            e.stopPropagation();
                            window.landscapeHistMode = (window.landscapeHistMode + 1) % 3;
                            lHistL.className = `hist-mode-${window.landscapeHistMode}`;
                            lHistR.className = `hist-mode-${window.landscapeHistMode}`;

                            const isMax = window.landscapeHistMode === 2;
                            document.getElementById('l-hist-fold-l').innerText = isMax ? '>>' : '<<';
                            document.getElementById('l-hist-fold-r').innerText = isMax ? '<<' : '>>';

                            if (player.frames.length > 0) player.renderFrame(Math.floor(player.pauseTime * player.fps));
                        };
                        document.getElementById('l-hist-fold-l').onclick = cycleFunc;
                        document.getElementById('l-hist-fold-r').onclick = cycleFunc;
                        lHistL.onclick = cycleFunc;
                        lHistR.onclick = cycleFunc;
                    }, 50);
                }
            }

            reset() {
                this.pause(); this.frames = []; this.fileData = null; this.audioBuffer = null; this.rawAudio = null; this.pauseTime = 0; this.lastFrame = -1; this.duration = 0;
                this.currentRenderedFrameIdx = null;
                this.metadata = null;
                this.peakY.fill(0); this.peakV.fill(0); // 물리 배열 초기화
                const seek = document.getElementById('osd-seek-slider'); seek.value = 0; seek.disabled = true;
                document.getElementById('osd-time-cur').innerText = "00:00"; document.getElementById('osd-time-total').innerText = "00:00";
                this.ctx.fillStyle = "black"; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);


                // Info block state recovery
                const info = document.getElementById('info-block');
                if (info && info._showingMeta) {
                    info.innerHTML = info._originalHTML;
                    info._showingMeta = false;
                }
                this.updateMetadataUI();
            }

            formatTime(s) {
                const m = Math.floor(s / 60), sec = Math.floor(s % 60);
                return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
            }

            formatDisplayTime(cur, suffix = '') {
                if (this.timeDisplayMode === 'time') {
                    return this.formatTime(cur);
                } else {
                    return `${Math.floor(cur * this.fps)}${suffix}`;
                }
            }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying) return;
                    let cur = this.audioCtx.currentTime - this.startTime; if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);

                    document.getElementById('osd-seek-slider').value = (cur / this.duration) * 100;
                    document.getElementById('osd-time-cur').innerText = this.formatDisplayTime(cur, 'F');

                    if (frame < this.totalFrames) {
                        if (this.lastFrame !== frame) {
                            this.lastFrame = frame;
                            if (!this.renderPending) {
                                this.renderPending = true;
                                requestAnimationFrame(() => {
                                    this.renderFrame(frame);
                                    this.renderPending = false;
                                });
                            }
                        }
                    }
                    else this.handleEnded();
                };
            }

            async loadFile(file) {
                this.reset();
                const status = document.getElementById('status'); status.innerText = "파일 분석 중...";
                try {
                    let data;
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        const zip = new JSZip(); const content = await zip.loadAsync(file);
                        const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                        if (!entry) throw new Error("ZIP 파일 내에 .MV 또는 .MV2 파일이 없습니다.");
                        data = await entry.async('uint8array');
                    } else data = new Uint8Array(await file.arrayBuffer());
                    await this.processData(data);
                } catch (err) {
                    console.error(err); status.innerText = `에러: ${err.message} (자동으로 다음 트랙으로 넘어갑니다)`; status.style.color = "#ff4444";
                    await new Promise(r => setTimeout(r, 2000));
                    if (this.currentPlayIndex > -1) {
                        const idx = this.currentPlayIndex; this.removeFromPlaylist(idx);
                        if (this.playlist.length > 0) await this.playPlaylistItem(idx % this.playlist.length);
                        else { this.reset(); status.innerText = "모든 파일 로드 실패 또는 플레이리스트가 비어 있습니다."; }
                    }
                }
            }

            async processData(data) {
                this.fileData = data;
                const sig = String.fromCharCode(...data.slice(0, 8)), ver = String.fromCharCode(...data.slice(16, 21));
                const status = document.getElementById('status');
                try {
                    if (sig === "MMCSD_MV" && ver === "v1.00") { this.fps = 12; this.isMV1 = true; await this.parseMV1(data); }
                    else if (sig === "MMCSD_MV" && ver === "v2.00") { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, 16384); }
                    else if (sig.startsWith("MV2")) { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, 512); }
                    else throw new Error("올바른 .MV 또는 .MV2 포맷이 아닙니다.");

                    // Extract metadata JSON from offset 0x100 (search up to 16KB header end)
                    this.metadata = null;
                    try {
                        const searchEnd = Math.min(data.length, 16384);
                        let end = -1;
                        for (let i = 0x100; i < searchEnd; i++) {
                            if (data[i] === 0) { end = i; break; }
                        }
                        if (end === -1) end = searchEnd;

                        if (end > 0x100) {
                            const metaStr = new TextDecoder('utf-8').decode(data.subarray(0x100, end)).trim();
                            if (metaStr.startsWith('{')) {
                                this.metadata = JSON.parse(metaStr);
                            }
                        }
                    } catch (e) { console.warn('Metadata parse error:', e); }
                    this.updateMetadataUI();

                    this.duration = this.totalFrames / this.fps;
                    if (this.currentPlayIndex >= 0 && this.currentPlayIndex < this.playlist.length) {
                        const item = this.playlist[this.currentPlayIndex];
                        item.totalFrames = this.totalFrames; item.duration = this.duration; item.format = this.isMV1 ? 'MV1' : 'MV2'; item.fps = this.fps;
                        this.updatePlaylistUI();
                    }
                    const msg = `${this.isMV1 ? 'MV1' : 'MV2'} · ${this.fps}FPS · ${this.totalFrames}F`;
                    status.innerText = msg; showStatusIcon(msg, 'success');
                    document.getElementById('osd-time-total').innerText = this.formatDisplayTime(this.duration, 'F');
                    document.getElementById('osd-seek-slider').disabled = false; await this.play();
                } catch (err) { console.error(err); status.innerText = `에러: ${err.message}`; showStatusIcon(`에러: ${err.message}`, 'error'); }
            }

            updateMetadataUI() {
                const info = document.getElementById('info-block');
                const btnMeta = document.getElementById('btn-metadata-info');
                if (btnMeta) btnMeta.style.color = this.metadata ? '#fff' : '#222';

                if (info && info._showingMeta && info.style.display === 'block') {
                    if (this.metadata) {
                        let html = '<h3>ⓘ Track Metadata</h3>';
                        const formatMeta = (obj, indent = 0) => {
                            for (const [key, val] of Object.entries(obj)) {
                                if (typeof val === 'object' && val !== null) {
                                    html += `<p style="margin-left:${indent}px"><strong>${key}:</strong></p>`;
                                    formatMeta(val, indent + 15);
                                } else {
                                    html += `<p style="margin-left:${indent}px"><strong>${key}:</strong> ${val}</p>`;
                                }
                            }
                        };
                        formatMeta(this.metadata);

                    } else {
                        info.innerHTML = '<h3>ⓘ Track Metadata</h3><p style="color:#888;">No metadata available</p>';
                    }
