<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSX2 MV Player & Recorder (MV1/MV2 Supported)</title>
    <script src="coi-serviceworker.js"></script>
    <script src="ffmpeg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
        }

        /* 히스토그램 레이아웃 추가 */
        #video-container {
            position: relative;
            display: flex;
            /* 가로 배치 */
            align-items: stretch;
            max-width: min(100%, calc(55vh * 4 / 3 + 80px));
            max-height: 55vh;
            width: 848px;
            /* 768px + 80px */
            transition: width 0.2s;
            background: #000;
        }

        #palette-histogram {
            width: 80px;
            background: rgba(20, 20, 20, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
            border-right: 1px solid #444;
            box-sizing: border-box;
        }

        .hist-row {
            display: flex;
            align-items: center;
            height: 5%;
            gap: 4px;
        }

        .hist-color-box {
            width: 10px;
            height: 10px;
            border: 1px solid #555;
            flex-shrink: 0;
        }

        .hist-bar {
            height: 6px;
            background-color: #00ffcc;
            border-radius: 0 1px 1px 0;
            transition: width 0.05s ease-out;
            min-width: 0px;
        }

        #canvas-area {
            position: relative;
            flex-grow: 1;
            aspect-ratio: 4 / 3;
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        #eq-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 25%;
            pointer-events: none;
            display: flex;
            /* 초기 상태 ON */
            align-items: flex-end;
            justify-content: space-between;
            padding: 2%;
            box-sizing: border-box;
            gap: 2%;
            z-index: 10;
        }

        .overlay-eq-bar {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.25);
            height: 0%;
            border-radius: 2px 2px 0 0;
            transition: height 0.05s ease-out;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button,
        input[type="file"] {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }

        button:hover {
            background: #555;
        }

        .panel {
            background: #222;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #4CAF50;
        }

        #dashboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .dash-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dash-title {
            font-size: 12px;
            color: #888;
        }

        #vis-palette {
            display: flex;
            gap: 2px;
        }

        .pal-box {
            width: 24px;
            height: 24px;
            border: 1px solid #555;
        }

        #vis-eq {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 60px;
            border-bottom: 2px solid #555;
            width: 280px;
            justify-content: center;
        }

        .eq-bar {
            width: 12px;
            background-color: #00ffcc;
            border-radius: 2px 2px 0 0;
        }

        #btn-fullscreen {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }

        #screen-wrapper.active #btn-fullscreen:not(:disabled) {
            opacity: 1;
        }

        .drop-zone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #1a1a1a;
            margin: 20px auto;
            width: 90%;
            max-width: 600px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h2>MSX2 MV Player & Recorder (.MV / .MV2)</h2>

    <div id="screen-wrapper">
        <div id="video-container">
            <div id="palette-histogram"></div>
            <div id="canvas-area">
                <canvas id="msx-screen" width="256" height="192"></canvas>
                <div id="eq-overlay">
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                </div>
            </div>
        </div>
        <button id="btn-fullscreen" disabled title="Fullscreen">⤡</button>
    </div>

    <div id="drop-zone" class="drop-zone">
        <p>드래그 앤 드롭하거나 클릭해서 .MV, .MV2, .ZIP 파일을 선택하세요.</p>
        <input type="file" id="file-input" accept=".mv,.mv2,.zip" style="display:none;" />
    </div>

    <div class="controls">
        <button id="btn-play" disabled>▶ Play</button>
        <button id="btn-pause" disabled>⏸ Pause</button>
        <button id="btn-export" disabled>💾 Export MP4</button>

        <div class="panel" style="width: 100%; max-width: 700px; justify-content: space-between;">
            <span id="time-current" style="font-family: monospace;">00:00</span>
            <div style="display: flex; gap: 4px;">
                <button id="btn-prev-frame" style="padding: 4px 8px; font-size: 11px;">-1F</button>
                <button id="btn-next-frame" style="padding: 4px 8px; font-size: 11px;">+1F</button>
            </div>
            <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1"
                style="flex-grow: 1; margin: 0 10px;" disabled>
            <span id="time-total" style="font-family: monospace;">00:00</span>
        </div>

        <div class="panel">
            <label>📺 Size: <span id="scale-label">3x</span></label>
            <input type="range" id="scale-slider" min="1" max="5" step="1" value="3">
        </div>

        <div class="panel">
            <button id="toggle-overlay-btn"
                style="padding: 5px 10px; font-size: 14px; background-color: #d9534f">Overlay OFF</button>
            <label style="margin-left: 10px; font-size: 14px;">Opacity: <span id="opacity-label">25%</span></label>
            <input type="range" id="overlay-opacity" min="0" max="1" step="0.05" value="0.25" style="width: 60px;">
        </div>
    </div>

    <div id="status">대기 중... 파일을 선택하세요.</div>

    <div id="dashboard">
        <div class="dash-section">
            <div class="dash-title">PALETTE MEMORY</div>
            <div id="vis-palette"></div>
        </div>
        <div class="dash-section">
            <div class="dash-title">STEREO EQ SPECTRUM</div>
            <div id="vis-eq"></div>
        </div>
    </div>

    <canvas id="export-canvas" width="256" height="192" style="display:none;"></canvas>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();

        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.frames = [];
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.initUI();
                this.initWorker();
            }

            initUI() {
                // 팔레트 및 EQ 초기화
                const palContainer = document.getElementById('vis-palette');
                const histContainer = document.getElementById('palette-histogram');
                for (let i = 0; i < 16; i++) {
                    const d = document.createElement('div'); d.className = 'pal-box'; palContainer.appendChild(d);
                    const row = document.createElement('div'); row.className = 'hist-row';
                    row.innerHTML = `<div class="hist-color-box" id="hist-clr-${i}"></div><div class="hist-bar" id="hist-bar-${i}" style="width: 0%"></div>`;
                    histContainer.appendChild(row);
                }
                const eqContainer = document.getElementById('vis-eq');
                for (let i = 0; i < 19; i++) {
                    if (i === 9) { eqContainer.innerHTML += '<div class="eq-center-divider"></div>'; continue; }
                    eqContainer.innerHTML += '<div class="eq-bar" style="height:0px"></div>';
                }
            }

            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let cur = this.audioCtx.currentTime - this.startTime;
                    if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);
                    if (!this.isScrubbing) {
                        document.getElementById('seek-slider').value = (cur / this.duration) * 100;
                        document.getElementById('time-current').innerText = this.formatTime(cur);
                    }
                    if (frame < this.totalFrames) { if (this.lastFrame !== frame) { this.renderFrame(frame); this.lastFrame = frame; } } else { this.pause(); }
                };
            }

            async loadFile(file) {
                document.getElementById('status').innerText = "파일 로딩 중...";
                let data;
                if (file.name.toLowerCase().endsWith('.zip')) {
                    const zip = new JSZip(); const content = await zip.loadAsync(file);
                    const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                    data = await entry.async('uint8array');
                } else { data = new Uint8Array(await file.arrayBuffer()); }
                await this.processData(data);
            }

            async processData(data) {
                const sig = String.fromCharCode(...data.slice(0, 8));
                const ver = String.fromCharCode(...data.slice(16, 21));
                if (sig === "MMCSD_MV" && ver === "v1.00") { this.fps = 12; this.isMV1 = true; await this.parseMV1(data); }
                else { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, sig.startsWith("MV2") ? 512 : 16384); }
                this.duration = this.totalFrames / this.fps;
                document.getElementById('time-total').innerText = this.formatTime(this.duration);
                document.getElementById('status').innerText = "준비 완료!";
                ['btn-play', 'btn-export', 'btn-fullscreen', 'seek-slider'].forEach(id => document.getElementById(id).disabled = false);
            }

            async parseMV1(data) {
                this.frames = []; let off = 16384; let pcm = [];
                while (off + 16384 <= data.length) {
                    const b = data.subarray(off, off + 16384);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)], eqRaw: b.slice(13264, 13273) });
                    pcm.push(b.slice(12288, 13232)); off += 16384;
                }
                this.totalFrames = this.frames.length;
                this.rawAudio = new Uint8Array(pcm.length * 944); pcm.forEach((c, i) => this.rawAudio.set(c, i * 944));
                this.audioBuffer = this.audioCtx.createBuffer(1, this.rawAudio.length, 944 * 12);
                const ch = this.audioBuffer.getChannelData(0); for (let i = 0; i < this.rawAudio.length; i++) ch[i] = (this.rawAudio[i] - 128) / 128;
            }

            async parseMV2(data, head) {
                this.frames = []; let off = head; let mp3 = [];
                while (off < data.length) {
                    const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break;
                    const b = data.subarray(off, off + sz);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)], eqRaw: b.slice(12320, 12329) });
                    mp3.push(b.slice(12801, 12801 + (b[12800] * 32))); off += sz;
                }
                this.totalFrames = this.frames.length;
                const total = mp3.reduce((a, c) => a + c.length, 0); this.rawAudio = new Uint8Array(total);
                let cur = 0; mp3.forEach(c => { this.rawAudio.set(c, cur); cur += c.length; });
                this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudio.buffer.slice(0));
            }

            extractPal(d, n) {
                let p = []; for (let i = 0; i < n; i++) p.push([Math.round(((d[i * 2] >> 4) & 7) * 255 / 7), Math.round((d[i * 2 + 1] & 7) * 255 / 7), Math.round((d[i * 2] & 7) * 255 / 7)]); return p;
            }

            renderFrame(idx) {
                const frame = this.frames[idx];
                const img = this.ctx.createImageData(256, 192);
                const counts = new Array(16).fill(0);

                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                        const p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; counts[cIdx]++;
                            const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                this.ctx.putImageData(img, 0, 0);

                // 히스토그램 & 팔레트 업데이트 (로그 스케일)
                const maxLog = Math.log10(256 * 192 + 1);
                for (let i = 0; i < 16; i++) {
                    const rgb = frame.palette[i];
                    document.getElementById(`hist-clr-${i}`).style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                    document.getElementById(`hist-bar-${i}`).style.width = `${(Math.log10(counts[i] + 1) / maxLog) * 100}%`;
                    document.getElementsByClassName('pal-box')[i].style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                }

                // EQ 오버레이 & 대시보드
                const bars = document.getElementById('eq-overlay').children;
                const dbBars = document.getElementById('vis-eq').querySelectorAll('.eq-bar');
                for (let i = 0; i < 9; i++) {
                    const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * 100;
                    if (document.getElementById('eq-overlay').style.display !== 'none') bars[i].style.height = h + '%';
                    dbBars[i].style.height = h * 0.6 + 'px'; dbBars[17 - i].style.height = h * 0.6 + 'px';
                }
            }

            async play() {
                if (this.isPlaying) return;
                if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
                this.src = this.audioCtx.createBufferSource(); this.src.buffer = this.audioBuffer;
                this.src.connect(this.audioCtx.destination); this.src.start(0, this.pauseTime);
                this.startTime = this.audioCtx.currentTime - this.pauseTime; this.isPlaying = true;
                document.getElementById('btn-play').disabled = true; document.getElementById('btn-pause').disabled = false;
                this.timerWorker.postMessage('start');
            }

            pause() {
                if (!this.isPlaying) return; this.isPlaying = false;
                if (this.src) { try { this.src.stop(); } catch (e) { } }
                if (!this.isScrubbing) this.pauseTime = this.audioCtx.currentTime - this.startTime;
                this.timerWorker.postMessage('stop');
                document.getElementById('btn-play').disabled = false; document.getElementById('btn-pause').disabled = true;
            }
        }

        const player = new MSXMediaDemuxer('msx-screen');

        // 이벤트 리스너
        document.getElementById('file-input').addEventListener('change', e => player.loadFile(e.target.files[0]));
        document.getElementById('drop-zone').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('btn-play').addEventListener('click', () => player.play());
        document.getElementById('btn-pause').addEventListener('click', () => player.pause());

        // 프레임 이동 버튼 로직
        const moveFrame = (dir) => {
            if (!player.frames.length) return; player.pause();
            const curF = Math.floor(player.pauseTime * player.fps);
            const tarF = Math.max(0, Math.min(player.totalFrames - 1, curF + dir));
            player.pauseTime = tarF / player.fps;
            document.getElementById('seek-slider').value = (player.pauseTime / player.duration) * 100;
            document.getElementById('time-current').innerText = player.formatTime(player.pauseTime);
            player.renderFrame(tarF);
        };
        document.getElementById('btn-prev-frame').addEventListener('click', () => moveFrame(-1));
        document.getElementById('btn-next-frame').addEventListener('click', () => moveFrame(1));

        // UI 제어
        document.getElementById('scale-slider').addEventListener('input', e => {
            const s = e.target.value; document.getElementById('scale-label').innerText = s + 'x';
            document.getElementById('video-container').style.width = (256 * s + 80) + 'px';
        });

        document.getElementById('toggle-overlay-btn').addEventListener('click', e => {
            const o = document.getElementById('eq-overlay'); const isOff = o.style.display === 'none';
            o.style.display = isOff ? 'flex' : 'none';
            e.target.innerText = isOff ? 'Overlay OFF' : 'Overlay ON';
            e.target.style.backgroundColor = isOff ? '#d9534f' : '#333';
        });

        document.getElementById('overlay-opacity').addEventListener('input', e => {
            const a = e.target.value; document.getElementById('opacity-label').innerText = Math.round(a * 100) + '%';
            [...document.getElementsByClassName('overlay-eq-bar')].forEach(b => b.style.backgroundColor = `rgba(255,255,255,${a})`);
        });

        // 탐색 슬라이더
        const seek = document.getElementById('seek-slider');
        seek.addEventListener('input', e => {
            player.isScrubbing = true; player.pause();
            const time = (e.target.value / 100) * player.duration;
            document.getElementById('time-current').innerText = player.formatTime(time);
            player.renderFrame(Math.min(Math.floor(time * player.fps), player.totalFrames - 1));
        });
        seek.addEventListener('change', e => { player.pauseTime = (e.target.value / 100) * player.duration; player.isScrubbing = false; });
    </script>
</body>

</html>
