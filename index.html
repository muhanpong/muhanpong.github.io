<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSX2 MV Player (Final Integrated UI)</title>
    <script src="coi-serviceworker.js"></script>
    <script src="ffmpeg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --eq-opacity: 0.25;
        }

        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 20px;
            overflow-x: hidden;
        }

        /* 전체 화면 시 컨테이너 최적화 */
        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* PC 및 지원 브라우저 전체화면 표준 */
        #screen-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        #screen-wrapper:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
        }

        /* 아이폰/iOS 대응 유사 전체화면 클래스 */
        .ios-fullscreen-fix {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999 !important;
            margin: 0 !important;
            border: none !important;
        }

        #video-container {
            position: relative;
            display: flex;
            align-items: stretch;
            background: #000;
            width: 848px;
            /* 기본 크기: 768(256x3) + 80(히스토그램) */
            transition: width 0.2s;
        }

        /* 전체화면 시 비디오 컨테이너 크기 조정 */
        #screen-wrapper:fullscreen #video-container,
        .ios-fullscreen-fix #video-container {
            width: 100% !important;
            height: 100% !important;
            justify-content: center;
        }

        #canvas-area {
            position: relative;
            flex-grow: 1;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #000;
        }

        /* 전체화면 시 4:3 비율 유지하며 최대화 */
        #screen-wrapper:fullscreen #canvas-area,
        .ios-fullscreen-fix #canvas-area {
            flex-grow: 0;
            height: 100vh;
            width: calc(100vh * 4 / 3);
            max-width: 100vw;
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        /* EQ 오버레이 (복구) */
        #eq-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 25%;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 2%;
            box-sizing: border-box;
            gap: 2%;
            z-index: 10;
        }

        .overlay-eq-bar {
            flex: 1;
            background-color: rgba(255, 255, 255, var(--eq-opacity));
            height: 0%;
            border-radius: 1px 1px 0 0;
            transition: height 0.05s ease-out;
        }

        /* 온 스크린 컨트롤러 (유튜브 스타일) */
        #osd-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.5) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 25;
            pointer-events: none;
        }

        #canvas-area:hover #osd-controls,
        .touch-active #osd-controls {
            opacity: 1;
            pointer-events: auto;
        }

        #btn-osd-play-pause {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            fill: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .osd-bottom-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #osd-seek-slider {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #ff0000;
        }

        .osd-time {
            font-family: monospace;
            font-size: 13px;
            color: #ddd;
            min-width: 90px;
        }

        /* 히스토그램 (우측) */
        #palette-histogram {
            width: 80px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
            border-left: 1px solid #333;
            box-sizing: border-box;
            cursor: pointer;
            transition: width 0.3s, opacity 0.3s;
        }

        #palette-histogram.hidden {
            width: 0;
            padding: 0;
            opacity: 0;
            border: none;
            overflow: hidden;
        }

        .hist-row {
            display: flex;
            align-items: center;
            height: 5%;
            gap: 6px;
        }

        .hist-color-box {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .hist-bar {
            height: 8px;
            background-color: #00ffcc;
            border-radius: 0 1px 1px 0;
        }

        /* 하단 컨트롤 패널 */
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        .panel {
            background: #222;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #444;
        }

        #canvas-msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #777;
            background-color: #000;
            z-index: 5;
            border: 1px dashed #333;
            margin: 10px;
            border-radius: 4px;
        }

        #btn-fullscreen-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: white;
            padding: 5px;
            display: flex;
        }
    </style>
</head>

<body>
    <h2>MSX2 MV Player</h2>

    <div id="screen-wrapper">
        <div id="video-container">
            <div id="canvas-area">
                <canvas id="msx-screen" width="256" height="192"></canvas>

                <div id="canvas-msg-overlay">📂 Drop .MV or .ZIP here</div>

                <div id="eq-overlay">
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                </div>

                <div id="osd-controls">
                    <button id="btn-osd-play-pause">
                        <svg id="icon-play" viewBox="0 0 24 24" width="36" height="36">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" width="36" height="36" style="display:none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>

                    <div class="osd-bottom-bar">
                        <span class="osd-time"><span id="osd-time-cur">00:00</span> / <span
                                id="osd-time-total">00:00</span></span>
                        <input type="range" id="osd-seek-slider" min="0" max="100" value="0" step="0.1" disabled>
                        <button id="btn-fullscreen-toggle">
                            <svg id="icon-expand" viewBox="0 0 24 24" width="24" height="24">
                                <path
                                    d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                            </svg>
                            <svg id="icon-compress" viewBox="0 0 24 24" width="24" height="24" style="display:none;">
                                <path
                                    d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="palette-histogram" title="Click to Toggle Histogram"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-open-file" style="background:#d9534f; border:none; font-weight:bold;">📁 OPEN FILE</button>

        <div class="panel">
            <button id="toggle-eq-btn" style="background:#444">EQ ON</button>
            <label style="font-size:12px;">Opacity</label>
            <input type="range" id="eq-opacity-slider" min="0" max="1" step="0.05" value="0.25" style="width:70px;">
        </div>

        <button id="btn-prev-frame">-1F</button>
        <button id="btn-next-frame">+1F</button>
        <button id="btn-export">💾 EXPORT MP4</button>

        <div class="panel">
            <label style="font-size:12px;">Zoom</label>
            <input type="range" id="scale-slider" min="1" max="5" step="1" value="3" style="width:70px;">
        </div>
    </div>

    <div id="status" style="margin-top:10px; font-size:13px; color:#888;">Ready</div>

    <input type="file" id="file-input" accept=".mv,.mv2,.zip" style="display:none;" />

    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();

        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.frames = [];
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.initUI();
                this.initWorker();
            }

            initUI() {
                const histContainer = document.getElementById('palette-histogram');
                for (let i = 0; i < 16; i++) {
                    const row = document.createElement('div'); row.className = 'hist-row';
                    row.innerHTML = `<div class="hist-color-box" id="hist-clr-${i}"></div><div class="hist-bar" id="hist-bar-${i}" style="width: 0%"></div>`;
                    histContainer.appendChild(row);
                }
            }

            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let cur = this.audioCtx.currentTime - this.startTime;
                    if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);
                    document.getElementById('osd-seek-slider').value = (cur / this.duration) * 100;
                    document.getElementById('osd-time-cur').innerText = this.formatTime(cur);
                    if (frame < this.totalFrames) {
                        if (this.lastFrame !== frame) { this.renderFrame(frame); this.lastFrame = frame; }
                    } else { this.pause(); }
                };
            }

            reset() {
                // 1. 현재 재생 중이라면 강제 정지 (오디오 소스 및 워커 중단)
                this.pause();

                // 2. 내부 데이터 초기화
                this.frames = [];
                this.audioBuffer = null;
                this.rawAudio = null;
                this.pauseTime = 0;
                this.lastFrame = -1;
                this.duration = 0;
                this.totalFrames = 0;

                // 3. UI 리셋 (슬라이더 및 시간 표시)
                const seek = document.getElementById('osd-seek-slider');
                seek.value = 0;
                seek.disabled = true;
                document.getElementById('osd-time-cur').innerText = "00:00";
                document.getElementById('osd-time-total').innerText = "00:00";

                // 4. 화면 초기화 (검은 화면)
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                document.getElementById('status').innerText = "Resetting for new file...";
            }

            async loadFile(file) {
                // 파일 로딩 시작 시 가장 먼저 리셋을 수행합니다.
                this.reset();

                document.getElementById('canvas-msg-overlay').style.display = 'none';

                let data;
                try {
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        const zip = new JSZip();
                        const content = await zip.loadAsync(file);
                        const entry = Object.values(content.files).find(f =>
                            f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2')
                        );
                        if (!entry) throw new Error("No MV file in ZIP");
                        data = await entry.async('uint8array');
                    } else {
                        data = new Uint8Array(await file.arrayBuffer());
                    }
                    await this.processData(data);
                    // } catch (e) {
                    //     document.getElementById('status').innerText = "Error: " + e.message;
                    // }
                }

            async processData(data) {
                    const sig = String.fromCharCode(...data.slice(0, 8));
                    const ver = String.fromCharCode(...data.slice(16, 21));

                    // 1. 포맷에 따른 파싱 수행
                    if (sig === "MMCSD_MV" && ver === "v1.00") {
                        this.fps = 12;
                        this.isMV1 = true;
                        await this.parseMV1(data);
                    } else {
                        this.fps = 15;
                        this.isMV1 = false;
                        await this.parseMV2(data, sig.startsWith("MV2") ? 512 : 16384);
                    }

                    // 2. 시간 및 UI 설정
                    this.duration = this.totalFrames / this.fps;
                    document.getElementById('osd-time-total').innerText = this.formatTime(this.duration);
                    document.getElementById('osd-seek-slider').disabled = false;
                    document.getElementById('status').innerText = "Loaded: " + this.totalFrames + " frames";

                    // 3. [핵심] 로딩 완료 후 즉시 재생 시작
                    await this.play();
                }

            async parseMV1(data) {
                    this.frames = []; let off = 16384; let pcm = [];
                    while (off + 16384 <= data.length) {
                        const b = data.subarray(off, off + 16384);
                        this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)], eqRaw: b.slice(13264, 13273) });
                        pcm.push(b.slice(12288, 13232)); off += 16384;
                    }
                    this.totalFrames = this.frames.length;
                    this.rawAudio = new Uint8Array(pcm.length * 944); pcm.forEach((c, i) => this.rawAudio.set(c, i * 944));
                    this.audioBuffer = this.audioCtx.createBuffer(1, this.rawAudio.length, 944 * 12);
                    const ch = this.audioBuffer.getChannelData(0); for (let i = 0; i < this.rawAudio.length; i++) ch[i] = (this.rawAudio[i] - 128) / 128;
                }

            async parseMV2(data, head) {
                    this.frames = []; let off = head; let mp3 = [];
                    while (off < data.length) {
                        const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break;
                        const b = data.subarray(off, off + sz);
                        this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)], eqRaw: b.slice(12320, 12329) });
                        mp3.push(b.slice(12801, 12801 + (b[12800] * 32))); off += sz;
                    }
                    this.totalFrames = this.frames.length;
                    const total = mp3.reduce((a, c) => a + c.length, 0); this.rawAudio = new Uint8Array(total);
                    let cur = 0; mp3.forEach(c => { this.rawAudio.set(c, cur); cur += c.length; });
                    this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudio.buffer.slice(0));
                }

                extractPal(d, n) {
                    let p = []; for (let i = 0; i < n; i++) p.push([Math.round(((d[i * 2] >> 4) & 7) * 255 / 7), Math.round((d[i * 2 + 1] & 7) * 255 / 7), Math.round((d[i * 2] & 7) * 255 / 7)]); return p;
                }

                renderFrame(idx) {
                    const frame = this.frames[idx];
                    const img = this.ctx.createImageData(256, 192);
                    const counts = new Array(16).fill(0);

                    for (let y = 0; y < 192; y++) {
                        for (let cx = 0; cx < 32; cx++) {
                            const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                            const p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                            for (let px = 0; px < 8; px++) {
                                const cIdx = (p & (1 << (7 - px))) ? fg : bg; counts[cIdx]++;
                                const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                                img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                            }
                        }
                    }
                    this.ctx.putImageData(img, 0, 0);

                    if (!document.getElementById('palette-histogram').classList.contains('hidden')) {
                        const maxLog = Math.log10(256 * 192 + 1);
                        for (let i = 0; i < 16; i++) {
                            const rgb = frame.palette[i];
                            document.getElementById(`hist-clr-${i}`).style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                            document.getElementById(`hist-bar-${i}`).style.width = `${(Math.log10(counts[i] + 1) / maxLog) * 100}%`;
                        }
                    }

                    // 온 스크린 EQ 바 업데이트
                    const bars = document.getElementById('eq-overlay').children;
                    for (let i = 0; i < 9; i++) {
                        const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * 100;
                        if (document.getElementById('eq-overlay').style.display !== 'none') bars[i].style.height = h + '%';
                    }
                }

                togglePlay() { this.isPlaying ? this.pause() : this.play(); }
            async play() {
                    if (this.isPlaying || !this.audioBuffer) return;
                    if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
                    this.src = this.audioCtx.createBufferSource(); this.src.buffer = this.audioBuffer;
                    this.src.connect(this.audioCtx.destination); this.src.start(0, this.pauseTime);
                    this.startTime = this.audioCtx.currentTime - this.pauseTime; this.isPlaying = true;
                    this.updatePlayIcon(true); this.timerWorker.postMessage('start');
                }
                pause() {
                    if (!this.isPlaying) return; this.isPlaying = false;
                    if (this.src) { try { this.src.stop(); } catch (e) { } }
                    if (!this.isScrubbing) this.pauseTime = this.audioCtx.currentTime - this.startTime;
                    this.updatePlayIcon(false); this.timerWorker.postMessage('stop');
                }
                updatePlayIcon(playing) {
                    document.getElementById('icon-play').style.display = playing ? 'none' : 'block';
                    document.getElementById('icon-pause').style.display = playing ? 'block' : 'none';
                }
            }

            const player = new MSXMediaDemuxer('msx-screen');

        // 파일 선택
        document.getElementById('btn-open-file').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', e => { if (e.target.files.length) player.loadFile(e.target.files[0]); });

        // EQ 토글 및 투명도
        document.getElementById('toggle-eq-btn').addEventListener('click', e => {
            const eq = document.getElementById('eq-overlay');
            const isOff = eq.style.display === 'none';
            eq.style.display = isOff ? 'flex' : 'none';
            e.target.innerText = isOff ? 'EQ ON' : 'EQ OFF';
            e.target.style.backgroundColor = isOff ? '#444' : '#d9534f';
        });

        document.getElementById('eq-opacity-slider').addEventListener('input', e => {
            document.documentElement.style.setProperty('--eq-opacity', e.target.value);
        });

        // 줌 슬라이더
        document.getElementById('scale-slider').addEventListener('input', e => {
            const s = e.target.value;
            document.getElementById('video-container').style.width = (256 * s + 80) + 'px';
        });

        // 드래그 앤 드롭
        const canvasArea = document.getElementById('canvas-area');
        canvasArea.addEventListener('dragover', e => { e.preventDefault(); canvasArea.classList.add('dragover'); });
        canvasArea.addEventListener('dragleave', () => canvasArea.classList.remove('dragover'));
        canvasArea.addEventListener('drop', e => {
            e.preventDefault(); canvasArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) player.loadFile(e.dataTransfer.files[0]);
        });

        // 히스토그램 토글
        document.getElementById('palette-histogram').addEventListener('click', function () { this.classList.toggle('hidden'); });

        // 재생/슬라이더 제어
        document.getElementById('btn-osd-play-pause').addEventListener('click', () => player.togglePlay());
        const seek = document.getElementById('osd-seek-slider');
        seek.addEventListener('input', e => {
            player.isScrubbing = true; player.pause();
            const time = (e.target.value / 100) * player.duration;
            document.getElementById('osd-time-cur').innerText = player.formatTime(time);
            player.renderFrame(Math.min(Math.floor(time * player.fps), player.totalFrames - 1));
        });
        seek.addEventListener('change', e => { player.pauseTime = (e.target.value / 100) * player.duration; player.isScrubbing = false; });

        // 프레임 이동
        const moveFrame = (dir) => {
            if (!player.frames.length) return; player.pause();
            const tarF = Math.max(0, Math.min(player.totalFrames - 1, Math.floor(player.pauseTime * player.fps) + dir));
            player.pauseTime = tarF / player.fps;
            seek.value = (player.pauseTime / player.duration) * 100;
            document.getElementById('osd-time-cur').innerText = player.formatTime(player.pauseTime);
            player.renderFrame(tarF);
        };
        document.getElementById('btn-prev-frame').addEventListener('click', () => moveFrame(-1));
        document.getElementById('btn-next-frame').addEventListener('click', () => moveFrame(1));

        // 전체 화면 토글 (PC + iPhone 호환 로직)
        const btnFs = document.getElementById('btn-fullscreen-toggle');
        const screenWrapper = document.getElementById('screen-wrapper');
        const iconExpand = document.getElementById('icon-expand');
        const iconCompress = document.getElementById('icon-compress');

        const toggleFullscreen = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // 전체화면 시도
                const req = screenWrapper.requestFullscreen || screenWrapper.webkitRequestFullscreen;
                if (req) {
                    req.call(screenWrapper).catch(err => {
                        // API 거부 시 iOS용 유사 전체화면 실행
                        screenWrapper.classList.add('ios-fullscreen-fix');
                    });
                } else {
                    // 아이폰 등 API 미지원 시 유사 전체화면
                    screenWrapper.classList.add('ios-fullscreen-fix');
                }
            } else {
                // 전체화면 해제
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) exit.call(document);
                screenWrapper.classList.remove('ios-fullscreen-fix');
            }
        };

        btnFs.addEventListener('click', toggleFullscreen);

        // 상태 변화 감지 아이콘 업데이트
        const updateFsIcons = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || screenWrapper.classList.contains('ios-fullscreen-fix'));
            iconExpand.style.display = isFs ? 'none' : 'block';
            iconCompress.style.display = isFs ? 'block' : 'none';
            if (isFs) document.getElementById('palette-histogram').classList.add('hidden');
            else document.getElementById('palette-histogram').classList.remove('hidden');
        };

        document.addEventListener('fullscreenchange', updateFsIcons);
        document.addEventListener('webkitfullscreenchange', updateFsIcons);

        // 모바일 터치 시 OSD 표시 제어
        canvasArea.addEventListener('touchstart', () => {
            canvasArea.classList.add('touch-active');
            clearTimeout(window.touchTimer);
            window.touchTimer = setTimeout(() => canvasArea.classList.remove('touch-active'), 3000);
        });
    </script>
</body>

</html>
