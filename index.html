<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSX2 MV Player (YouTube Style UI)</title>
    <script src="coi-serviceworker.js"></script>
    <script src="ffmpeg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 30px;
            overflow-x: hidden;
        }

        /* 전체 화면 시 컨테이너가 화면을 꽉 채우도록 설정 */
        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
            transition: width 0.3s, height 0.3s;
        }

        #screen-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            border: none;
        }

        #video-container {
            position: relative;
            display: flex;
            align-items: stretch;
            background: #000;
            width: 848px;
            /* 768 + 80 */
            aspect-ratio: auto;
        }

        #screen-wrapper:fullscreen #video-container {
            width: 100%;
            height: 100%;
            justify-content: center;
        }

        /* 캔버스 영역 */
        #canvas-area {
            position: relative;
            flex-grow: 1;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        #screen-wrapper:fullscreen #canvas-area {
            flex-grow: 0;
            height: 100%;
            width: calc(100vh * 4 / 3);
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        /* 온 스크린 컨트롤러 그룹 (유튜브 스타일) */
        #osd-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, transparent 20%, transparent 80%, rgba(0, 0, 0, 0.4) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 25;
            pointer-events: none;
        }

        #canvas-area:hover #osd-controls,
        #canvas-area.touch-active #osd-controls {
            opacity: 1;
            pointer-events: auto;
        }

        /* 재생/일시정지 중앙 버튼 */
        #btn-osd-play-pause {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            fill: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 하단 바 (슬라이더 + 시간) */
        .osd-bottom-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        #osd-seek-slider {
            flex-grow: 1;
            cursor: pointer;
            accent-color: red;
        }

        .osd-time {
            font-family: monospace;
            font-size: 14px;
            min-width: 100px;
            text-align: left;
        }

        /* 히스토그램 (토글 가능) */
        #palette-histogram {
            width: 80px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
            border-left: 1px solid #333;
            box-sizing: border-box;
            cursor: pointer;
            transition: width 0.3s, opacity 0.3s;
        }

        #palette-histogram.hidden {
            width: 0;
            padding: 0;
            opacity: 0;
            border: none;
            overflow: hidden;
        }

        .hist-row {
            display: flex;
            align-items: center;
            height: 5%;
            gap: 6px;
        }

        .hist-color-box {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* 보더 제거, 크기 키움 */
        .hist-bar {
            height: 8px;
            background-color: #00ffcc;
            border-radius: 0 1px 1px 0;
            min-width: 0px;
        }

        /* 기타 UI */
        #canvas-msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #888;
            background-color: #000;
            z-index: 5;
            border: 1px dashed #333;
            margin: 10px;
            border-radius: 4px;
        }

        #btn-fullscreen-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: white;
            padding: 5px;
            display: flex;
            align-items: center;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }

        #dashboard {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
            width: fit-content;
            margin-inline: auto;
        }

        #vis-eq {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 50px;
            border-bottom: 2px solid #444;
            width: 200px;
            justify-content: center;
        }

        .eq-bar {
            width: 8px;
            background-color: #00ffcc;
        }
    </style>
</head>

<body>
    <h2>MSX2 MV Player</h2>

    <div id="screen-wrapper">
        <div id="video-container">
            <div id="canvas-area">
                <canvas id="msx-screen" width="256" height="192"></canvas>

                <div id="canvas-msg-overlay">📂 Drop .MV/.ZIP here</div>

                <div id="osd-controls">
                    <button id="btn-osd-play-pause">
                        <svg id="icon-play" viewBox="0 0 24 24" width="32" height="32">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg id="icon-pause" viewBox="0 0 24 24" width="32" height="32" style="display:none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>

                    <div class="osd-bottom-bar">
                        <span class="osd-time"><span id="osd-time-cur">00:00</span> / <span
                                id="osd-time-total">00:00</span></span>
                        <input type="range" id="osd-seek-slider" min="0" max="100" value="0" step="0.1" disabled>
                        <button id="btn-fullscreen-toggle">
                            <svg id="icon-expand" viewBox="0 0 24 24" width="24" height="24">
                                <path
                                    d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                            </svg>
                            <svg id="icon-compress" viewBox="0 0 24 24" width="24" height="24" style="display:none;">
                                <path
                                    d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="palette-histogram" title="Click to Toggle"></div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-open-file" style="background:#b91d1d; border:none;">📁 Open File</button>
        <button id="btn-prev-frame">-1F</button>
        <button id="btn-next-frame">+1F</button>
        <button id="btn-export">💾 Export MP4</button>
        <input type="range" id="scale-slider" min="1" max="5" step="1" value="3" title="Zoom">
    </div>

    <div id="status">Ready</div>

    <div id="dashboard">
        <div id="vis-eq"></div>
        <div style="font-size:10px; color:#666; margin-top:5px;">STEREO EQ</div>
    </div>

    <input type="file" id="file-input" accept=".mv,.mv2,.zip" style="display:none;" />
    <canvas id="export-canvas" width="256" height="192" style="display:none;"></canvas>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();

        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.frames = [];
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.initUI();
                this.initWorker();
            }

            initUI() {
                const histContainer = document.getElementById('palette-histogram');
                for (let i = 0; i < 16; i++) {
                    const row = document.createElement('div'); row.className = 'hist-row';
                    row.innerHTML = `<div class="hist-color-box" id="hist-clr-${i}"></div><div class="hist-bar" id="hist-bar-${i}" style="width: 0%"></div>`;
                    histContainer.appendChild(row);
                }
                const eqContainer = document.getElementById('vis-eq');
                for (let i = 0; i < 19; i++) {
                    if (i === 9) { eqContainer.innerHTML += '<div style="width:2px; height:10px; background:#444; margin:0 4px;"></div>'; continue; }
                    eqContainer.innerHTML += '<div class="eq-bar" style="height:0px"></div>';
                }
            }

            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let cur = this.audioCtx.currentTime - this.startTime;
                    if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);

                    document.getElementById('osd-seek-slider').value = (cur / this.duration) * 100;
                    document.getElementById('osd-time-cur').innerText = this.formatTime(cur);

                    if (frame < this.totalFrames) {
                        if (this.lastFrame !== frame) { this.renderFrame(frame); this.lastFrame = frame; }
                    } else { this.pause(); }
                };
            }

            async loadFile(file) {
                document.getElementById('canvas-msg-overlay').style.display = 'none';
                let data;
                if (file.name.toLowerCase().endsWith('.zip')) {
                    const zip = new JSZip(); const content = await zip.loadAsync(file);
                    const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                    data = await entry.async('uint8array');
                } else { data = new Uint8Array(await file.arrayBuffer()); }
                await this.processData(data);
            }

            async processData(data) {
                const sig = String.fromCharCode(...data.slice(0, 8));
                const ver = String.fromCharCode(...data.slice(16, 21));
                if (sig === "MMCSD_MV" && ver === "v1.00") { this.fps = 12; this.isMV1 = true; await this.parseMV1(data); }
                else { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, sig.startsWith("MV2") ? 512 : 16384); }
                this.duration = this.totalFrames / this.fps;
                document.getElementById('osd-time-total').innerText = this.formatTime(this.duration);
                document.getElementById('osd-seek-slider').disabled = false;
                document.getElementById('status').innerText = "Loaded: " + this.totalFrames + " frames";
            }

            async parseMV1(data) {
                this.frames = []; let off = 16384; let pcm = [];
                while (off + 16384 <= data.length) {
                    const b = data.subarray(off, off + 16384);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)], eqRaw: b.slice(13264, 13273) });
                    pcm.push(b.slice(12288, 13232)); off += 16384;
                }
                this.totalFrames = this.frames.length;
                this.rawAudio = new Uint8Array(pcm.length * 944); pcm.forEach((c, i) => this.rawAudio.set(c, i * 944));
                this.audioBuffer = this.audioCtx.createBuffer(1, this.rawAudio.length, 944 * 12);
                const ch = this.audioBuffer.getChannelData(0); for (let i = 0; i < this.rawAudio.length; i++) ch[i] = (this.rawAudio[i] - 128) / 128;
            }

            async parseMV2(data, head) {
                this.frames = []; let off = head; let mp3 = [];
                while (off < data.length) {
                    const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break;
                    const b = data.subarray(off, off + sz);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)], eqRaw: b.slice(12320, 12329) });
                    mp3.push(b.slice(12801, 12801 + (b[12800] * 32))); off += sz;
                }
                this.totalFrames = this.frames.length;
                const total = mp3.reduce((a, c) => a + c.length, 0); this.rawAudio = new Uint8Array(total);
                let cur = 0; mp3.forEach(c => { this.rawAudio.set(c, cur); cur += c.length; });
                this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudio.buffer.slice(0));
            }

            extractPal(d, n) {
                let p = []; for (let i = 0; i < n; i++) p.push([Math.round(((d[i * 2] >> 4) & 7) * 255 / 7), Math.round((d[i * 2 + 1] & 7) * 255 / 7), Math.round((d[i * 2] & 7) * 255 / 7)]); return p;
            }

            renderFrame(idx) {
                const frame = this.frames[idx];
                const img = this.ctx.createImageData(256, 192);
                const counts = new Array(16).fill(0);

                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                        const p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; counts[cIdx]++;
                            const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                this.ctx.putImageData(img, 0, 0);

                // 히스토그램 업데이트 (숨겨져 있지 않을 때만)
                if (!document.getElementById('palette-histogram').classList.contains('hidden')) {
                    const maxLog = Math.log10(256 * 192 + 1);
                    for (let i = 0; i < 16; i++) {
                        const rgb = frame.palette[i];
                        document.getElementById(`hist-clr-${i}`).style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                        document.getElementById(`hist-bar-${i}`).style.width = `${(Math.log10(counts[i] + 1) / maxLog) * 100}%`;
                    }
                }

                // EQ 대시보드 업데이트
                const dbBars = document.getElementById('vis-eq').querySelectorAll('.eq-bar');
                for (let i = 0; i < 9; i++) {
                    const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * 100;
                    dbBars[i].style.height = h * 0.5 + 'px'; dbBars[17 - i].style.height = h * 0.5 + 'px';
                }
            }

            togglePlay() { this.isPlaying ? this.pause() : this.play(); }

            async play() {
                if (this.isPlaying || !this.audioBuffer) return;
                if (this.audioCtx.state === 'suspended') await this.audioCtx.resume();
                this.src = this.audioCtx.createBufferSource(); this.src.buffer = this.audioBuffer;
                this.src.connect(this.audioCtx.destination); this.src.start(0, this.pauseTime);
                this.startTime = this.audioCtx.currentTime - this.pauseTime; this.isPlaying = true;
                this.updatePlayIcon(true);
                this.timerWorker.postMessage('start');
            }

            pause() {
                if (!this.isPlaying) return; this.isPlaying = false;
                if (this.src) { try { this.src.stop(); } catch (e) { } }
                if (!this.isScrubbing) this.pauseTime = this.audioCtx.currentTime - this.startTime;
                this.updatePlayIcon(false);
                this.timerWorker.postMessage('stop');
            }

            updatePlayIcon(playing) {
                document.getElementById('icon-play').style.display = playing ? 'none' : 'block';
                document.getElementById('icon-pause').style.display = playing ? 'block' : 'none';
            }
        }

        const player = new MSXMediaDemuxer('msx-screen');

        // 히스토그램 토글
        document.getElementById('palette-histogram').addEventListener('click', function () {
            this.classList.toggle('hidden');
        });

        // 파일 열기
        document.getElementById('btn-open-file').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', e => {
            if (e.target.files.length) player.loadFile(e.target.files[0]);
        });

        // 캔버스 드롭존
        const canvasArea = document.getElementById('canvas-area');
        canvasArea.addEventListener('dragover', e => { e.preventDefault(); canvasArea.classList.add('dragover'); });
        canvasArea.addEventListener('dragleave', () => canvasArea.classList.remove('dragover'));
        canvasArea.addEventListener('drop', e => {
            e.preventDefault(); canvasArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) player.loadFile(e.dataTransfer.files[0]);
        });

        // 재생 토글
        document.getElementById('btn-osd-play-pause').addEventListener('click', () => player.togglePlay());

        // 프레임 이동
        const moveFrame = (dir) => {
            if (!player.frames.length) return; player.pause();
            const curF = Math.floor(player.pauseTime * player.fps);
            const tarF = Math.max(0, Math.min(player.totalFrames - 1, curF + dir));
            player.pauseTime = tarF / player.fps;
            document.getElementById('osd-seek-slider').value = (player.pauseTime / player.duration) * 100;
            document.getElementById('osd-time-cur').innerText = player.formatTime(player.pauseTime);
            player.renderFrame(tarF);
        };
        document.getElementById('btn-prev-frame').addEventListener('click', () => moveFrame(-1));
        document.getElementById('btn-next-frame').addEventListener('click', () => moveFrame(1));

        // 탐색 슬라이더
        const seek = document.getElementById('osd-seek-slider');
        seek.addEventListener('input', e => {
            player.isScrubbing = true; player.pause();
            const time = (e.target.value / 100) * player.duration;
            document.getElementById('osd-time-cur').innerText = player.formatTime(time);
            player.renderFrame(Math.min(Math.floor(time * player.fps), player.totalFrames - 1));
        });
        seek.addEventListener('change', e => {
            player.pauseTime = (e.target.value / 100) * player.duration;
            player.isScrubbing = false;
        });

        // 줌 슬라이더
        document.getElementById('scale-slider').addEventListener('input', e => {
            const s = e.target.value;
            document.getElementById('video-container').style.width = (256 * s + 80) + 'px';
        });

        // 전체 화면 토글
        const btnFs = document.getElementById('btn-fullscreen-toggle');
        const screenWrapper = document.getElementById('screen-wrapper');
        const iconExpand = document.getElementById('icon-expand');
        const iconCompress = document.getElementById('icon-compress');
        const hist = document.getElementById('palette-histogram');

        btnFs.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                screenWrapper.requestFullscreen().catch(err => alert(err.message));
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            iconExpand.style.display = isFs ? 'none' : 'block';
            iconCompress.style.display = isFs ? 'block' : 'none';
            // 전체화면 시 히스토그램 자동 숨김
            if (isFs) hist.classList.add('hidden');
            else hist.classList.remove('hidden');
        });

        // 모바일 터치 대응을 위한 클래스 토글
        canvasArea.addEventListener('touchstart', () => {
            canvasArea.classList.add('touch-active');
            clearTimeout(window.touchTimer);
            window.touchTimer = setTimeout(() => canvasArea.classList.remove('touch-active'), 3000);
        });
    </script>
</body>

</html>
