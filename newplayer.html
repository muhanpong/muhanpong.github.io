<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSX2 MV Player & Recorder (Final Integrated)</title>
    <script src="coi-serviceworker.js"></script>
    <script src="ffmpeg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --eq-opacity: 0.25;
        }

        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 20px;
            overflow-x: hidden;
        }

        /* 전체 화면 컨테이너 (iOS 주소창 잘림 방지를 위해 100dvh 우선 적용) */
        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        #screen-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        #screen-wrapper:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .ios-fullscreen-fix {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 9999 !important;
            margin: 0 !important;
            border: none !important;
        }

        #video-container {
            position: relative;
            display: flex;
            align-items: stretch;
            background: #000;
            width: 848px;
            /* 768 + 80 */
            transition: width 0.2s;
        }

        #screen-wrapper:fullscreen #video-container,
        .ios-fullscreen-fix #video-container {
            width: 100% !important;
            height: 100% !important;
            justify-content: center;
        }

        #canvas-area {
            position: relative;
            flex-grow: 1;
            aspect-ratio: 4 / 3;
            overflow: hidden;
            background: #000;
        }

        #screen-wrapper:fullscreen #canvas-area,
        .ios-fullscreen-fix #canvas-area {
            flex-grow: 0;
            height: 100vh;
            height: 100dvh;
            width: calc(100vh * 4 / 3);
            width: calc(100dvh * 4 / 3);
            max-width: 100vw;
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        /* EQ 오버레이 */
        #eq-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 25%;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 2%;
            box-sizing: border-box;
            gap: 2%;
            z-index: 10;
        }

        .overlay-eq-bar {
            flex: 1;
            background-color: rgba(255, 255, 255, var(--eq-opacity));
            height: 0%;
            border-radius: 1px 1px 0 0;
            transition: height 0.05s ease-out;
        }

        /* 온 스크린 컨트롤러 */
        #osd-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.5) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 25;
            pointer-events: none;
        }

        #canvas-area:hover #osd-controls,
        .touch-active #osd-controls {
            opacity: 1;
            pointer-events: auto;
        }

        #btn-osd-play-pause {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            cursor: pointer;
            fill: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .osd-bottom-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #osd-seek-slider {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #ff0000;
        }

        .osd-time {
            font-family: monospace;
            font-size: 13px;
            color: #ddd;
            min-width: 90px;
            text-align: left;
        }

        /* 히스토그램 */
        #palette-histogram {
            width: 80px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
            border-left: 1px solid #333;
            box-sizing: border-box;
            cursor: pointer;
            transition: width 0.3s, opacity 0.3s, border 0.3s;
        }

        #palette-histogram.hidden {
            width: 0;
            padding: 0;
            opacity: 0;
            border: none;
            overflow: hidden;
        }

        .hist-row {
            display: flex;
            align-items: center;
            height: 5%;
            gap: 6px;
        }

        .hist-color-box {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .hist-bar {
            height: 8px;
            background-color: #00ffcc;
            border-radius: 0 1px 1px 0;
        }

        /* UI 패널 */
        #canvas-msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #777;
            background-color: #000;
            z-index: 5;
            border: 1px dashed #333;
            margin: 10px;
            border-radius: 4px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        .panel {
            background: #222;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #444;
        }

        #btn-open-file {
            background: #d9534f;
            border: none;
            font-weight: bold;
        }

        #btn-fullscreen-toggle {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: white;
            padding: 5px;
            display: flex;
        }
    </style>
</head>

<body>
    <h2>MSX2 MV Player & Recorder</h2>

    <div id="screen-wrapper">

                <canvas id="msx-screen" width="256" height="192"></canvas>

                                    d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                            </svg>
                            <svg id="icon-compress" viewBox="0 0 24 24" width="24" height="24" style="display:none;">
                                <path
                                    d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="palette-histogram" title="Click to Toggle Histogram"></div>

    </div>

    <div class="controls">
        <button id="btn-open-file">📁 OPEN FILE</button>

        <div class="panel">
            <button id="toggle-eq-btn" style="background:#444">EQ ON</button>
            <label style="font-size:12px;">Opacity</label>
            <input type="range" id="eq-opacity-slider" min="0" max="1" step="0.05" value="0.25" style="width:70px;">
        </div>

        <button id="btn-prev-frame">-1F</button>
        <button id="btn-next-frame">+1F</button>
        <button id="btn-export">💾 EXPORT MP4</button>

        <div class="panel">
            <label style="font-size:12px;">Zoom</label>
            <input type="range" id="scale-slider" min="1" max="5" step="1" value="3" style="width:70px;">
        </div>
    </div>

    <div id="status" style="margin-top:10px; font-size:13px; color:#888;">Ready</div>

    <input type="file" id="file-input" accept=".mv,.mv2,.zip" style="display:none;" />
    <canvas id="export-canvas" width="256" height="192" style="display:none;"></canvas>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();

        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.frames = [];
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.initUI();
                this.initWorker();
            }

            initUI() {
                const histContainer = document.getElementById('palette-histogram');
                for (let i = 0; i < 16; i++) {
                    const row = document.createElement('div'); row.className = 'hist-row';
                    row.innerHTML = `<div class="hist-color-box" id="hist-clr-${i}"></div><div class="hist-bar" id="hist-bar-${i}" style="width: 0%"></div>`;
                    histContainer.appendChild(row);
                }
            }

            reset() {
                this.pause();
                this.frames = [];
                this.audioBuffer = null;
                this.rawAudio = null;
                this.pauseTime = 0;
                this.lastFrame = -1;
                this.duration = 0;
                const seek = document.getElementById('osd-seek-slider');
                seek.value = 0; seek.disabled = true;
                document.getElementById('osd-time-cur').innerText = "00:00";
                document.getElementById('osd-time-total').innerText = "00:00";
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let cur = this.audioCtx.currentTime - this.startTime;
                    if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);
                    document.getElementById('osd-seek-slider').value = (cur / this.duration) * 100;
                    document.getElementById('osd-time-cur').innerText = this.formatTime(cur);
                    if (frame < this.totalFrames) {
                        if (this.lastFrame !== frame) { this.renderFrame(frame); this.lastFrame = frame; }
                    } else { this.pause(); }
                };
            }

            async loadFile(file) {
                this.reset();
                document.getElementById('canvas-msg-overlay').style.display = 'none';
                let data;
                if (file.name.toLowerCase().endsWith('.zip')) {
                    const zip = new JSZip(); const content = await zip.loadAsync(file);
                    const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                    data = await entry.async('uint8array');
                } else { data = new Uint8Array(await file.arrayBuffer()); }
                await this.processData(data);
            }

            async processData(data) {
                const sig = String.fromCharCode(...data.slice(0, 8));
                const ver = String.fromCharCode(...data.slice(16, 21));
                if (sig === "MMCSD_MV" && ver === "v1.00") { this.fps = 12; this.isMV1 = true; await this.parseMV1(data); }
                else { this.fps = 15; this.isMV1 = false; await this.parseMV2(data, sig.startsWith("MV2") ? 512 : 16384); }
                this.duration = this.totalFrames / this.fps;
                document.getElementById('osd-time-total').innerText = this.formatTime(this.duration);
                document.getElementById('osd-seek-slider').disabled = false;
                await this.play(); // 자동 재생
            }

            async parseMV1(data) {
                this.frames = []; let off = 16384; let pcm = [];
                while (off + 16384 <= data.length) {
                    const b = data.subarray(off, off + 16384);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)], eqRaw: b.slice(13264, 13273) });
                    pcm.push(b.slice(12288, 13232)); off += 16384;
                }
                this.totalFrames = this.frames.length;
                this.rawAudio = new Uint8Array(pcm.length * 944); pcm.forEach((c, i) => this.rawAudio.set(c, i * 944));
                this.audioBuffer = this.audioCtx.createBuffer(1, this.rawAudio.length, 944 * 12);
                const ch = this.audioBuffer.getChannelData(0); for (let i = 0; i < this.rawAudio.length; i++) ch[i] = (this.rawAudio[i] - 128) / 128;
            }

            async parseMV2(data, head) {
                this.frames = []; let off = head; let mp3 = [];
                while (off < data.length) {
                    const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break;
                    const b = data.subarray(off, off + sz);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)], eqRaw: b.slice(12320, 12329) });
                    mp3.push(b.slice(12801, 12801 + (b[12800] * 32))); off += sz;
                }
                this.totalFrames = this.frames.length;
                const total = mp3.reduce((a, c) => a + c.length, 0); this.rawAudio = new Uint8Array(total);
                let cur = 0; mp3.forEach(c => { this.rawAudio.set(c, cur); cur += c.length; });
                this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudio.buffer.slice(0));
            }

            extractPal(d, n) {
                let p = []; for (let i = 0; i < n; i++) p.push([Math.round(((d[i * 2] >> 4) & 7) * 255 / 7), Math.round((d[i * 2 + 1] & 7) * 255 / 7), Math.round((d[i * 2] & 7) * 255 / 7)]); return p;
            }

            renderFrame(idx) {
                const frame = this.frames[idx];
                const img = this.ctx.createImageData(256, 192);
                const counts = new Array(16).fill(0);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                        const p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; counts[cIdx]++;
                            const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                this.ctx.putImageData(img, 0, 0);

                if (!document.getElementById('palette-histogram').classList.contains('hidden')) {
                    const maxLog = Math.log10(256 * 192 + 1);
                    for (let i = 0; i < 16; i++) {
                        const rgb = frame.palette[i];
                        document.getElementById(`hist-clr-${i}`).style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                        document.getElementById(`hist-bar-${i}`).style.width = `${(Math.log10(counts[i] + 1) / maxLog) * 100}%`;
                    }
                }

                const bars = document.getElementById('eq-overlay').children;
                for (let i = 0; i < 9; i++) {
                    const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * 100;
                    if (document.getElementById('eq-overlay').style.display !== 'none') bars[i].style.height = h + '%';
                }
            }

            renderFrameToCanvas(idx, targetCtx, withOverlay = true) {
                const frame = this.frames[idx];
                const img = targetCtx.createImageData(256, 192);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8), p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                targetCtx.putImageData(img, 0, 0);

                if (withOverlay) {
                    const op = getComputedStyle(document.documentElement).getPropertyValue('--eq-opacity').trim();
                    targetCtx.fillStyle = `rgba(255,255,255,${op})`; const eqW = 256 * 0.25, eqH = 192 * 0.25, barW = (eqW / 9) - 1;
                    for (let i = 0; i < 9; i++) { const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * (eqH * 0.9); targetCtx.fillRect(2 + i * (barW + 1), eqH - h + 2, barW, Math.max(1, h)); }
                }
            }

            // async exportMP4() {
            //     const btn = document.getElementById('btn-export'); const status = document.getElementById('status');
            //     btn.disabled = true; status.innerText = "Preparing export...";
            //     if (!ffmpeg.loaded) await ffmpeg.load({ coreURL: 'ffmpeg-core.js', wasmURL: 'ffmpeg-core.wasm' });
            //     const exportCanvas = document.getElementById('export-canvas'); const exportCtx = exportCanvas.getContext('2d');
            //     const videoData = new Uint8Array(this.totalFrames * 256 * 192 * 3); let offset = 0;
            //     const includeEQ = document.getElementById('eq-overlay').style.display !== 'none';

            //     for (let i = 0; i < this.totalFrames; i++) {
            //         this.renderFrameToCanvas(i, exportCtx, includeEQ); const pix = exportCtx.getImageData(0, 0, 256, 192).data;
            //         for (let j = 0; j < pix.length; j += 4) { videoData[offset++] = pix[j]; videoData[offset++] = pix[j + 1]; videoData[offset++] = pix[j + 2]; }
            //         if (i % 50 === 0) status.innerText = `Encoding... (${i}/${this.totalFrames})`;
            //     }

            //     await ffmpeg.writeFile('video.raw', videoData);
            //     let args = [];
            //     if (this.isMV1) {
            //         await ffmpeg.writeFile('audio.raw', this.rawAudio);
            //         args = ['-f', 'rawvideo', '-pix_fmt', 'rgb24', '-s', '256x192', '-r', '12', '-i', 'video.raw', '-f', 'u8', '-ar', '11328', '-ac', '1', '-i', 'audio.raw', '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-shortest', 'output.mp4'];
            //     } else {
            //         await ffmpeg.writeFile('audio.mp3', this.rawAudio);
            //         args = ['-f', 'rawvideo', '-pix_fmt', 'rgb24', '-s', '256x192', '-r', '15', '-i', 'video.raw', '-i', 'audio.mp3', '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'copy', '-shortest', 'output.mp4'];
            //     }
            //     await ffmpeg.exec(args); const data = await ffmpeg.readFile('output.mp4');
            //     const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
            //     a.download = `msx_export_${Date.now()}.mp4`; a.click(); status.innerText = "Export Complete!"; btn.disabled = false;
            // }
            async exportMP4() {
                const btn = document.getElementById('btn-export');
                const status = document.getElementById('status');
                btn.disabled = true;
                status.innerText = "Preparing export...";

                if (!ffmpeg.loaded) await ffmpeg.load({ coreURL: 'ffmpeg-core.js', wasmURL: 'ffmpeg-core.wasm' });

                const exportCanvas = document.getElementById('export-canvas');
                const exportCtx = exportCanvas.getContext('2d');
                const videoData = new Uint8Array(this.totalFrames * 256 * 192 * 3);
                let offset = 0;
                const includeEQ = document.getElementById('eq-overlay').style.display !== 'none';
                const includeScanlines = document.getElementById('chk-scanlines').checked;

                for (let i = 0; i < this.totalFrames; i++) {
                    this.renderFrameToCanvas(i, exportCtx, includeEQ);
                    const pix = exportCtx.getImageData(0, 0, 256, 192).data;
                    for (let j = 0; j < pix.length; j += 4) {
                        videoData[offset++] = pix[j];
                        videoData[offset++] = pix[j + 1];
                        videoData[offset++] = pix[j + 2];
                    }
                    if (i % 50 === 0) {
                        status.innerText = `Encoding... (${i}/${this.totalFrames})`;
                        await new Promise(r => setTimeout(r, 0));
                    }
                }

                await ffmpeg.writeFile('video.raw', videoData);

                // [수정] 가로 줄 필터 제거 (원본 그대로 출력)
                let vfFilter = 'scale=768:576:flags=neighbor';

                let args = [];
                if (this.isMV1) {
                    await ffmpeg.writeFile('audio.raw', this.rawAudio);
                    args = [
                        '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-s', '256x192', '-r', '12', '-i', 'video.raw',
                        '-f', 'u8', '-ar', '11328', '-ac', '1', '-i', 'audio.raw',
                        '-vf', vfFilter,
                        '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-shortest', 'output.mp4'
                    ];
                } else {
                    await ffmpeg.writeFile('audio.mp3', this.rawAudio);
                    args = [
                        '-f', 'rawvideo', '-pix_fmt', 'rgb24', '-s', '256x192', '-r', '15', '-i', 'video.raw',
                        '-i', 'audio.mp3',
                        '-vf', vfFilter,
                        '-c:v', 'libx264', '-pix_fmt', 'yuv420p', '-c:a', 'copy', '-shortest', 'output.mp4'
                    ];
                }

                await ffmpeg.exec(args);
                const data = await ffmpeg.readFile('output.mp4');

                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
                a.download = `msx_export_${Date.now()}.mp4`;
                a.click();

                await ffmpeg.deleteFile('video.raw');
                await ffmpeg.deleteFile('output.mp4');
                if (this.isMV1) {
                    await ffmpeg.deleteFile('audio.raw');
                } else {
                    await ffmpeg.deleteFile('audio.mp3');
                }

                status.innerText = "Export Complete!";
                btn.disabled = false;
            }

            togglePlay() { this.isPlaying ? this.pause() : this.play(); }

            async play() {
                // 1. 이미 재생 중이거나 버퍼가 없으면 차단
                if (this.isPlaying || !this.audioBuffer) return;

                // 2. [핵심] await 대기 전에 즉시 상태를 true로 변경하여 중복 실행 방지
                this.isPlaying = true;

                if (this.audioCtx.state === 'suspended') {
                    await this.audioCtx.resume();
                }

                // 3. await로 기다리는 동안 사용자가 다른 파일을 열어서 버퍼가 날아갔다면 재생 취소
                if (!this.isPlaying || !this.audioBuffer) return;

                // 4. 이전에 생성된 좀비 오디오 소스가 남아있다면 확실히 숨통을 끊음
                if (this.src) {
                    try { this.src.stop(); } catch (e) { }
                    try { this.src.disconnect(); } catch (e) { }
                }

                this.src = this.audioCtx.createBufferSource();
                this.src.buffer = this.audioBuffer;
                this.src.connect(this.audioCtx.destination);
                this.src.start(0, this.pauseTime);
                this.startTime = this.audioCtx.currentTime - this.pauseTime;

                this.updatePlayIcon(true);
                this.timerWorker.postMessage('start');
            }

            pause() {
                // 1. 상태를 우선 false로 변경
                this.isPlaying = false;

                // 2. 현재 물려있는 오디오 소스를 즉시 파괴
                if (this.src) {
                    try { this.src.stop(); } catch (e) { }
                    try { this.src.disconnect(); } catch (e) { }
                    this.src = null; // 참조 완전히 제거
                }

                if (!this.isScrubbing) {
                    this.pauseTime = this.audioCtx.currentTime - this.startTime;
                }
                this.updatePlayIcon(false);
                this.timerWorker.postMessage('stop');
            }

            updatePlayIcon(p) {
                document.getElementById('icon-play').style.display = p ? 'none' : 'block';
                document.getElementById('icon-pause').style.display = p ? 'block' : 'none';
            }
        }

        const player = new MSXMediaDemuxer('msx-screen');

        // 브라우저 전역 Drag & Drop 차단 (오작동 방지)
        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        // 파일 열기 및 드래그 앤 드롭
        document.getElementById('btn-open-file').onclick = () => document.getElementById('file-input').click();
        document.getElementById('file-input').onchange = e => { if (e.target.files.length) player.loadFile(e.target.files[0]); };

        const canvasArea = document.getElementById('canvas-area');
        canvasArea.ondragover = e => { e.preventDefault(); canvasArea.classList.add('dragover'); };
        canvasArea.ondragleave = () => canvasArea.classList.remove('dragover');
        canvasArea.ondrop = e => { e.preventDefault(); canvasArea.classList.remove('dragover'); if (e.dataTransfer.files.length) player.loadFile(e.dataTransfer.files[0]); };

        // UI 제어 (EQ, Zoom, Histogram)
        document.getElementById('toggle-eq-btn').onclick = e => {
            const eq = document.getElementById('eq-overlay'); const isOff = eq.style.display === 'none';
            eq.style.display = isOff ? 'flex' : 'none'; e.target.innerText = isOff ? 'EQ ON' : 'EQ OFF';
            e.target.style.backgroundColor = isOff ? '#444' : '#d9534f';
        };
        document.getElementById('eq-opacity-slider').oninput = e => document.documentElement.style.setProperty('--eq-opacity', e.target.value);
        document.getElementById('scale-slider').oninput = e => document.getElementById('video-container').style.width = (256 * e.target.value + 80) + 'px';
        document.getElementById('palette-histogram').onclick = function () { this.classList.toggle('hidden'); };

        // 재생/정지, 내보내기
        document.getElementById('btn-osd-play-pause').onclick = () => player.togglePlay();
        document.getElementById('btn-export').onclick = () => player.exportMP4();

        // 슬라이더 탐색 및 자동 재생 복귀 처리
        const seek = document.getElementById('osd-seek-slider');
        let wasPlayingBeforeSeek = false;
        seek.onmousedown = seek.ontouchstart = () => { wasPlayingBeforeSeek = player.isPlaying; };
        seek.oninput = e => {
            player.isScrubbing = true;
            if (player.isPlaying) player.pause();
            const t = (e.target.value / 100) * player.duration;
            document.getElementById('osd-time-cur').innerText = player.formatTime(t);
            player.renderFrame(Math.min(Math.floor(t * player.fps), player.totalFrames - 1));
        };
        seek.onchange = e => {
            player.pauseTime = (e.target.value / 100) * player.duration;
            player.isScrubbing = false;
            if (wasPlayingBeforeSeek) player.play();
        };

        // 프레임 이동
        const moveFrame = (d) => {
            if (!player.frames.length) return; player.pause();
            const tar = Math.max(0, Math.min(player.totalFrames - 1, Math.floor(player.pauseTime * player.fps) + d));
            player.pauseTime = tar / player.fps; seek.value = (player.pauseTime / player.duration) * 100;
            document.getElementById('osd-time-cur').innerText = player.formatTime(player.pauseTime); player.renderFrame(tar);
        };
        document.getElementById('btn-prev-frame').onclick = () => moveFrame(-1);
        document.getElementById('btn-next-frame').onclick = () => moveFrame(1);

        // 전체 화면 토글 (iOS / PC 통합)
        const btnFs = document.getElementById('btn-fullscreen-toggle');
        const screenWrapper = document.getElementById('screen-wrapper');
        const iconExp = document.getElementById('icon-expand');
        const iconComp = document.getElementById('icon-compress');

        const toggleFs = () => {
            const isFs = document.fullscreenElement || document.webkitFullscreenElement || screenWrapper.classList.contains('ios-fullscreen-fix');
            if (!isFs) {
                const req = screenWrapper.requestFullscreen || screenWrapper.webkitRequestFullscreen;
                if (req) req.call(screenWrapper).catch(() => screenWrapper.classList.add('ios-fullscreen-fix'));
                else screenWrapper.classList.add('ios-fullscreen-fix');
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) exit.call(document);
                screenWrapper.classList.remove('ios-fullscreen-fix');
            }
        };
        btnFs.onclick = toggleFs;

        const updateFsUI = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || screenWrapper.classList.contains('ios-fullscreen-fix'));
            iconExp.style.display = isFs ? 'none' : 'block';
            iconComp.style.display = isFs ? 'block' : 'none';
            if (isFs) document.getElementById('palette-histogram').classList.add('hidden');
            else document.getElementById('palette-histogram').classList.remove('hidden');
        };

        document.addEventListener('fullscreenchange', updateFsUI);
        document.addEventListener('webkitfullscreenchange', updateFsUI);

        // 모바일 터치 시 OSD 표시 제어
        canvasArea.ontouchstart = () => {
            canvasArea.classList.add('touch-active');
            clearTimeout(window.tTimer);
            window.tTimer = setTimeout(() => canvasArea.classList.remove('touch-active'), 3000);
        };
    </script>
</body>

</html>
