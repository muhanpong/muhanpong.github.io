<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSX2 MV Player & Recorder (Final Integrated)</title>
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --eq-opacity: 0.25;
        }

        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 20px;
            overflow-x: hidden;
        }

        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        #screen-wrapper:fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        #screen-wrapper:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .ios-fullscreen-fix {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
            z-index: 9999 !important;
            margin: 0 !important;
            border: none !important;
        }

        #video-container {
            position: relative;
            display: flex;
            align-items: stretch;
            background: #000;
            width: 928px; /* 256*3(768) + left(80) + right(80) = 928 */
            max-width: 100vw;
            transition: width 0.2s;
        }

        #playlist-sidebar {
            width: 80px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
            box-sizing: border-box;
            transition: width 0.3s, opacity 0.3s, border 0.3s, background 0.3s;
            z-index: 30;
            overflow: hidden;
            position: relative;
        }

        #playlist-sidebar.hidden {
            width: 15px;
            opacity: 0.6;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Resizer Handle */
        #playlist-resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 15px; /* Slightly wider for easier grab */
            height: 100%;
            cursor: ew-resize;
            z-index: 35;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            transition: background 0.2s;
        }

        #playlist-resizer:hover {
            background: rgba(217, 83, 79, 0.2);
        }

        #playlist-resizer svg {
            display: none;
            fill: #fff;
            filter: drop-shadow(0 0 2px #000);
        }

        #playlist-resizer:hover svg {
            display: block;
        }

        #playlist-sidebar.hidden #playlist-resizer {
            display: none;
        }

        .playlist-content {
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 15px;
            right: 10px; /* Leave space for resizer */
        }

        .playlist-header {
            padding: 5px 2px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .playlist-header-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .playlist-header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-header-btn svg {
            fill: #888;
        }

        .playlist-header-btn:hover svg {
            fill: #fff;
        }

        .playlist-items {
            flex-grow: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #555 transparent;
            min-height: 0;
        }

        .playlist-items::-webkit-scrollbar {
            width: 4px;
        }

        .playlist-items::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 2px;
        }

        .playlist-items::-webkit-scrollbar-track {
            background: transparent;
        }

        .playlist-item {
            padding: 8px 5px;
            font-size: 10px;
            color: #ccc;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            cursor: pointer;
            text-align: left;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .playlist-item.active {
            background: rgba(217, 83, 79, 0.2);
            color: #d9534f;
            font-weight: bold;
        }

        .playlist-item-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
        }

        .btn-remove-item {
            background: transparent;
            border: none;
            color: #666;
            padding: 2px 5px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
        }

        .btn-remove-item:hover {
            color: #ff4444;
        }

        #screen-wrapper:fullscreen #video-container,
        .ios-fullscreen-fix #video-container {
            width: 100% !important;
            height: 100% !important;
            justify-content: center;
        }

        #canvas-area {
            position: relative;
            flex-grow: 1;
            aspect-ratio: 4 / 3;
            background: #000;
        }

        #screen-wrapper:fullscreen #canvas-area,
        .ios-fullscreen-fix #canvas-area {
            flex-grow: 0;
            height: 100vh;
            height: 100dvh;
            width: calc(100vh * 4 / 3);
            width: calc(100dvh * 4 / 3);
            max-width: 100vw;
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        #eq-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 25%;
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 2%;
            box-sizing: border-box;
            gap: 2%;
            z-index: 40;
            transition: opacity 0.2s;
        }

        #eq-overlay.hidden {
            opacity: 0;
        }

        .overlay-eq-bar {
            flex: 1;
            background-color: rgba(255, 255, 255, var(--eq-opacity));
            height: 0%;
            border-radius: 1px 1px 0 0;
            transition: height 0.05s ease-out;
        }

        #osd-controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, transparent 25%, transparent 75%, rgba(0, 0, 0, 0.5) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 25;
            pointer-events: none;
        }

        #canvas-area:hover #osd-controls,
        .touch-active #osd-controls,
        .paused #osd-controls {
            opacity: 1;
            pointer-events: auto;
        }

        .osd-center-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 30px;
            pointer-events: auto;
        }

        .osd-icon-btn {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            cursor: pointer;
            fill: white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.1s, border-color 0.2s;
        }

        .osd-icon-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .osd-icon-btn:active {
            transform: translate(0, 0) scale(0.9);
        }

        .osd-frame-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 5px;
            pointer-events: auto;
        }

        .osd-frame-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            fill: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px 12px;
            transition: all 0.2s;
        }

        .osd-frame-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
            fill: #fff;
        }

        .btn-osd-track {
            width: 45px;
            height: 45px;
        }

        #btn-osd-play-pause {
            width: 60px;
            height: 60px;
            position: relative;
            top: 0;
            left: 0;
            transform: none;
        }

        .btn-osd-frame {
            width: 40px;
            height: 40px;
        }

        .osd-bottom-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        #osd-seek-slider {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #ff0000;
        }

        .osd-time {
            font-family: monospace;
            font-size: 13px;
            color: #ddd;
            min-width: 90px;
            text-align: left;
        }

        .osd-volume-group {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-left: 5px;
        }

        #btn-volume {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: white;
            padding: 5px;
            display: flex;
            align-items: center;
        }

        #volume-slider {
            width: 0;
            opacity: 0;
            transition: width 0.2s, opacity 0.2s;
            cursor: pointer;
            accent-color: #fff;
        }

        .osd-volume-group:hover #volume-slider {
            width: 60px;
            opacity: 1;
        }

        #palette-histogram {
            width: 80px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 5px;
            border-right: 1px solid #333;
            box-sizing: border-box;
            cursor: pointer;
            transition: width 0.3s, opacity 0.3s, border 0.3s, background 0.3s;
            z-index: 30;
        }

        #palette-histogram.hidden {
            width: 15px;
            padding: 0;
            opacity: 0.6;
            background: rgba(255, 255, 255, 0.05);
        }

        #palette-histogram.hidden:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.1);
        }

        #palette-histogram.hidden .hist-row {
            display: none;
        }

        .hist-row {
            display: flex;
            align-items: center;
            height: 5%;
            gap: 6px;
            flex-direction: row-reverse;
        }

        .hist-color-box {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .hist-bar {
            height: 8px;
            background-color: #00ffcc;
            border-radius: 1px 0 0 1px;
        }

        #canvas-msg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #777;
            background-color: #000;
            z-index: 5;
            border: 1px dashed #333;
            margin: 10px;
            border-radius: 4px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 10px;
        }

        .panel {
            background: #222;
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            padding: 8px 15px;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #444;
        }

        #btn-open-file {
            background: #d9534f;
            border: none;
            font-weight: bold;
        }

        .save-group {
            position: relative;
            display: flex;
            align-items: center;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            overflow: visible;
        }

        .save-group:hover #audio-codec-container {
            width: 120px;
            opacity: 1;
            padding: 0 8px;
        }

        #audio-codec-container {
            width: 0;
            opacity: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            white-space: nowrap;
            gap: 5px;
        }

        #audio-codec-container.expanded {
            width: 120px;
            opacity: 1;
            padding: 0 8px;
        }

        #btn-fullscreen-toggle, #btn-repeat {
            background: transparent;
            border: none;
            cursor: pointer;
            fill: white;
            padding: 5px;
            display: flex;
        }

        .osd-btn-active {
            fill: #d9534f !important;
        }

        #btn-info-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #444;
            color: #fff;
            border-radius: 50%;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
            vertical-align: middle;
            border: 1px solid #666;
            transition: background 0.2s;
            user-select: none;
        }

        #btn-info-toggle:hover {
            background: #d9534f;
            border-color: #d9534f;
        }

        #info-block {
            margin: 20px auto;
            width: 968px;
            max-width: 100vw;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
            color: #aaa;
            display: none;
        }

        #info-block h3 {
            margin-top: 0;
            color: #eee;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .info-link {
            color: #d9534f;
            text-decoration: none;
        }

        .info-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h2>MSX2 MV Player & Recorder
        <span id="btn-info-toggle" title="Creator: Yeongman Seo (서영만) - https://sharksym.blogspot.com/2025/10/slt-turbo-17-z80.html">
            <svg viewBox="0 0 24 24" width="22" height="22">
                <path
                    d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-2h2v2zm2.07-7.75l-.9.92C13.45 12.9 13 13.5 13 15h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H8c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .88-.36 1.68-.93 2.25z" />
            </svg>
        </span>
    </h2>

    <div id="screen-wrapper">
        <div id="video-container">
            <div id="palette-histogram" title="Click to Toggle Histogram"></div>
            <div id="canvas-area">
                <canvas id="msx-screen" width="256" height="192"></canvas>
                <div id="canvas-msg-overlay">📂 Drop .MV or .ZIP here</div>

                <div id="eq-overlay">
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                    <div class="overlay-eq-bar"></div>
                </div>

                <div id="osd-controls">
                    <div class="osd-center-controls">
                        <button id="btn-osd-prev-track" class="osd-icon-btn btn-osd-track" title="Previous Track">
                            <svg viewBox="0 0 24 24" width="24" height="24">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                            </svg>
                        </button>
                        <button id="btn-osd-play-pause" class="osd-icon-btn">
                            <svg id="icon-play" viewBox="0 0 24 24" width="36" height="36">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                            <svg id="icon-pause" viewBox="0 0 24 24" width="36" height="36" style="display:none;">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                            </svg>
                        </button>
                        <button id="btn-osd-next-track" class="osd-icon-btn btn-osd-track" title="Next Track">
                            <svg viewBox="0 0 24 24" width="24" height="24">
                                <path d="M6 18l8.5-6L6 6zm9-12v12h2V6z" />
                            </svg>
                        </button>
                    </div>

                    <div class="osd-frame-controls">
                        <button id="btn-osd-prev-frame" class="osd-frame-btn" title="Previous Frame">
                            <svg viewBox="0 0 24 24" width="18" height="18">
                                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
                            </svg>
                        </button>
                        <button id="btn-osd-next-frame" class="osd-frame-btn" title="Next Frame">
                            <svg viewBox="0 0 24 24" width="18" height="18">
                                <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z" />
                            </svg>
                        </button>
                    </div>

                    <div class="osd-bottom-bar">
                        <span class="osd-time"><span id="osd-time-cur">00:00</span> / <span
                                id="osd-time-total">00:00</span></span>

                        <div class="osd-volume-group">
                            <button id="btn-volume" title="Mute/Unmute">
                                <svg id="icon-vol-on" viewBox="0 0 24 24" width="20" height="20">
                                    <path
                                        d="M3 9v6h4l5 5V5L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                                </svg>
                                <svg id="icon-vol-off" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
                                    <path
                                        d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 5L9.91 7.09 12 9.18V5z" />
                                </svg>
                            </button>
                            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                        </div>

                        <input type="range" id="osd-seek-slider" min="0" max="100" value="0" step="0.1" disabled>
                        <button id="btn-repeat" title="Repeat Mode: Off">
                            <svg id="icon-repeat-off" viewBox="0 0 24 24" width="22" height="22">
                                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" opacity="0.3" />
                            </svg>
                            <svg id="icon-repeat-all" viewBox="0 0 24 24" width="22" height="22" style="display:none;">
                                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                            </svg>
                            <svg id="icon-repeat-one" viewBox="0 0 24 24" width="22" height="22" style="display:none;">
                                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                                <text x="12" y="15" font-size="10" font-family="sans-serif" font-weight="bold" fill="white"
                                    text-anchor="middle">1</text>
                            </svg>
                            <svg id="icon-shuffle" viewBox="0 0 24 24" width="22" height="22" style="display:none;">
                                <path
                                    d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
                            </svg>
                        </button>
                        <button id="btn-fullscreen-toggle">
                            <svg id="icon-expand" viewBox="0 0 24 24" width="24" height="24">
                                <path
                                    d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                            </svg>
                            <svg id="icon-compress" viewBox="0 0 24 24" width="24" height="24" style="display:none;">
                                <path
                                    d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="playlist-sidebar" title="Click to Toggle Playlist">
                <div id="playlist-resizer">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z" />
                    </svg>
                </div>
                <div class="playlist-content">
                    <div class="playlist-header">

    <div class="controls">
        <button id="btn-open-file">📁 OPEN FILE</button>

        <div class="save-group" id="save-group">
            <button id="btn-export" title="Export MP4"
                style="display: flex; align-items: center; justify-content: center; padding: 8px; border: none; background: transparent;">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M17 18v1H6v-1h11zm-.5-6.6l-.7-.7-3.8 3.7V4h-1v10.4l-3.8-3.8-.7.7 5 5 5-5z" />

    <script>
        // const { FFmpeg } = FFmpegWASM;
        // const ffmpeg = new FFmpeg();

        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.gainNode = this.audioCtx.createGain();
                this.gainNode.connect(this.audioCtx.destination);
                this.frames = [];
                this.isPlaying = false;
                this.pauseTime = 0;
                this.fps = 15;
                this.lastVolume = 1.0;
                this.playlist = [];
                this.currentPlayIndex = -1;
                this.repeatMode = 'off'; // 'off', 'all', 'one', 'shuffle'
                this.shuffleList = [];
                this.initUI();
                this.initWorker();
            }

            setRepeatMode(mode) {
                this.repeatMode = mode;
                if (mode === 'shuffle') {
                    this.generateShuffleList();
                }
                this.updateRepeatUI();
            }

            generateShuffleList() {
                this.shuffleList = Array.from({ length: this.playlist.length }, (_, i) => i);
                for (let i = this.shuffleList.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.shuffleList[i], this.shuffleList[j]] = [this.shuffleList[j], this.shuffleList[i]];
                }
                // Move current index to front of shuffle list so we don't replay it immediately
                const currentInShuffle = this.shuffleList.indexOf(this.currentPlayIndex);
                if (currentInShuffle > -1) {
                    this.shuffleList.splice(currentInShuffle, 1);
                    this.shuffleList.unshift(this.currentPlayIndex);
                }
            }

            updateRepeatUI() {
                const btn = document.getElementById('btn-repeat');
                const icons = {
                    off: 'icon-repeat-off',
                    all: 'icon-repeat-all',
                    one: 'icon-repeat-one',
                    shuffle: 'icon-shuffle'
                };

                Object.values(icons).forEach(id => document.getElementById(id).style.display = 'none');
                document.getElementById(icons[this.repeatMode]).style.display = 'block';

                btn.title = `Repeat Mode: ${this.repeatMode.charAt(0).toUpperCase() + this.repeatMode.slice(1)}`;
                if (this.repeatMode !== 'off') {
                    btn.classList.add('osd-btn-active');
                } else {
                    btn.classList.remove('osd-btn-active');
                }
            }

            async handleEnded() {
                if (this.repeatMode === 'one') {
                    await this.playPlaylistItem(this.currentPlayIndex);
                } else if (this.repeatMode === 'all') {
                    let next = this.currentPlayIndex + 1;
                    if (next >= this.playlist.length) next = 0;
                    await this.playPlaylistItem(next);
                } else if (this.repeatMode === 'shuffle') {
                    if (this.playlist.length <= 1) {
                        await this.playPlaylistItem(this.currentPlayIndex);
                        return;
                    }
                    let currentInShuffle = this.shuffleList.indexOf(this.currentPlayIndex);
                    let nextIdxInShuffle = currentInShuffle + 1;
                    if (nextIdxInShuffle >= this.shuffleList.length) {
                        this.generateShuffleList();
                        nextIdxInShuffle = 0;
                    }
                    await this.playPlaylistItem(this.shuffleList[nextIdxInShuffle]);
                } else {
                    // Off mode - just stop or play next if there is one
                    if (this.currentPlayIndex < this.playlist.length - 1) {
                        await this.playPlaylistItem(this.currentPlayIndex + 1);
                    } else {
                        this.pause();
                        this.pauseTime = 0;
                        this.renderFrame(0);
                    }
                }
            }

            updatePlaylistUI() {
                const container = document.getElementById('playlist-items');
                container.innerHTML = '';
                this.playlist.forEach((file, index) => {
                    const item = document.createElement('div');
                    item.className = `playlist-item ${index === this.currentPlayIndex ? 'active' : ''}`;
                    item.draggable = true;

                    item.ondragstart = (e) => {
                        e.dataTransfer.setData('text/plain', index);
                        item.classList.add('dragging');
                    };

                    item.ondragend = () => {
                        item.classList.remove('dragging');
                        // Re-render to fix any visual inconsistencies after DOM manipulation during dragover
                        this.updatePlaylistUI();
                    };

                    item.ondragover = (e) => {
                        e.preventDefault();
                        const draggingItem = container.querySelector('.dragging');
                        if (draggingItem && draggingItem !== item) {
                            const rect = item.getBoundingClientRect();
                            const next = (e.clientY - rect.top) > (rect.height / 2);
                            container.insertBefore(draggingItem, next ? item.nextSibling : item);
                        }
                    };

                    item.ondrop = (e) => {
                        e.preventDefault();
                        const fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
                        const toIndex = Array.from(container.children).indexOf(item);
                        if (fromIndex !== toIndex) {
                            this.movePlaylistItem(fromIndex, toIndex);
                        }
                    };

                    item.onclick = (e) => {
                        e.stopPropagation(); // Prevent bubbling to sidebar toggle logic
                        if (e.target.closest('.btn-remove-item')) return;
                        this.playPlaylistItem(index);
                    };

                    const name = document.createElement('span');
                    name.className = 'playlist-item-name';
                    name.innerText = file.name;
                    name.title = file.name;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn-remove-item';
                    removeBtn.innerHTML = '×';
                    removeBtn.onclick = (e) => {
                        e.stopPropagation();
                        this.removeFromPlaylist(index);
                    };

                    item.appendChild(name);
                    item.appendChild(removeBtn);
                    container.appendChild(item);
                });
            }

            movePlaylistItem(from, to) {
                const item = this.playlist.splice(from, 1)[0];
                this.playlist.splice(to, 0, item);

                // Update current playing index
                if (this.currentPlayIndex === from) {
                    this.currentPlayIndex = to;
                } else if (from < this.currentPlayIndex && to >= this.currentPlayIndex) {
                    this.currentPlayIndex--;
                } else if (from > this.currentPlayIndex && to <= this.currentPlayIndex) {
                    this.currentPlayIndex++;
                }

                this.updatePlaylistUI();
            }

            async addToPlaylist(file) {
                if (!file) return;
                this.playlist.push(file);
                this.updatePlaylistUI();
                if (this.playlist.length === 1) {
                    await this.playPlaylistItem(0);
                }
            }

            removeFromPlaylist(index) {
                this.playlist.splice(index, 1);
                if (index === this.currentPlayIndex) {
                    this.currentPlayIndex = -1;
                    this.reset();
                } else if (index < this.currentPlayIndex) {
                    this.currentPlayIndex--;
                }
                this.updatePlaylistUI();
            }

            async playPlaylistItem(index) {
                if (index < 0 || index >= this.playlist.length) return;
                this.currentPlayIndex = index;
                this.updatePlaylistUI();
                await this.loadFile(this.playlist[index]);
            }

            async playNextTrack() {
                if (this.playlist.length === 0) return;
                let next = this.currentPlayIndex + 1;
                if (next >= this.playlist.length) next = 0;
                await this.playPlaylistItem(next);
            }

            async playPrevTrack() {
                if (this.playlist.length === 0) return;
                let prev = this.currentPlayIndex - 1;
                if (prev < 0) prev = this.playlist.length - 1;
                await this.playPlaylistItem(prev);
            }

            initUI() {
                const histContainer = document.getElementById('palette-histogram');
                for (let i = 0; i < 16; i++) {
                    const row = document.createElement('div'); row.className = 'hist-row';
                    row.innerHTML = `<div class="hist-color-box" id="hist-clr-${i}"></div><div class="hist-bar" id="hist-bar-${i}" style="width: 0%"></div>`;
                    histContainer.appendChild(row);
                }
            }

            reset() {
                this.pause();
                this.frames = [];
                this.audioBuffer = null;
                this.rawAudio = null;
                this.pauseTime = 0;
                this.lastFrame = -1;
                this.duration = 0;
                const seek = document.getElementById('osd-seek-slider');
                seek.value = 0; seek.disabled = true;
                document.getElementById('osd-time-cur').innerText = "00:00";
                document.getElementById('osd-time-total').innerText = "00:00";
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            }

            formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

            initWorker() {
                const blob = new Blob([`let t=null;self.onmessage=e=>{if(e.data==='start'){t=setInterval(()=>self.postMessage('tick'),16)}else{clearInterval(t);t=null}}`], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let cur = this.audioCtx.currentTime - this.startTime;
                    if (cur > this.duration) cur = this.duration;
                    const frame = Math.floor(cur * this.fps);
                    document.getElementById('osd-seek-slider').value = (cur / this.duration) * 100;
                    document.getElementById('osd-time-cur').innerText = this.formatTime(cur);
                    if (frame < this.totalFrames) {
                        if (this.lastFrame !== frame) { this.renderFrame(frame); this.lastFrame = frame; }
                    } else {
                        this.handleEnded();
                    }
                };
            }

            async loadFile(file) {
                this.reset();
                document.getElementById('canvas-msg-overlay').style.display = 'none';
                const status = document.getElementById('status');
                status.innerText = "파일 분석 중...";

                try {
                    let data;
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        status.innerText = "ZIP 압축 해제 중...";
                        const zip = new JSZip();
                        const content = await zip.loadAsync(file);
                        const entry = Object.values(content.files).find(f => f.name.toLowerCase().endsWith('.mv') || f.name.toLowerCase().endsWith('.mv2'));
                        if (!entry) throw new Error("ZIP 파일 내에 .MV 또는 .MV2 파일이 없습니다.");
                        data = await entry.async('uint8array');
                    } else {
                        data = new Uint8Array(await file.arrayBuffer());
                    }
                    await this.processData(data);
                } catch (err) {
                    console.error("File loading error:", err);
                    status.innerText = `에러: ${err.message}`;
                    status.style.color = "#ff4444";
                }
            }

            async processData(data) {
                const sig = String.fromCharCode(...data.slice(0, 8));
                const ver = String.fromCharCode(...data.slice(16, 21));
                const status = document.getElementById('status');

                try {
                    if (sig === "MMCSD_MV" && ver === "v1.00") {
                        this.fps = 12;
                        this.isMV1 = true;
                        await this.parseMV1(data);
                    } else if (sig === "MMCSD_MV" && ver === "v2.00") {
                        this.fps = 15;
                        this.isMV1 = false;
                        await this.parseMV2(data, 16384);
                    } else if (sig.startsWith("MV2")) {
                        this.fps = 15;
                        this.isMV1 = false;
                        await this.parseMV2(data, 512); // Legacy MV2
                    } else {
                        throw new Error("올바른 .MV 또는 .MV2 포맷이 아닙니다.");
                    }

                    status.innerText = `파싱 완료! (${this.isMV1 ? 'MV1' : 'MV2'}, ${this.fps}FPS, ${this.totalFrames} 프레임)`;
                    status.style.color = "#4CAF50";

                    this.duration = this.totalFrames / this.fps;
                    document.getElementById('osd-time-total').innerText = this.formatTime(this.duration);
                    document.getElementById('osd-seek-slider').disabled = false;
                    await this.play();
                } catch (err) {
                    console.error("Data processing error:", err);
                    status.innerText = `에러: ${err.message}`;
                    status.style.color = "#ff4444";
                }
            }

            async parseMV1(data) {
                this.frames = []; let off = 16384; let pcm = [];
                while (off + 16384 <= data.length) {
                    const b = data.subarray(off, off + 16384);
                    this.frames.push({ pgt: b.slice(0, 6144), ct: b.slice(6144, 12288), palette: [[0, 0, 0], ...this.extractPal(b.slice(13232, 13262), 15)], eqRaw: b.slice(13264, 13273) });
                    pcm.push(b.slice(12288, 13232)); off += 16384;
                }
                this.totalFrames = this.frames.length;
                this.rawAudio = new Uint8Array(pcm.length * 944); pcm.forEach((c, i) => this.rawAudio.set(c, i * 944));
                this.audioBuffer = this.audioCtx.createBuffer(1, this.rawAudio.length, 944 * 12);
                const ch = this.audioBuffer.getChannelData(0); for (let i = 0; i < this.rawAudio.length; i++) ch[i] = (this.rawAudio[i] - 128) / 128;
            }

            async parseMV2(data, head) {
                this.frames = []; let off = head; let mp3 = [];
                while (off < data.length) {
                    const sz = (head === 512 && off === 512) ? 15872 : 16384; if (off + sz > data.length) break;
                    const b = data.subarray(off, off + sz);
                    const mp3Chunk = b.slice(12801, 12801 + (b[12800] * 32));
                    this.frames.push({
                        pgt: b.slice(0, 6144),
                        ct: b.slice(6144, 12288),
                        palette: [[0, 0, 0], ...this.extractPal(b.slice(12288, 12318), 15)],
                        eqRaw: b.slice(12320, 12329),
                        mp3Chunk: mp3Chunk.length > 0 ? mp3Chunk : null
                    });
                    if (mp3Chunk.length > 0) mp3.push(mp3Chunk);
                    off += sz;
                }
                this.totalFrames = this.frames.length;
                const total = mp3.reduce((a, c) => a + c.length, 0);

                if (total === 0) {
                    this.audioBuffer = this.audioCtx.createBuffer(1, Math.ceil((this.totalFrames / this.fps) * 44100), 44100);
                    return;
                }

                this.rawAudio = new Uint8Array(total);
                let cur = 0; mp3.forEach(c => { this.rawAudio.set(c, cur); cur += c.length; });

                try {
                    this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudio.buffer.slice(0));

                    // [추가] iOS Safari 방어 코드: 오디오 버퍼의 길이(duration)가 오염되었는지 검사
                    if (!this.audioBuffer || !isFinite(this.audioBuffer.duration) || this.audioBuffer.duration === 0) {
                        throw new Error("iOS Safari: 불량 오디오 버퍼가 생성되었습니다.");
                    }
                } catch (err) {
                    console.warn("오디오 디코딩 실패(무음으로 대체합니다):", err);
                    // [수정] 프레임이 아예 없을 경우 length가 0이 되어 발생하는 에러 방지를 위해 최소 길이 1 보장
                    const safeLength = Math.max(1, Math.ceil((this.totalFrames / this.fps) * 44100));
                    this.audioBuffer = this.audioCtx.createBuffer(1, safeLength, 44100);
                }
            }

            extractPal(d, n) {
                let p = []; for (let i = 0; i < n; i++) p.push([Math.round(((d[i * 2] >> 4) & 7) * 255 / 7), Math.round((d[i * 2 + 1] & 7) * 255 / 7), Math.round((d[i * 2] & 7) * 255 / 7)]); return p;
            }

            renderFrame(idx) {
                const frame = this.frames[idx];
                const img = this.ctx.createImageData(256, 192);
                const counts = new Array(16).fill(0);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                        const p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; counts[cIdx]++;
                            const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                this.ctx.putImageData(img, 0, 0);

                if (!document.getElementById('palette-histogram').classList.contains('hidden')) {
                    const maxLog = Math.log10(256 * 192 + 1);
                    for (let i = 0; i < 16; i++) {
                        const rgb = frame.palette[i];
                        document.getElementById(`hist-clr-${i}`).style.backgroundColor = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
                        document.getElementById(`hist-bar-${i}`).style.width = `${(Math.log10(counts[i] + 1) / maxLog) * 100}%`;
                    }
                }

                const eqOverlay = document.getElementById('eq-overlay');
                if (!eqOverlay.classList.contains('hidden')) {
                    const bars = eqOverlay.children;
                    for (let i = 0; i < 9; i++) {
                        const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * 100;
                        bars[i].style.height = h + '%';
                    }
                }
            }

            renderFrameToCanvas(idx, targetCtx, withOverlay = true) {
                const frame = this.frames[idx];
                const img = targetCtx.createImageData(256, 192);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8), p = frame.pgt[off], c = frame.ct[off], fg = c >> 4, bg = c & 15;
                        for (let px = 0; px < 8; px++) {
                            const cIdx = (p & (1 << (7 - px))) ? fg : bg; const rgb = frame.palette[cIdx], i = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
                        }
                    }
                }
                targetCtx.putImageData(img, 0, 0);

                if (withOverlay) {
                    const op = getComputedStyle(document.documentElement).getPropertyValue('--eq-opacity').trim();
                    targetCtx.fillStyle = `rgba(255,255,255,${op})`; const eqW = 256 * 0.25, eqH = 192 * 0.25, barW = (eqW / 9) - 1;
                    for (let i = 0; i < 9; i++) { const h = ((15 - Math.min(frame.eqRaw[i], 15)) / 15) * (eqH * 0.9); targetCtx.fillRect(2 + i * (barW + 1), eqH - h + 2, barW, Math.max(1, h)); }
                }
            }

            //         alert("FFmpeg WASM 모듈을 불러오지 못했습니다.\n\n로컬 서버(http://localhost)로 실행 중인지, ffmpeg-core 파일이 같은 폴더에 있는지 확인해주세요.");

            async exportMP4() {
                if (!this.frames || this.totalFrames === 0) {
                    alert("먼저 추출할 파일을 열어주세요.");
                    return;
                }

                if (typeof window.Mp4Muxer === 'undefined') {
                    alert("mp4-muxer 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인해주세요.");
                    return;
                }

                if (typeof VideoEncoder === "undefined") {
                    alert("이 브라우저는 WebCodecs API를 지원하지 않습니다. 최신 크롬, 엣지, 사파리를 사용해주세요.");
                    return;
                }

                const btn = document.getElementById('btn-export');
                const status = document.getElementById('status');
                btn.disabled = true;
                status.innerText = "오디오 규격 변환 중 (Resampling)...";

                try {
                    const codecChoice = document.getElementById('audio-codec-select').value;
                    // For MP3 passthrough, use the original sample rate. For others, use target.
                    const originalSampleRate = this.audioBuffer ? this.audioBuffer.sampleRate : 44100;
                    const targetSampleRate = codecChoice === 'mp3' ? originalSampleRate : (codecChoice === 'opus' ? 48000 : 44100);

                    let resampledAudioBuffer = null;
                    if (codecChoice !== 'none' && codecChoice !== 'mp3') {
                        status.innerText = `오디오 규격 변환 중 (Resampling to ${targetSampleRate}Hz)...`;
                        const offlineCtx = new OfflineAudioContext(1, Math.ceil(this.duration * targetSampleRate), targetSampleRate);
                        const source = offlineCtx.createBufferSource();
                        source.buffer = this.audioBuffer;
                        source.connect(offlineCtx.destination);
                        source.start(0);
                        resampledAudioBuffer = await offlineCtx.startRendering();
                    }

                    status.innerText = "하드웨어 가속 인코딩 준비 중...";

                    const muxerConfig = {
                        target: new Mp4Muxer.ArrayBufferTarget(),
                        video: {
                            codec: 'avc',
                            width: 768,
                            height: 576
                        },
                        fastStart: 'in-memory'
                    };

                    if (codecChoice !== 'none') {
                        muxerConfig.audio = {
                            codec: codecChoice,
                            sampleRate: targetSampleRate,
                            numberOfChannels: 1
                        };
                    }

                    const muxer = new Mp4Muxer.Muxer(muxerConfig);

                    const videoEncoder = new VideoEncoder({
                        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                        error: e => console.error("비디오 인코딩 에러:", e)
                    });
                    videoEncoder.configure({
                        codec: 'avc1.42001f',
                        width: 768,
                        height: 576,
                        bitrate: 5_000_000,
                        framerate: this.fps
                    });

                    let audioEncoder = null;
                    if (codecChoice !== 'none') {
                        if (codecChoice === 'mp3') {
                            // MP3 Passthrough - bypass resampling and encoding
                            status.innerText = "MP3 원본 데이터 추출 중...";
                            const videoFrameDurationMicros = (1 / this.fps) * 1_000_000;
                            for (let i = 0; i < this.totalFrames; i++) {
                                const chunkData = this.frames[i].mp3Chunk;
                                if (chunkData && chunkData.length > 0) {
                                    // Wrap raw MP3 chunk into EncodedAudioChunk for mp4-muxer
                                    const audioChunk = new EncodedAudioChunk({
                                        type: 'key',
                                        timestamp: Math.round(i * videoFrameDurationMicros),
                                        duration: Math.round(videoFrameDurationMicros),
                                        data: chunkData
                                    });
                                    muxer.addAudioChunk(audioChunk);
                                }
                            }
                        } else {
                            // AAC/Opus Encoding
                            const audioConfig = {
                                codec: codecChoice === 'opus' ? 'opus' : 'mp4a.40.2',
                                sampleRate: targetSampleRate,
                                numberOfChannels: 1,
                                bitrate: 128_000
                            };

                            let audioSupported = false;
                            try {
                                const support = await AudioEncoder.isConfigSupported(audioConfig);
                                audioSupported = support.supported;
                            } catch (e) {
                                audioSupported = false;
                            }

                            if (audioSupported) {
                                audioEncoder = new AudioEncoder({
                                    output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
                                    error: e => console.error("오디오 인코딩 에러:", e)
                                });
                                audioEncoder.configure(audioConfig);

                                const channelData = resampledAudioBuffer.getChannelData(0);
                                const audioStep = codecChoice === 'opus' ? 960 : 1024;

                                for (let i = 0; i < channelData.length; i += audioStep) {
                                    const chunk = channelData.subarray(i, i + audioStep);
                                    const audioData = new AudioData({
                                        format: 'f32-planar',
                                        sampleRate: targetSampleRate,
                                        numberOfFrames: chunk.length,
                                        numberOfChannels: 1,
                                        timestamp: Math.round((i / targetSampleRate) * 1_000_000),
                                        data: chunk
                                    });
                                    audioEncoder.encode(audioData);
                                    audioData.close();
                                }
                            } else {
                                console.warn(`${codecChoice.toUpperCase()} 오디오 인코딩이 지원되지 않아 소리 없이 비디오만 내보냅니다.`);
                                status.innerText = "오디오 미지원: 비디오만 인코딩 중...";
                                status.style.color = "#ff9800";
                            }
                        }
                    }

                    const baseCanvas = document.createElement('canvas');
                    baseCanvas.width = 256;
                    baseCanvas.height = 192;
                    const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });

                    const scaleCanvas = document.createElement('canvas');
                    scaleCanvas.width = 768;
                    scaleCanvas.height = 576;
                    const scaleCtx = scaleCanvas.getContext('2d');
                    scaleCtx.imageSmoothingEnabled = false;

                    const includeEQ = document.getElementById('eq-overlay').style.display !== 'none';

                    // [수정 2] 1프레임당 머무르는 시간(마이크로초) 계산 (duration 에러 해결)
                    const durationMicros = Math.round((1 / this.fps) * 1_000_000);

                    for (let i = 0; i < this.totalFrames; i++) {
                        this.renderFrameToCanvas(i, baseCtx, includeEQ);
                        scaleCtx.drawImage(baseCanvas, 0, 0, 256, 192, 0, 0, 768, 576);

                        const timestampMicros = Math.round((i / this.fps) * 1_000_000);
                        const frame = new VideoFrame(scaleCanvas, {
                            timestamp: timestampMicros,
                            duration: durationMicros // 누락되었던 duration 추가
                        });

                        videoEncoder.encode(frame);
                        frame.close();

                        if (i % 30 === 0) {
                            status.innerText = `GPU 인코딩 중... (${i}/${this.totalFrames})`;
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }

                    status.innerText = "스트림 병합 및 마무리 중...";
                    await new Promise(r => setTimeout(r, 0));

                    await videoEncoder.flush();
                    await audioEncoder.flush();
                    muxer.finalize();

                    const buffer = muxer.target.buffer;
                    const blob = new Blob([buffer], { type: 'video/mp4' });

                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `msx_export_gpu_${Date.now()}.mp4`;
                    a.click();

                    status.innerText = "초고속 내보내기 완료!";
                    status.style.color = "#4CAF50";

                } catch (err) {
                    console.error("인코딩 중 예외 발생:", err);
                    status.innerText = "에러: 인코딩 실패 (콘솔 확인)";
                    status.style.color = "#ff4444";
                } finally {
                    btn.disabled = false;
                }
            }

            togglePlay() { this.isPlaying ? this.pause() : this.play(); }

            async play() {
                if (this.isPlaying || !this.audioBuffer) return;
                this.isPlaying = true;
                document.getElementById('canvas-area').classList.remove('paused');

                if (this.audioCtx.state === 'suspended') {
                    await this.audioCtx.resume();
                }

                if (!this.isPlaying || !this.audioBuffer) return;

                if (this.src) {
                    try { this.src.stop(); } catch (e) { }
                    try { this.src.disconnect(); } catch (e) { }
                }

                this.src = this.audioCtx.createBufferSource();
                this.src.buffer = this.audioBuffer;
                this.src.connect(this.gainNode);

                // [추가] pauseTime이 NaN이나 Infinity로 오염된 경우 0으로 초기화
                const safePauseTime = isFinite(this.pauseTime) ? this.pauseTime : 0;
                this.src.start(0, safePauseTime);
                this.startTime = this.audioCtx.currentTime - safePauseTime;

                this.updatePlayIcon(true);
                this.timerWorker.postMessage('start');
            }

            pause() {
                if (!this.isPlaying) return;
                this.isPlaying = false;
                document.getElementById('canvas-area').classList.add('paused');

                if (this.src) {
                    try { this.src.stop(); } catch (e) { }
                    try { this.src.disconnect(); } catch (e) { }
                    this.src = null;
                }

                if (!this.isScrubbing) {
                    this.pauseTime = this.audioCtx.currentTime - this.startTime;
                }
                this.updatePlayIcon(false);
                this.timerWorker.postMessage('stop');
            }
            updatePlayIcon(p) {
                document.getElementById('icon-play').style.display = p ? 'none' : 'block';
                document.getElementById('icon-pause').style.display = p ? 'block' : 'none';
            }
        }

        const player = new MSXMediaDemuxer('msx-screen');

        // Check codec support on load
        async function checkAudioSupport() {
            const aacConfig = { codec: 'mp4a.40.2', sampleRate: 44100, numberOfChannels: 1, bitrate: 128000 };
            const opusConfig = { codec: 'opus', sampleRate: 48000, numberOfChannels: 1, bitrate: 128000 };

            const select = document.getElementById('audio-codec-select');

            try {
                const opusSupport = await AudioEncoder.isConfigSupported(opusConfig);
                if (!opusSupport.supported) {
                    select.options[0].text += " (Unsupported)";
                    select.options[0].style.color = "#888";
                }
            } catch (e) {
                select.options[0].text += " (Error)";
            }

            try {
                const aacSupport = await AudioEncoder.isConfigSupported(aacConfig);
                if (!aacSupport.supported) {
                    select.options[1].text += " (Unsupported)";
                    select.options[1].style.color = "#888";
                }
            } catch (e) {
                select.options[1].text += " (Error)";
            }
        }
        checkAudioSupport();

        const playlistSidebar = document.getElementById('playlist-sidebar');
        const playlistItems = document.getElementById('playlist-items');
        const btnAddPlaylist = document.getElementById('btn-add-playlist');
        const btnClosePlaylist = document.getElementById('btn-close-playlist');
        const playlistResizer = document.getElementById('playlist-resizer');
        const videoContainer = document.getElementById('video-container');

        let isResizing = false;

        const startResizing = (e) => {
            isResizing = true;
            document.body.style.cursor = 'ew-resize';
            if (e.touches) e.preventDefault();
        };

        const stopResizing = () => {
            if (!isResizing) return;
            isResizing = false;
            document.body.style.cursor = 'default';
        };

        const handleResizing = (e) => {
            if (!isResizing) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const rect = videoContainer.getBoundingClientRect();
            // Calculate width from the right edge of the video container
            let newWidth = rect.right - clientX;
            
            // Constrain width
            newWidth = Math.max(80, Math.min(400, newWidth));
            
            playlistSidebar.style.width = newWidth + 'px';
            const histogramWidth = document.getElementById('palette-histogram').offsetWidth;
            videoContainer.style.width = (768 + histogramWidth + newWidth) + 'px';
            
            // Update playlist-content width to match
            document.querySelector('.playlist-content').style.width = (newWidth - 15) + 'px';
        };

        playlistResizer.addEventListener('mousedown', startResizing);
        playlistResizer.addEventListener('touchstart', startResizing, { passive: false });
        window.addEventListener('mousemove', handleResizing);
        window.addEventListener('touchmove', handleResizing, { passive: false });
        window.addEventListener('mouseup', stopResizing);
        window.addEventListener('touchend', stopResizing);

        playlistSidebar.onclick = function (e) {
            if (this.classList.contains('hidden')) {
                this.classList.remove('hidden');
                e.stopPropagation();
            } else if (e.offsetX < 15) {
                // If expanded but clicked on the handle area (left 15px of the sidebar), toggle to hidden
                this.classList.add('hidden');
                e.stopPropagation();
            }
        };

        btnClosePlaylist.onclick = (e) => {
            e.stopPropagation();
            playlistSidebar.classList.add('hidden');

        // Add button logic
        document.getElementById('btn-open-file').onclick = () => {
            document.getElementById('file-input').click();
        };

        btnAddPlaylist.onclick = (e) => {
            e.stopPropagation();
            document.getElementById('file-input').click();
        };

        // Clicking empty area in playlist should also trigger add
        playlistItems.onclick = (e) => {
            if (e.target === playlistItems) {
                document.getElementById('file-input').click();
            }
        };

        // Override file input change to add to playlist instead of just loading
        document.getElementById('file-input').onchange = e => {
            if (e.target.files.length) {
                for (let file of e.target.files) {
                    player.addToPlaylist(file);
                }
                e.target.value = ''; // Reset value to allow selecting same file again
            }
        };

        const canvasArea = document.getElementById('canvas-area');
        canvasArea.ondragover = e => { e.preventDefault(); canvasArea.classList.add('dragover'); };
        canvasArea.ondragleave = () => canvasArea.classList.remove('dragover');
        canvasArea.ondrop = async e => { 
            e.preventDefault(); 
            canvasArea.classList.remove('dragover'); 
            if (e.dataTransfer.files.length) {
                const startIndex = player.playlist.length;
                for (let file of e.dataTransfer.files) {
                    player.addToPlaylist(file);
                }
                // Play the first of the newly dropped files immediately
                await player.playPlaylistItem(startIndex);
            }
        };

        const eqOverlay = document.getElementById('eq-overlay');
        let isDraggingEq = false;
        let startY = 0;
        let startOpacity = 0.25;
        let hasMoved = false;

        const handleEqStart = (e) => {
            isDraggingEq = true;
            hasMoved = false;
            startY = e.touches ? e.touches[0].clientY : e.clientY;
            startOpacity = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--eq-opacity'));
            // Prevent default to avoid scrolling on mobile while dragging EQ
            if (e.touches) e.preventDefault();
        };

        const handleEqMove = (e) => {
            if (!isDraggingEq) return;
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;
            const deltaY = startY - currentY; // Up is positive
            if (Math.abs(deltaY) > 5) hasMoved = true;

            // Sensitivity: 100px drag = 0.5 opacity change
            let newOpacity = startOpacity + (deltaY / 200);
            newOpacity = Math.max(0.05, Math.min(1.0, newOpacity));
            document.documentElement.style.setProperty('--eq-opacity', newOpacity);
        };

        const handleEqEnd = () => {
            if (!isDraggingEq) return;
            isDraggingEq = false;
            if (!hasMoved) {
                eqOverlay.classList.toggle('hidden');
                if (player.frames.length > 0) {
                    const currentIdx = Math.max(0, Math.min(player.totalFrames - 1, Math.floor(player.pauseTime * player.fps)));
                    player.renderFrame(currentIdx);
                }
            }
        };

        eqOverlay.addEventListener('mousedown', handleEqStart);
        window.addEventListener('mousemove', handleEqMove);
        window.addEventListener('mouseup', handleEqEnd);

        eqOverlay.addEventListener('touchstart', handleEqStart, { passive: false });
        window.addEventListener('touchmove', handleEqMove, { passive: false });
        window.addEventListener('touchend', handleEqEnd);

        document.getElementById('scale-slider').oninput = e => document.getElementById('video-container').style.width = (256 * e.target.value + 80) + 'px';
        document.getElementById('palette-histogram').onclick = function () { this.classList.toggle('hidden'); };

        document.getElementById('btn-osd-play-pause').onclick = () => player.togglePlay();
        document.getElementById('btn-osd-prev-track').onclick = () => player.playPrevTrack();
        document.getElementById('btn-osd-next-track').onclick = () => player.playNextTrack();
        document.getElementById('btn-osd-prev-frame').onclick = () => moveFrame(-1);
        document.getElementById('btn-osd-next-frame').onclick = () => moveFrame(1);

        document.getElementById('btn-repeat').onclick = () => {
            const modes = ['off', 'all', 'one', 'shuffle'];
            const nextMode = modes[(modes.indexOf(player.repeatMode) + 1) % modes.length];
            player.setRepeatMode(nextMode);
        };

        const volBtn = document.getElementById('btn-volume');
        const volSlider = document.getElementById('volume-slider');
        const iconVolOn = document.getElementById('icon-vol-on');
        const iconVolOff = document.getElementById('icon-vol-off');

        volBtn.onclick = () => {
            if (player.gainNode.gain.value > 0) {
                player.lastVolume = player.gainNode.gain.value;
                player.gainNode.gain.value = 0;
                volSlider.value = 0;
                iconVolOn.style.display = 'none';
                iconVolOff.style.display = 'block';
            } else {
                player.gainNode.gain.value = player.lastVolume || 1.0;
                volSlider.value = player.gainNode.gain.value;
                iconVolOn.style.display = 'block';
                iconVolOff.style.display = 'none';
            }
        };

        volSlider.oninput = (e) => {
            const val = parseFloat(e.target.value);
            player.gainNode.gain.value = val;
            if (val > 0) {
                iconVolOn.style.display = 'block';
                iconVolOff.style.display = 'none';
            } else {
                iconVolOn.style.display = 'none';
                iconVolOff.style.display = 'block';
            }
        };

        document.getElementById('btn-export').onclick = (e) => {
            // If the container is not expanded, expand it first instead of exporting
            const container = document.getElementById('audio-codec-container');
            if (!container.classList.contains('expanded') && window.innerWidth < 768) {
                container.classList.add('expanded');
                e.stopPropagation();
                return;
            }
            player.exportMP4();
        };

        // Toggle expand on save-group click for mobile/touch
        document.getElementById('save-group').onclick = function (e) {
            if (e.target.closest('#btn-export')) return; // handled above
            document.getElementById('audio-codec-container').classList.toggle('expanded');
        };

        // Close when clicking elsewhere
        window.addEventListener('click', (e) => {
            if (!e.target.closest('#save-group')) {
                document.getElementById('audio-codec-container').classList.remove('expanded');
            }
        });

        const seek = document.getElementById('osd-seek-slider');
        let wasPlayingBeforeSeek = false;
        seek.onmousedown = seek.ontouchstart = () => { wasPlayingBeforeSeek = player.isPlaying; };
        seek.oninput = e => {
            player.isScrubbing = true;
            if (player.isPlaying) player.pause();
            const t = (e.target.value / 100) * player.duration;
            document.getElementById('osd-time-cur').innerText = player.formatTime(t);
            player.renderFrame(Math.min(Math.floor(t * player.fps), player.totalFrames - 1));
        };
        seek.onchange = e => {
            player.pauseTime = (e.target.value / 100) * player.duration;
            player.isScrubbing = false;
            if (wasPlayingBeforeSeek) player.play();
        };

        const moveFrame = (d) => {
            if (!player.frames.length) return;
            player.pause();

            // Use round to get the closest frame to current pauseTime
            const currentIdx = Math.round(player.pauseTime * player.fps);
            const tar = Math.max(0, Math.min(player.totalFrames - 1, currentIdx + d));

            player.pauseTime = tar / player.fps;
            seek.value = (player.pauseTime / player.duration) * 100;
            document.getElementById('osd-time-cur').innerText = player.formatTime(player.pauseTime);
            player.renderFrame(tar);
        };

        const btnFs = document.getElementById('btn-fullscreen-toggle');
        const screenWrapper = document.getElementById('screen-wrapper');
        const iconExp = document.getElementById('icon-expand');
        const iconComp = document.getElementById('icon-compress');

        const toggleFs = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || 
                           document.mozFullScreenElement || document.msFullscreenElement || 
                           screenWrapper.classList.contains('ios-fullscreen-fix'));
            
            if (!isFs) {
                const req = screenWrapper.requestFullscreen || screenWrapper.webkitRequestFullscreen || 
                            screenWrapper.mozRequestFullScreen || screenWrapper.msRequestFullscreen;
                if (req) {
                    req.call(screenWrapper).catch(err => {
                        console.warn("Fullscreen request failed, using fallback:", err);
                        screenWrapper.classList.add('ios-fullscreen-fix');
                        updateFsUI();
                    });
                } else {
                    screenWrapper.classList.add('ios-fullscreen-fix');
                    updateFsUI();
                }
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen || 
                             document.mozCancelFullScreen || document.msExitFullscreen;
                if (exit && (document.fullscreenElement || document.webkitFullscreenElement || 
                             document.mozFullScreenElement || document.msFullscreenElement)) {
                    exit.call(document);
                }
                screenWrapper.classList.remove('ios-fullscreen-fix');
                updateFsUI();
            }
        };
        btnFs.onclick = toggleFs;

        const updateFsUI = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || 
                           document.mozFullScreenElement || document.msFullscreenElement ||
                           screenWrapper.classList.contains('ios-fullscreen-fix'));
            
            iconExp.style.display = isFs ? 'none' : 'block';
            iconComp.style.display = isFs ? 'block' : 'none';
            
            if (isFs) {
                document.getElementById('palette-histogram').classList.add('hidden');
            } else {
                document.getElementById('palette-histogram').classList.remove('hidden');
            }
        };

        document.addEventListener('fullscreenchange', updateFsUI);
        document.addEventListener('webkitfullscreenchange', updateFsUI);
        document.addEventListener('mozfullscreenchange', updateFsUI);
        document.addEventListener('MSFullscreenChange', updateFsUI);

        const showOSD = () => {
            canvasArea.classList.add('touch-active');
            clearTimeout(window.tTimer);
            // 재생 중일 때만 3초 후 사라짐. 일시 정지(.paused) 상태면 CSS에 의해 계속 보임.
            if (player.isPlaying) {
                window.tTimer = setTimeout(() => {
                    if (player.isPlaying) canvasArea.classList.remove('touch-active');
                }, 3000);
            }
        };

        canvasArea.addEventListener('mousemove', showOSD);
        canvasArea.addEventListener('touchstart', (e) => {
            // If OSD is already hidden and playing, first touch just shows it
            if (!canvasArea.classList.contains('touch-active') && player.isPlaying) {
                showOSD();
                // Optional: prevent default if you want to block the touch from clicking underlying buttons immediately
                // e.preventDefault(); 
            } else {
                showOSD();
            }
        }, { passive: true });

        // Update showOSD when state changes
        const originalPlay = player.play.bind(player);
        player.play = async () => {
            await originalPlay();
            showOSD();
        };

        const originalPause = player.pause.bind(player);
        player.pause = () => {
            originalPause();
            showOSD();
        };

        document.getElementById('btn-info-toggle').onclick = () => {
            const info = document.getElementById('info-block');
            info.style.display = info.style.display === 'block' ? 'none' : 'block';
        };
    </script>
</body>

</html>
