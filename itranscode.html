<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MSX MV2 to MP4 Web Demuxer</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1e1e1e; color: #fff; padding: 40px; max-width: 1200px; margin: 0 auto; text-align: center; }
        .box { background: #2d2d2d; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: left; }
        button { background: #0078D7; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; margin-right: 5px; }
        button:hover { background: #005a9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        pre { background: #000; padding: 15px; border-radius: 4px; overflow-y: auto; max-height: 200px; color: #00ff00; font-family: monospace; }
        #downloadBtn { display: inline-block; background: #28a745; text-decoration: none; color: white; padding: 10px 20px; border-radius: 4px; display: none; margin-top: 10px; }
        
        /* 💡 비디오 플레이어 및 도트 픽셀 유지 스타일 */
        #playerArea { margin-top: 30px; display: none; }
        
        /* 비디오와 오버레이 버튼을 묶어주는 래퍼 */
        .player-wrapper {
            position: relative;
            display: inline-block; /* 비디오 크기에 맞춰 래퍼 크기 자동 조절 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
        }

        #player { 
            background: #000; 
            display: block;
            /* 화면이 부드럽게 커지도록 애니메이션 효과 */
            transition: width 0.3s ease, height 0.3s ease; 
            /* 💡 핵심: 레트로 픽셀이 뭉개지지 않고 선명하게 확대되게 함 */
            image-rendering: pixelated; 
        }
        
        .scale-btn { background: #444; font-size: 14px; padding: 6px 15px; }
        .scale-btn:hover { background: #666; }

        /* 💡 글래스모피즘 스타일 Unmute 버튼 (우측 상단 배치) */
        .unmute-btn {
            position: absolute;
            top: 20px; /* 하단 컨트롤 바와 겹치지 않도록 상단으로 이동 */
            right: 20px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.4); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            z-index: 10;
            margin: 0;
        }

        .unmute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 소리 켜기 후 부드럽게 사라지는 효과 */
        .fade-out {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
        }
    </style>
    
    <script src="ffmpeg.js"></script>
</head>
<body>

    <h1>🎬 MSX MV2 Web Demuxer & Player</h1>
    <div class="box">
        <input type="file" id="mv2file" accept=".MV2,.mv2" />
        <br>
        <button id="startBtn">변환 및 재생 시작</button>
        <a id="downloadBtn" download="output.mp4">↓ MP4 저장하기</a>
    </div>

    <div id="playerArea">
        <div>
            <button class="scale-btn" id="btn1x">1x (256x192)</button>
            <button class="scale-btn" id="btn2x">2x (512x384)</button>
            <button class="scale-btn" id="btn4x">4x (1024x768)</button>
        </div>
        <br>
        <div class="player-wrapper">
            <video id="player" controls autoplay muted playsinline></video>
            
            <button id="unmuteBtn" class="unmute-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>
                </svg>
                소리 켜기
            </button>
        </div>
    </div>

    <div class="box" style="margin-top: 30px;">
        <h3>진행 상황 로그</h3>
        <pre id="log">대기 중...</pre>
    </div>

    <script>
        const { FFmpeg } = FFmpegWASM;
        const ffmpeg = new FFmpeg();
        const logEl = document.getElementById('log');
        const startBtn = document.getElementById('startBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const playerArea = document.getElementById('playerArea');
        const player = document.getElementById('player');
        const unmuteBtn = document.getElementById('unmuteBtn');

        // Unmute 버튼 클릭 이벤트 처리
        unmuteBtn.addEventListener('click', () => {
            player.muted = false;
            player.play().catch(e => console.error("재생 에러:", e));
            unmuteBtn.classList.add('fade-out');
        });

        // 스케일 조절 버튼 이벤트 연결
        document.getElementById('btn1x').addEventListener('click', () => setPlayerSize(256, 192));
        document.getElementById('btn2x').addEventListener('click', () => setPlayerSize(512, 384));
        document.getElementById('btn4x').addEventListener('click', () => setPlayerSize(1024, 768));

        function setPlayerSize(w, h) {
            player.style.width = w + 'px';
            player.style.height = h + 'px';
        }

        function log(msg) {
            logEl.textContent += `\n[System] ${msg}`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        ffmpeg.on('log', ({ message }) => {
            logEl.textContent += `\n[FFmpeg] ${message}`;
            logEl.scrollTop = logEl.scrollHeight;
        });

        function rgb333_to_888(r, g, b) {
            return [Math.round(r * 255 / 7), Math.round(g * 255 / 7), Math.round(b * 255 / 7)];
        }

        async function demuxMV2(arrayBuffer) {
            const data = new Uint8Array(arrayBuffer);
            const blockSize = 16384;
            
            // Skip 16KB header
            let remainingBytes = data.length - blockSize;
            let numBlocks = Math.floor(remainingBytes / blockSize);

            const videoBuffer = new Uint8Array(numBlocks * 256 * 192 * 3);
            let videoOffset = 0;
            let audioChunks = [];
            let palette = Array(16).fill([0, 0, 0]);

            let pos = blockSize;
            let count = 0;

            while (pos + blockSize <= data.length) {
                let block = data.subarray(pos, pos + blockSize);
                pos += blockSize;

                // 🎨 MSX Palette extraction (15 colors, starting from index 1)
                // MSX format: [RB][0G] -> Byte 0: R(bits 4-6), B(bits 0-2); Byte 1: G(bits 0-2)
                for (let i = 0; i < 15; i++) {
                    let b1 = block[12288 + i * 2], b2 = block[12288 + i * 2 + 1];
                    let r = (b1 >> 4) & 0x07, b = b1 & 0x07, g = b2 & 0x07;
                    palette[i + 1] = rgb333_to_888(r, g, b);
                }

                // 🎬 Screen 4 Video decoding
                for (let y = 0; y < 192; y++) {
                    const y8 = Math.floor(y / 8), yMod8 = y % 8;
                    for (let x = 0; x < 256; x++) {
                        const vram_off = (y8 * 32 + Math.floor(x / 8)) * 8 + yMod8;
                        const p_byte = block[vram_off];
                        const c_byte = block[6144 + vram_off];
                        
                        const isFg = (p_byte & (1 << (7 - (x % 8)))) !== 0;
                        const colorIdx = isFg ? (c_byte >> 4) : (c_byte & 0x0F);
                        const color = palette[colorIdx];

                        videoBuffer[videoOffset++] = color[0];
                        videoBuffer[videoOffset++] = color[1];
                        videoBuffer[videoOffset++] = color[2];
                    }
                }

                // 🔊 Audio extraction
                if (block.length > 12800) {
                    let sz_blocks = block[12800];
                    if (sz_blocks > 0 && sz_blocks <= 111) {
                        let chunkSize = sz_blocks * 32;
                        audioChunks.push(block.slice(12801, 12801 + chunkSize));
                    }
                }
                if (count % 100 === 0) log(`프레임 파싱 중... ${count}/${numBlocks}`);
                count++;
            }

            let totalAudioLength = audioChunks.reduce((acc, val) => acc + val.length, 0);
            let audioBuffer = new Uint8Array(totalAudioLength);
            let aOff = 0;
            for (let chunk of audioChunks) {
                audioBuffer.set(chunk, aOff);
                aOff += chunk.length;
            }

            return { videoBuffer: videoBuffer.subarray(0, videoOffset), audioBuffer };
        }

        startBtn.addEventListener('click', async () => {
            const fileInput = document.getElementById('mv2file');
            if (!fileInput.files.length) {
                alert("MV2 파일을 선택해주세요.");
                return;
            }
            startBtn.disabled = true;
            downloadBtn.style.display = "none";
            playerArea.style.display = "none";
            
            // 변환 재시작 시 플레이어 및 버튼 상태 초기화
            player.pause();
            player.muted = true; 
            unmuteBtn.classList.remove('fade-out');
            
            logEl.textContent = "변환 시작...";

            try {
                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();

                log("1. MV2 파일 파싱 및 Raw 데이터 추출 중...");
                const { videoBuffer, audioBuffer } = await demuxMV2(arrayBuffer);

                log("2. FFmpeg.wasm 로컬 엔진 로딩 중...");
                if (!ffmpeg.loaded) {
                    await ffmpeg.load({
                        coreURL: 'ffmpeg-core.js',
                        wasmURL: 'ffmpeg-core.wasm'
                    });
                }

                log("3. 브라우저 가상 메모리(MEMFS)에 기록 중...");
                await ffmpeg.writeFile('video.raw', videoBuffer);
                await ffmpeg.writeFile('audio.mp3', audioBuffer);

                log("4. Muxing 시작 (MP4 결합)...");
                await ffmpeg.exec([
                    '-y',
                    '-f', 'rawvideo',
                    '-pix_fmt', 'rgb24',
                    '-s', '256x192',
                    '-r', '15',
                    '-i', 'video.raw',
                    '-i', 'audio.mp3',
                    '-c:v', 'libx264',
                    '-pix_fmt', 'yuv420p',
                    '-c:a', 'copy',
                    '-shortest',
                    'output.mp4'
                ]);

                log("5. 변환 완료! 웹 플레이어에서 재생을 시작합니다.");
                
                const data = await ffmpeg.readFile('output.mp4');
                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                
                // 플레이어 표시 및 자동 재생 (기본 2x 크기로 설정)
                player.src = url;
                setPlayerSize(512, 384);  
                playerArea.style.display = "block";
                
                // Safari/Chrome 정책에 맞춰 muted 상태로 먼저 재생
                player.play().catch(e => log(`자동 재생 정책 차단: ${e}`));
                
                downloadBtn.href = url;
                downloadBtn.download = file.name.replace(/\.[^/.]+$/, "") + ".mp4";
                downloadBtn.style.display = "inline-block";
                
                ffmpeg.deleteFile('video.raw');
                ffmpeg.deleteFile('audio.mp3');
                ffmpeg.deleteFile('output.mp4');

            } catch (error) {
                log(`❌ 에러 발생: ${error.message}`);
                console.error(error);
            } finally {
                startBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
