<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSX2 MV2 Video Encoder (WASM)</title>

    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #eee; max-width: 800px; margin: 0 auto; padding: 20px; }
        .panel { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { font-size: 0.9em; color: #aaa; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007acc; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #005f9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        /* canvas { background: #000; display: block; margin: 0 auto; image-rendering: pixelated; width: 512px; height: 384px; border: 2px solid #555; } */
	/* 캔버스 스타일을 아래와 같이 수정하세요. */
        canvas { 
            background: #000; 
            display: block; 
            margin: 0 auto; 
            border: 2px solid #555;
            
            /* 🚀 [핵심 추가] 표시 크기는 2배로 키웁니다. */
            width: 768px; 
            height: 576px; 
            
            /* 🚀 [핵심 추가] 커져도 뿌옇지 않게 '픽셀 매칭' 렌더링을 강제합니다. */
            image-rendering: pixelated;    /* 최신 브라우저용 */
            image-rendering: crisp-edges; /* 사파리/구형 파이어폭스용 폴백 */
        }
        #progress-container { display: none; margin-top: 15px; }
        progress { width: 100%; height: 20px; margin-top: 5px; }
        #statusText { font-weight: bold; color: #4db8ff; }
    </style>
    <!-- 브라우저용 가벼운 순수 JS MP3 인코더 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>

    <h2>📼 MSX2 MV2 Web Encoder</h2>

    <div class="panel">
        <input type="file" id="videoInput" accept="video/mp4,video/webm" />
        
        <div class="grid" style="margin-top: 15px;">
            <div>
                <label>Quantizer Algorithm</label>
                <select id="cfg_quantizer">
                    <option value="kmeans">K-Means++ (Smooth Gradients)</option>
                    <option value="greedy">Greedy (High Contrast/Pixel Art)</option>
                </select>
            </div>
            <div>
                <label>Dither Strength (0-100)</label>
                <input type="number" id="cfg_dither" value="65" min="0" max="100">
            </div>
            <div>
                <label>Max Extra Colors</label>
                <input type="number" id="cfg_colors" value="12" min="1" max="16">
            </div>
            <div>
                <label>Anchor Colors (Shorthand)</label>
                <input type="text" id="cfg_anchors" value="K_W">
            </div>
            <div>
                <label>Initial Iterations (Quality)</label>
                <input type="number" id="cfg_iter_init" value="30" min="1">
            </div>
            <div>
                <label>Subsequent Iterations (Speed)</label>
                <input type="number" id="cfg_iter_sub" value="3" min="1">
            </div>
            <div>
                <label>Distance Metric</label>
                <select id="cfg_metric">
                    <option value="redmean">Redmean (Skin/Natural Video)</option>
                    <option value="euclidean">Euclidean (Test Patterns/Anime)</option>
                </select>
            </div>
            <div>
                <label>Aspect Mode</label>
                <select id="cfg_aspect">
                    <option value="crop">Crop (Pan & Scan)</option>
                    <option value="pad">Pad (Letterbox)</option>
                    <option value="force">Force (Stretch)</option>
                </select>
            </div>
            <div>
                <label>Crop Left Offset (%)</label>
                <input type="number" id="cfg_crop_left" value="0" min="-100" max="100">
            </div>
            <div>
                <label>Crop Up Offset (%)</label>
                <input type="number" id="cfg_crop_up" value="0" min="-100" max="100">
            </div>
        </div>

        <button id="btnStart">Start Encoding</button>

        <div id="progress-container">
            <label id="statusText">Extracting Audio...</label>
            <progress id="progressBar" value="0" max="100"></progress>
        </div>
    </div>

    <div class="panel">
        <label style="display: block; text-align: center; margin-bottom: 10px;">Real-time Dither Preview (512x384)</label>
        <canvas id="previewCanvas" width="256" height="192"></canvas>
    </div>

    <script type="module">
	// ⚠️ 맨 위쪽의 WASM import 구문은 삭제하세요! (Worker가 대신 합니다)
        //import init, { Mv2Encoder } from './pkg/mv2_wasm.js';

        const videoInput = document.getElementById('videoInput');
        const btnStart = document.getElementById('btnStart');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const TARGET_FPS = 15.0;
        const TARGET_SAMPLE_RATE = 44100; // Original new_encoder.py uses 44.1kHz / 128kbps for the MP3 stream

        // Web Worker 생성 (타입을 module로 지정해야 import가 작동함)
        const worker = new Worker('./worker.js', { type: 'module' });

        btnStart.addEventListener('click', async () => {
            if (!videoInput.files.length) return alert("Please select a video file first!");
            const file = videoInput.files[0];
            
            btnStart.disabled = true;
            document.getElementById('progress-container').style.display = 'block';

            try {
                const config = {
                    width: 256, height: 192,
                    quantizer: document.getElementById('cfg_quantizer').value,
                    dither_strength: parseInt(document.getElementById('cfg_dither').value),
                    anchor_colors: document.getElementById('cfg_anchors').value,
                    max_extra_colors: parseInt(document.getElementById('cfg_colors').value),
                    quant_iters_initial: parseInt(document.getElementById('cfg_iter_init').value),
                    quant_iters_subsequent: parseInt(document.getElementById('cfg_iter_sub').value),
                    metadata: JSON.stringify({ filename: file.name }),
                    aspect_mode: document.getElementById('cfg_aspect').value, 
                    crop_left: parseFloat(document.getElementById('cfg_crop_left').value), 
                    crop_up: parseFloat(document.getElementById('cfg_crop_up').value),
                    sample_rate: TARGET_SAMPLE_RATE, fps: TARGET_FPS, 
                    metric: document.getElementById('cfg_metric').value
                };

                statusText.innerText = "Initializing WASM Worker...";

                // 1. Worker에 초기화 명령 전달 및 대기
                await new Promise((resolve, reject) => {
                    worker.onmessage = (e) => {
                        if (e.data.type === 'INIT_DONE') resolve();
                        if (e.data.type === 'ERROR') reject(e.data.payload);
                    };
                    worker.postMessage({ type: 'INIT', payload: { config: JSON.stringify(config) } });
                });

                statusText.innerText = "Extracting Audio & Preparing Video...";
                
                // (기존과 동일한 비디오/오디오 준비 로직)
                const videoURL = URL.createObjectURL(file);
                const video = document.createElement('video');
                video.src = videoURL;
                video.muted = true;
                await new Promise(resolve => { video.onloadedmetadata = resolve; });

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TARGET_SAMPLE_RATE });
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const pcmFloat32 = audioBuffer.getChannelData(0); 
                
                const pcmInt16 = new Int16Array(pcmFloat32.length);
                for (let i = 0; i < pcmFloat32.length; i++) {
                    let s = Math.max(-1, Math.min(1, pcmFloat32[i]));
                    pcmInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                statusText.innerText = "Encoding MP3 Audio...";
                const mp3Encoder = new lamejs.Mp3Encoder(1, TARGET_SAMPLE_RATE, 128); // Reverted to 128kbps
                const mp3Data = [];
                
                // Encode in chunks to prevent UI freeze
                const mp3ChunkSize = 1152 * 10;
                for (let i = 0; i < pcmInt16.length; i += mp3ChunkSize) {
                    const chunk = pcmInt16.subarray(i, i + mp3ChunkSize);
                    const mp3buf = mp3Encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) mp3Data.push(new Uint8Array(mp3buf));
                }
                const leftover = mp3Encoder.flush();
                if (leftover.length > 0) mp3Data.push(new Uint8Array(leftover));
                
                // Merge all MP3 chunks into one Uint8Array
                const totalMp3Len = mp3Data.reduce((acc, curr) => acc + curr.length, 0);
                const fullMp3 = new Uint8Array(totalMp3Len);
                let offset = 0;
                for (const chunk of mp3Data) {
                    fullMp3.set(chunk, offset);
                    offset += chunk.length;
                }

                const totalFrames = Math.floor(video.duration * TARGET_FPS);
                const mp3BytesPerFrame = totalMp3Len / totalFrames;
                
                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = 256; offscreenCanvas.height = 192;
                const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

                progressBar.max = totalFrames;

                // 2. 메인 인코딩 루프
                for (let frameIdx = 0; frameIdx < totalFrames; frameIdx++) {
                    statusText.innerText = `Encoding Frame ${frameIdx + 1} / ${totalFrames}...`;
                    progressBar.value = frameIdx + 1;

		    // 🚀 완벽한 프레임 안착을 보장하는 강력한 Seek 대기 로직
		    video.currentTime = frameIdx / TARGET_FPS;
                    await new Promise((resolve) => {
                        if ('requestVideoFrameCallback' in video) {
                            video.requestVideoFrameCallback(() => resolve());
                        } else {
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                requestAnimationFrame(() => resolve());
                            };
                            video.addEventListener('seeked', onSeeked);
                        }
                    });

                    offCtx.drawImage(video, 0, 0, 256, 192);
                    const frameData = offCtx.getImageData(0, 0, 256, 192);
                    const rgbaBytes = new Uint8Array(frameData.data.buffer);

                    // MP3 bytes for this specific frame
                    const startByte = Math.floor(frameIdx * mp3BytesPerFrame);
                    const endByte = Math.floor((frameIdx + 1) * mp3BytesPerFrame);
                    const mp3Chunk = fullMp3.slice(startByte, endByte);
                    
                    // Audio EQ analysis needs raw PCM
                    const samplesPerFrame = Math.floor(TARGET_SAMPLE_RATE / TARGET_FPS);
                    const startSample = frameIdx * samplesPerFrame;
                    const endSample = Math.min(startSample + samplesPerFrame, pcmInt16.length);
                    const pcmSlice = pcmInt16.subarray(startSample, endSample);

                    // 🚀 Worker에게 한 프레임 연산을 지시하고 끝날 때까지 대기
                    await new Promise((resolve, reject) => {
			worker.onmessage = (e) => {
			    if (e.data.type === 'FRAME_DONE') {
				const ditheredRGB = e.data.payload.ditheredRGB; // 256 * 192 * 3 바이트
				
				const previewData = ctx.createImageData(256, 192);
				for (let i = 0, j = 0; i < ditheredRGB.length; i += 3, j += 4) {
				    previewData.data[j] = ditheredRGB[i];
				    previewData.data[j+1] = ditheredRGB[i+1];
				    previewData.data[j+2] = ditheredRGB[i+2];
				    previewData.data[j+3] = 255;
				}
				ctx.putImageData(previewData, 0, 0);
				resolve();
			    }
                            if (e.data.type === 'ERROR') reject(e.data.payload);
                        };
                        
                        worker.postMessage({ 
                            type: 'ENCODE_FRAME', 
                            payload: { rgbaBytes, mp3Chunk, pcmSlice, frameIdx } 
                        });
                    });
                }

                // 3. 인코딩 마무리
                statusText.innerText = "Finalizing & Muxing binary files...";
                
                await new Promise((resolve, reject) => {
                    worker.onmessage = (e) => {
                        if (e.data.type === 'FINISHED') {
                            const { mv2Bytes, rgbBytes } = e.data.payload;
                            downloadFile(mv2Bytes, "retro_output.mv2", "application/octet-stream");
                            downloadFile(rgbBytes, "retro_output.rgb", "application/octet-stream");
                            resolve();
                        }
                        if (e.data.type === 'ERROR') reject(e.data.payload);
                    };
                    worker.postMessage({ type: 'FINISH' });
                });

                statusText.innerText = "Encoding Complete! 🎉";

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: " + err;
            } finally {
                btnStart.disabled = false;
            }
        });

        function downloadFile(uint8Array, filename, mimeType) {
            // (기존 다운로드 함수 동일)
            const blob = new Blob([uint8Array], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
