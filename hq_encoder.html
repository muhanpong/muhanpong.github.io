<!DOCTYPE html>
<html lang="en">
<head> 
    <script src="coi-serviceworker.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSX2 MV2 Video Encoder - Pre-expand</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #eee; max-width: 800px; margin: 0 auto; padding: 20px; }
        .panel { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        label { font-size: 0.9em; color: #aaa; display: flex; align-items: center; }
        input, select { width: 100%; padding: 8px; margin-top: 4px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; box-sizing: border-box; }
        input[type="radio"] { width: auto; margin-right: 5px; }
        button { width: 100%; padding: 12px; background: #007acc; color: white; border: none; border-radius: 4px; font-size: 1.1em; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #005f9e; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        .title-container { display: flex; align-items: center; justify-content: space-between; }
        .info-icon { cursor: pointer; color: #4db8ff; margin-left: 10px; font-weight: bold; border: 1px solid #4db8ff; border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8em; }
        .tooltip-box { display: none; position: absolute; background: rgba(0,0,0,0.9); color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 0.8em; max-width: 250px; z-index: 100; border: 1px solid #444; pointer-events: none; }
        
        .preview-container { position: relative; width: 100%; max-width: 768px; margin: 0 auto; }
        canvas { 
            background: #000; 
            display: block; 
            width: 100%; 
            height: auto;
            aspect-ratio: 4 / 3;
            border: 2px solid #555;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }
        .drag-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(77, 184, 255, 0.2); border: 2px dashed #4db8ff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2em; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 10; }
        .preview-container.dragover .drag-overlay { opacity: 1; }

        .timeline-container { margin-top: 15px; }
        .time-inputs { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-bottom: 5px; }
        .time-input-group { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .time-input-group label { margin-bottom: 4px; font-size: 0.8em; text-align: center; }
        .time-input-group input { font-family: monospace; text-align: center; padding: 6px 2px; font-size: 0.9em; }
        
        .selection-info-box { flex: 0.8; text-align: center; color: #aaa; font-size: 0.75em; background: #222; padding: 6px 4px; border-radius: 4px; border: 1px solid #444; display: flex; flex-direction: column; justify-content: center; height: 32px; white-space: nowrap; overflow: hidden; }
        @media (max-width: 500px) {
            .time-inputs { gap: 4px; }
            .time-input-group input { font-size: 0.8em; }
            .selection-info-box { font-size: 0.65em; padding: 4px 2px; }
        }
        
        .slider-wrapper { position: relative; height: 30px; margin-top: 10px; user-select: none; }
        .slider-track { position: absolute; top: 10px; left: 0; right: 0; height: 10px; background: #444; border-radius: 5px; cursor: pointer; }
        .slider-fill { position: absolute; top: 10px; height: 10px; background: #007acc; border-radius: 5px; pointer-events: none; }
        .marker { position: absolute; top: 0; width: 12px; height: 30px; background: #fff; border: 1px solid #000; border-radius: 3px; cursor: ew-resize; transform: translateX(-50%); z-index: 5; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        .marker::before { content: ''; position: absolute; top: 5px; left: 3px; right: 3px; bottom: 5px; border-left: 1px solid #999; border-right: 1px solid #999; pointer-events: none; }
        .marker.start-marker { background: #4db8ff; transform: translateX(-100%); z-index: 5; }
        .marker.end-marker { background: #ff4d4d; transform: translateX(0%); z-index: 7; }
        .marker.playhead-marker { background: #ffeb3b; border-color: #f57f17; width: 14px; height: 34px; top: -2px; z-index: 6; border-radius: 50%; box-shadow: 0 0 8px rgba(0,0,0,0.8); cursor: pointer; transform: translateX(-50%); }
        .marker.playhead-marker::before { display: none; }

        .split-handle { display: none; position: absolute; top: 0; bottom: 0; width: 20px; cursor: ew-resize; transform: translateX(-50%); z-index: 20; background: rgba(255,255,255,0.1); border-left: 2px solid; }
        #splitLeft { border-color: #4CAF50; left: 33%; }
        #splitRight { border-color: #ff9800; left: 66%; }
        .monitor-mode .split-handle { display: block; }

        .osd-center-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 15; transition: opacity 0.2s, transform 0.1s; fill: white; opacity: 0; pointer-events: none; }
        .osd-center-play-btn:hover { background: rgba(0, 0, 0, 0.8); }
        .osd-center-play-btn:active { transform: translate(-50%, -50%) scale(0.9); }
        .preview-container.has-media.paused .osd-center-play-btn { opacity: 1; pointer-events: auto; }
        .preview-container.has-media.playing:hover .osd-center-play-btn { opacity: 1; pointer-events: auto; }
        .preview-container.monitor-mode .osd-center-play-btn { display: none !important; }

        #progress-container { display: none; margin-top: 15px; }
        progress { width: 100%; height: 20px; margin-top: 5px; }
        #statusText { font-weight: bold; color: #4db8ff; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="tooltip" class="tooltip-box"></div>
    <div class="title-container">
        <h2>📼 MSX2 MV2 Web Encoder (HQ?)</h2>
        <div class="info-icon" id="btnInfo" title="Toggle Help Tooltips">i</div>
    </div>

    <div class="panel">
        <input type="file" id="videoInput" accept="video/mp4,video/webm" />
        <video id="sourceVideo" style="position: fixed; top: -10000px; left: -10000px; opacity: 0;" playsinline muted></video>
        
        <div class="grid" style="margin-top: 15px;">
            <div>
                <label>Quantizer Algorithm</label>
                <select id="cfg_quantizer">
                    <option value="kmeans">K-Means++ (Smooth Gradients)</option>
                    <option value="greedy">Greedy (High Contrast/Pixel Art)</option>
                </select>
            </div>
            <div>
                <label>Dither Strength (0-100)</label>
                <input type="number" id="cfg_dither" value="85" min="0" max="100">
            </div>
            <div>
                <label>Max Extra Colors</label>
                <input type="number" id="cfg_colors" value="15" min="1" max="100">
            </div>
            <div>
                <label>Anchor Colors (Shorthand)</label>
                <input type="text" id="cfg_anchors" value="K_W">
            </div>
            <div>
                <label>Initial Iterations (Quality)</label>
                <input type="number" id="cfg_iter_init" value="30" min="1">
            </div>
            <div>
                <label>Subsequent Iterations (Speed)</label>
                <input type="number" id="cfg_iter_sub" value="3" min="1">
            </div>
            <div>
                <label>Distance Metric</label>
                <select id="cfg_metric">
                    <option value="redmean">Redmean (Skin/Natural Video)</option>
                    <option value="euclidean">Euclidean (Test Patterns/Anime)</option>
                </select>
            </div>
            <div>
                <label>Aspect Ratio (Preview)</label>
                <div style="display:flex; align-items:center; margin-top:10px;">
                    <label style="margin-right: 15px;"><input type="radio" name="cfg_target_ratio" value="5:3" checked> 5:3</label>
                    <label><input type="radio" name="cfg_target_ratio" value="4:3"> 4:3</label>
                </div>
            </div>
            <div>
                <label>Aspect Mode</label>
                <select id="cfg_aspect">
                    <option value="crop">Crop (Pan & Scan)</option>
                    <option value="pad">Pad (Letterbox)</option>
                    <option value="force">Force (Stretch)</option>
                </select>
            </div>
            <div style="grid-column: span 2; display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Crop Left Offset (%)</label>
                    <input type="number" id="cfg_crop_left" value="0" min="-100" max="100">
                </div>
                <div style="flex: 1;">
                    <label>Crop Up Offset (%)</label>
                    <input type="number" id="cfg_crop_up" value="0" min="-100" max="100">
                </div>
            </div>
        </div>

        <button id="btnStart">Start Encoding</button>

        <div id="progress-container">
            <label id="statusText">Extracting Audio...</label>
            <progress id="progressBar" value="0" max="100"></progress>
        </div>
    </div>

    <div class="panel">
        <label id="previewLabel" style="display: block; text-align: center; margin-bottom: 10px;">Source Media Preview & Target Window Selection</label>
        
        <div class="preview-container" id="previewContainer">
            <canvas id="previewCanvas" width="256" height="192"></canvas>
            <div class="drag-overlay" id="dragOverlay">Drop Video File Here</div>
            <div class="osd-center-play-btn" id="previewPlayBtn">
                <svg id="icon-play" viewBox="0 0 24 24" width="36" height="36"><path d="M8 5v14l11-7z" /></svg>
                <svg id="icon-pause" viewBox="0 0 24 24" width="36" height="36" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" /></svg>
            </div>
            <div class="split-handle" id="splitLeft"></div>
            <div class="split-handle" id="splitRight"></div>
        </div>

        <div class="timeline-container" id="timelineContainer">
            <div class="time-inputs">
                <div class="time-input-group">
                    <label>Start Time</label>
                    <input type="text" id="timeStart" value="00:00:00.000" disabled>
                </div>
                <div class="selection-info-box" id="selectionInfo">
                    <span>0.00s | 0 F</span>
                    <span style="color:#4CAF50">~0.00 MB</span>
                </div>
                <div class="time-input-group">
                    <label>End Time</label>
                    <input type="text" id="timeEnd" value="00:00:00.000" disabled>
                </div>
            </div>
            <div class="slider-wrapper" id="seekSlider">
                <div class="slider-track" id="sliderTrack"></div>
                <div class="slider-fill" id="sliderFill" style="left: 0%; width: 100%;"></div>
                <div class="marker start-marker" id="markerStart" style="left: 0%;" title="Start Point"></div>
                <div class="marker playhead-marker" id="markerPlayhead" style="left: 0%;" title="Current Position"></div>
                <div class="marker end-marker" id="markerEnd" style="left: 100%;" title="End Point"></div>
            </div>
        </div>
    </div>

    <script type="module">
        const videoInput = document.getElementById('videoInput');
        const btnStart = document.getElementById('btnStart');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const sourceVideo = document.getElementById('sourceVideo');
        const previewContainer = document.getElementById('previewContainer');
        const previewLabel = document.getElementById('previewLabel');
        const timeStartInput = document.getElementById('timeStart');
        const timeEndInput = document.getElementById('timeEnd');
        const seekSlider = document.getElementById('seekSlider');
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderFill = document.getElementById('sliderFill');
        const markerStart = document.getElementById('markerStart');
        const markerPlayhead = document.getElementById('markerPlayhead');
        const markerEnd = document.getElementById('markerEnd');
        const btnInfo = document.getElementById('btnInfo');
        const tooltipBox = document.getElementById('tooltip');
        const splitLeft = document.getElementById('splitLeft');
        const splitRight = document.getElementById('splitRight');
        const previewPlayBtn = document.getElementById('previewPlayBtn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');

        const TARGET_FPS = 15.0;
        const TARGET_SAMPLE_RATE = 44100;
        let isEncoding = false;
        let shouldStopEncoding = false;
        let currentMode = 'preview'; 
        let videoDuration = 0;
        let startTime = 0;
        let endTime = 0;
        let currentTime = 0;
        let monitorLeftSplit = 0.0;
        let monitorRightSplit = 1.0;
        let currentFile = null;
        let isDraggingMarker = null;
        let anchorTime = null;

        // Web Worker (캐시 무력화 파라미터 적용 권장)
        const worker = new Worker('./worker.js?v=' + Date.now(), { type: 'module' });

        // Tooltip Logic
        let tooltipsEnabled = false;
        const tooltipData = {
            'cfg_quantizer': 'K-Means++: Smooth gradients, slower. Greedy: High contrast, faster.',
            'cfg_dither': '0 = No dither (banding). 100 = Maximum dither (noisy). Default 85.',
            'cfg_colors': 'Number of dynamic colors to calculate for better quality (higher is slower). Recommended: 15 for best quality; 4–8 for balanced speed(less colors).',
            'cfg_anchors': 'Specific colors to lock into the palette (e.g., \'K\' for Black, \'W\' for White); use \'_\' to keep them bright in dark scenes.',
            'cfg_iter_init': 'K-Means iterations for the first frame. Higher = better quality.',
            'cfg_iter_sub': 'Iterations for subsequent frames. Can be lower for speed.',
            'cfg_metric': 'Redmean is best for human skin. Euclidean is standard.',
            'cfg_aspect': 'Crop: cuts edges. Pad: adds black bars. Force: stretches image.',
            'cfg_crop_left': 'Shift crop window horizontally (-100 to 100).',
            'cfg_crop_up': 'Shift crop window vertically (-100 to 100).',
            'cfg_target_ratio': 'Select 5:3 (MSX Standard) or 4:3 target screen ratio.'
        };

        btnInfo.addEventListener('click', () => {
            tooltipsEnabled = !tooltipsEnabled;
            btnInfo.style.background = tooltipsEnabled ? '#007acc' : 'transparent';
            btnInfo.style.color = tooltipsEnabled ? '#fff' : '#4db8ff';
        });

        document.querySelectorAll('label, select, input').forEach(el => {
            el.addEventListener('mousemove', (e) => {
                if (!tooltipsEnabled) return;
                const id = el.id || (el.name ? el.name : null);
                const targetId = id || (el.htmlFor ? el.htmlFor : null) || (el.closest('div') && el.closest('div').querySelector('select, input') ? el.closest('div').querySelector('select, input').id : null) || (el.closest('div') && el.closest('div').querySelector('input[type="radio"]') ? el.closest('div').querySelector('input[type="radio"]').name : null);
                
                if (targetId && tooltipData[targetId]) {
                    tooltipBox.innerText = tooltipData[targetId];
                    tooltipBox.style.display = 'block';
                    tooltipBox.style.left = e.pageX + 15 + 'px';
                    tooltipBox.style.top = e.pageY + 15 + 'px';
                } else {
                    tooltipBox.style.display = 'none';
                }
            });
            el.addEventListener('mouseleave', () => tooltipBox.style.display = 'none');
        });

        document.addEventListener('click', (e) => {
            if (tooltipsEnabled && e.target !== btnInfo) {
                tooltipsEnabled = false;
                btnInfo.style.background = 'transparent';
                btnInfo.style.color = '#4db8ff';
                tooltipBox.style.display = 'none';
            }
        });

        // Time Handlers
        function formatTimeInput(seconds) {
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
            return `${h}:${m}:${s}.${ms}`;
        }

        function parseTimeInput(timeStr) {
            const parts = timeStr.split(':');
            if (parts.length !== 3) return 0;
            const secParts = parts[2].split('.');
            return parseInt(parts[0]) * 3600 + parseInt(parts[1]) * 60 + parseInt(secParts[0]) + (secParts[1] ? parseInt(secParts[1])/1000 : 0);
        }

        async function loadVideoFile(file) {
            currentFile = file;
            const url = URL.createObjectURL(file);
            sourceVideo.src = url;
            
            await new Promise(resolve => {
                sourceVideo.onloadedmetadata = () => {
                    videoDuration = sourceVideo.duration;
                    startTime = 0;
                    endTime = videoDuration;
                    currentTime = 0;
                    
                    document.getElementById('cfg_crop_left').value = 0;
                    document.getElementById('cfg_crop_up').value = 0;
                    
                    timeStartInput.value = formatTimeInput(startTime);
                    timeEndInput.value = formatTimeInput(endTime);
                    timeStartInput.disabled = false;
                    timeEndInput.disabled = false;
                    
                    updateSliderVisuals();
                    updateVideoTime();
                    
                    previewContainer.classList.add('has-media');
                    previewContainer.classList.add('paused');
                    resolve();
                };
            });
        }

        let playbackAnimFrame;
        
        function togglePlay() {
            if (!currentFile || isEncoding) return;
            if (sourceVideo.paused) {
                if (currentTime >= endTime - 0.1) {
                    currentTime = startTime;
                    sourceVideo.currentTime = currentTime;
                }
                sourceVideo.muted = false; 
                sourceVideo.play();
                previewContainer.classList.remove('paused');
                previewContainer.classList.add('playing');
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
                playbackLoop();
            } else {
                sourceVideo.pause();
                previewContainer.classList.add('paused');
                previewContainer.classList.remove('playing');
                iconPlay.style.display = 'block';
                iconPause.style.display = 'none';
                cancelAnimationFrame(playbackAnimFrame);
            }
        }

        function playbackLoop() {
            if (sourceVideo.paused || isEncoding) return;
            currentTime = sourceVideo.currentTime;
            
            if (currentTime >= endTime) {
                currentTime = endTime;
                togglePlay();
                updateVideoTime(); 
            } else {
                updateSliderVisuals();
                renderPreview();
                playbackAnimFrame = requestAnimationFrame(playbackLoop);
            }
        }

        previewPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
        
        previewContainer.addEventListener('click', (e) => {
            if (currentMode === 'preview' && currentFile && !hasDraggedCanvas && e.target !== previewPlayBtn) togglePlay();
        });

        videoInput.addEventListener('change', (e) => {
            if (e.target.files.length) loadVideoFile(e.target.files[0]);
        });

        previewContainer.addEventListener('dragover', (e) => { e.preventDefault(); if (!isEncoding) previewContainer.classList.add('dragover'); });
        previewContainer.addEventListener('dragleave', () => previewContainer.classList.remove('dragover'));
        previewContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            previewContainer.classList.remove('dragover');
            if (isEncoding) return;
            if (e.dataTransfer.files.length && e.dataTransfer.files[0].type.startsWith('video/')) {
                videoInput.files = e.dataTransfer.files; 
                loadVideoFile(e.dataTransfer.files[0]);
            }
        });

        function updateSliderVisuals() {
            if (videoDuration === 0) return;
            const sPct = (startTime / videoDuration) * 100;
            const ePct = (endTime / videoDuration) * 100;
            const cPct = (currentTime / videoDuration) * 100;
            markerStart.style.left = `${sPct}%`;
            markerEnd.style.left = `${ePct}%`;
            markerPlayhead.style.left = `${cPct}%`;
            sliderFill.style.left = `${sPct}%`;
            sliderFill.style.width = `${ePct - sPct}%`;
            
            const selDur = endTime - startTime;
            const selFrames = Math.floor(selDur * TARGET_FPS);
            const estMB = ((16384 + (selFrames * 16384)) / (1024 * 1024)).toFixed(2);
            document.getElementById('selectionInfo').innerHTML = `<span>${selDur.toFixed(2)}s | ${selFrames} F</span><span style="color:#4CAF50">~${estMB} MB</span>`;
        }

        function renderPreview() {
            if (currentMode !== 'preview' || !currentFile) return;
            if (sourceVideo.requestVideoFrameCallback) {
                sourceVideo.requestVideoFrameCallback(drawPreviewCanvas);
            } else {
                setTimeout(drawPreviewCanvas, 50);
            }
        }

        function updateVideoTime() {
            if (!currentFile) return;
            if (Math.abs(sourceVideo.currentTime - currentTime) > 0.01) {
                sourceVideo.currentTime = currentTime;
            } else {
                renderPreview();
            }
        }

        let isDraggingCanvas = false;
        let hasDraggedCanvas = false;
        let dragStartX = 0, dragStartY = 0, initialCropLeft = 0, initialCropUp = 0;

        function handleCanvasDown(e) {
            if (currentMode !== 'preview' || document.getElementById('cfg_aspect').value !== 'crop' || !currentFile) return;
            isDraggingCanvas = true; hasDraggedCanvas = false;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            dragStartX = clientX; dragStartY = clientY;
            initialCropLeft = parseFloat(document.getElementById('cfg_crop_left').value) || 0;
            initialCropUp = parseFloat(document.getElementById('cfg_crop_up').value) || 0;
        }

        previewContainer.addEventListener('mousedown', handleCanvasDown);
        previewContainer.addEventListener('touchstart', handleCanvasDown, { passive: false });

        function handleCanvasMove(e) {
            if (!isDraggingCanvas) return;
            if (e.type === 'touchmove') e.preventDefault();
            hasDraggedCanvas = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const dx = clientX - dragStartX, dy = clientY - dragStartY;
            const pctX = (dx / canvas.clientWidth) * 100, pctY = (dy / canvas.clientHeight) * 100;

            let newLeft = initialCropLeft, newUp = initialCropUp;
            const vw = sourceVideo.videoWidth, vh = sourceVideo.videoHeight;
            if (!vw || !vh) return;
            
            const targetRatioStr = document.querySelector('input[name="cfg_target_ratio"]:checked').value;
            const targetRatio = targetRatioStr === '5:3' ? (5/3) : (4/3);
            const videoAspect = vw / vh;

            if (videoAspect > targetRatio) newLeft = Math.max(-100, Math.min(100, initialCropLeft + pctX));
            else newUp = Math.max(-100, Math.min(100, initialCropUp + pctY));

            document.getElementById('cfg_crop_left').value = newLeft.toFixed(1);
            document.getElementById('cfg_crop_up').value = newUp.toFixed(1);
            drawPreviewCanvas(); 
        }

        document.addEventListener('mousemove', handleCanvasMove);
        document.addEventListener('touchmove', handleCanvasMove, { passive: false });
        function handleCanvasUp() { isDraggingCanvas = false; }
        document.addEventListener('mouseup', handleCanvasUp);
        document.addEventListener('touchend', handleCanvasUp);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && currentMode === 'preview' && currentFile) renderPreview(); 
            else if (isEncoding) console.warn("Encoding running in background. Browser may throttle performance.");
        });
        
        let isDraggingSplit = null;
        splitLeft.addEventListener('mousedown', () => { if (currentMode === 'monitor') isDraggingSplit = 'left'; });
        splitRight.addEventListener('mousedown', () => { if (currentMode === 'monitor') isDraggingSplit = 'right'; });
        
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingSplit) return;
            const rect = previewContainer.getBoundingClientRect();
            let pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
            
            if (isDraggingSplit === 'left') {
                monitorLeftSplit = Math.min(pct / 100, monitorRightSplit);
                splitLeft.style.left = `${monitorLeftSplit * 100}%`;
            } else if (isDraggingSplit === 'right') {
                monitorRightSplit = Math.max(pct / 100, monitorLeftSplit);
                splitRight.style.left = `${monitorRightSplit * 100}%`;
            }
        });
        document.addEventListener('mouseup', () => { isDraggingSplit = null; });

        document.getElementById('cfg_aspect').addEventListener('change', drawPreviewCanvas);
        document.getElementById('cfg_crop_left').addEventListener('input', drawPreviewCanvas);
        document.getElementById('cfg_crop_up').addEventListener('input', drawPreviewCanvas);
        document.querySelectorAll('input[name="cfg_target_ratio"]').forEach(r => r.addEventListener('change', (e) => {
            canvas.style.aspectRatio = e.target.value === '5:3' ? '5 / 3' : '4 / 3';
            drawPreviewCanvas();
        }));

        function drawPreviewCanvas() {
            if (currentMode === 'monitor') return; 
            
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (!currentFile) return;

            const vw = sourceVideo.videoWidth, vh = sourceVideo.videoHeight;
            if (!vw || !vh) return;

            const aspectMode = document.getElementById('cfg_aspect').value;
            const targetRatioStr = document.querySelector('input[name="cfg_target_ratio"]:checked').value;
            const targetRatio = targetRatioStr === '5:3' ? (5/3) : (4/3);

            let drawW = canvas.width, drawH = canvas.height, drawX = 0, drawY = 0;

            if (aspectMode === 'force') {
                ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = 'rgba(77, 184, 255, 0.8)'; ctx.lineWidth = 1; ctx.setLineDash([]);
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
                return; 
            }

            const canvasAspect = canvas.width / canvas.height, videoAspect = vw / vh;

            if (videoAspect > canvasAspect) { drawH = canvas.width / videoAspect; drawY = (canvas.height - drawH) / 2; } 
            else { drawW = canvas.height * videoAspect; drawX = (canvas.width - drawW) / 2; }

            ctx.drawImage(sourceVideo, drawX, drawY, drawW, drawH);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; 

            let targetX = drawX, targetY = drawY, targetW = drawW, targetH = drawH;

            if (aspectMode === 'pad') {
                targetX = 0; targetY = 0; targetW = canvas.width; targetH = canvas.height;
            } else if (aspectMode === 'crop') {
                if (videoAspect > targetRatio) {
                    targetW = drawH * targetRatio;
                    let cropOffX = parseFloat(document.getElementById('cfg_crop_left').value) || 0;
                    targetX = drawX + ((drawW - targetW) / 2) + ((drawW - targetW) / 2) * (cropOffX / 100);
                } else {
                    targetH = drawW / targetRatio;
                    let cropOffY = parseFloat(document.getElementById('cfg_crop_up').value) || 0;
                    targetY = drawY + ((drawH - targetH) / 2) + ((drawH - targetH) / 2) * (cropOffY / 100);
                }
            }

            ctx.fillRect(0, 0, canvas.width, targetY); 
            ctx.fillRect(0, targetY + targetH, canvas.width, canvas.height - (targetY + targetH)); 
            ctx.fillRect(0, targetY, targetX, targetH); 
            ctx.fillRect(targetX + targetW, targetY, canvas.width - (targetX + targetW), targetH); 

            ctx.strokeStyle = 'rgba(77, 184, 255, 0.8)'; ctx.lineWidth = 1; ctx.setLineDash([]);
            ctx.strokeRect(targetX, targetY, targetW, targetH);
        }

        function getSliderX(e) {
            const rect = seekSlider.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            return Math.max(0, Math.min(clientX - rect.left, rect.width));
        }

        function handleSliderDown(e) {
            if (!currentFile || isEncoding) return;
            const rect = seekSlider.getBoundingClientRect();
            let clickTime = (getSliderX(e) / rect.width) * videoDuration;

            if (e.target === markerStart) isDraggingMarker = 'start';
            else if (e.target === markerEnd) isDraggingMarker = 'end';
            else if (e.target === markerPlayhead) isDraggingMarker = 'playhead';
            else {
                isDraggingMarker = 'playhead';
                currentTime = Math.max(startTime, Math.min(clickTime, endTime));
                updateVideoTime(); updateSliderVisuals();
            }
            
            updateSliderFromDrag(e);
            
            const onMove = (moveEvent) => {
                if (moveEvent.type === 'touchmove') moveEvent.preventDefault();
                updateSliderFromDrag(moveEvent);
            };
            const onUp = () => {
                isDraggingMarker = null; anchorTime = null;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('touchend', onUp);
            };
            
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onUp);
        }

        seekSlider.addEventListener('mousedown', handleSliderDown);
        seekSlider.addEventListener('touchstart', handleSliderDown, { passive: false });

        function updateSliderFromDrag(e) {
            if (!isDraggingMarker) return;
            let time = (getSliderX(e) / seekSlider.getBoundingClientRect().width) * videoDuration;

            if (isDraggingMarker === 'start') {
                startTime = Math.min(time, endTime);
                currentTime = Math.max(startTime, Math.min(currentTime, endTime));
            } else if (isDraggingMarker === 'end') {
                endTime = Math.max(time, startTime);
                currentTime = Math.max(startTime, Math.min(currentTime, endTime));
            } else if (isDraggingMarker === 'playhead') {
                currentTime = Math.max(startTime, Math.min(time, endTime));
            }

            timeStartInput.value = formatTimeInput(startTime);
            timeEndInput.value = formatTimeInput(endTime);
            updateSliderVisuals(); updateVideoTime();
        }

        timeStartInput.addEventListener('change', () => {
            startTime = Math.max(0, Math.min(parseTimeInput(timeStartInput.value), endTime));
            timeStartInput.value = formatTimeInput(startTime);
            updateSliderVisuals(); updateVideoTime();
        });

        timeEndInput.addEventListener('change', () => {
            endTime = Math.max(startTime, Math.min(parseTimeInput(timeEndInput.value), videoDuration));
            timeEndInput.value = formatTimeInput(endTime);
            updateSliderVisuals(); updateVideoTime();
        });

        sourceVideo.addEventListener('seeked', () => { if (currentMode === 'preview') renderPreview(); });

        btnStart.addEventListener('click', async () => {
            if (!videoInput.files.length) return alert("Please select a video file first!");
            
            if (isEncoding) {
                shouldStopEncoding = true;
                btnStart.disabled = true;
                btnStart.innerText = "Stopping...";
                return;
            }

            const file = videoInput.files[0];
            const video = sourceVideo; 
            
            video.pause(); video.muted = true;
            if (playbackAnimFrame) cancelAnimationFrame(playbackAnimFrame);
            previewContainer.classList.remove('playing'); previewContainer.classList.add('paused');
            iconPlay.style.display = 'block'; iconPause.style.display = 'none';

            isEncoding = true; shouldStopEncoding = false; currentMode = 'monitor';
            previewContainer.classList.add('monitor-mode');
            monitorLeftSplit = 0.0; monitorRightSplit = 1.0;
            splitLeft.style.left = '0%'; splitRight.style.left = '100%';
            
            btnStart.innerText = "Stop Encoding"; btnStart.style.background = "#d9534f";
            document.querySelectorAll('input, select').forEach(el => el.disabled = true);
            seekSlider.style.pointerEvents = 'none'; seekSlider.style.opacity = '0.5';
            document.getElementById('progress-container').style.display = 'block';

            try {
                statusText.innerText = "Extracting Audio & Preparing Video...";
                const totalFrames = Math.floor((endTime - startTime) * TARGET_FPS);
                const playTimeDuration = endTime - startTime;
                
                const m = Math.floor(playTimeDuration / 60), s = Math.floor(playTimeDuration % 60), ms = Math.floor((playTimeDuration % 1) * 100);
                const playTime = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;

                const recipeMeta = {
                    encoder: "MV2 Web Encoder (WASM)", source: file.name, date: new Date().toISOString(),
                    duration_sec: video.duration, play_time: playTime, total_frames: totalFrames,
                    settings: {
                        quantizer: document.getElementById('cfg_quantizer').value, dither: "Fs",
                        dither_strength: parseInt(document.getElementById('cfg_dither').value),
                        anchors: document.getElementById('cfg_anchors').value.length, anchor_colors: document.getElementById('cfg_anchors').value,
                        extra_colors: parseInt(document.getElementById('cfg_colors').value), aspect: document.getElementById('cfg_aspect').value,
                        metric: document.getElementById('cfg_metric').value, nv: false 
                    }
                };

                const config = {
                    width: 256, height: 192,
                    quantizer: document.getElementById('cfg_quantizer').value,
                    dither_strength: parseInt(document.getElementById('cfg_dither').value),
                    anchor_colors: document.getElementById('cfg_anchors').value,
                    max_extra_colors: parseInt(document.getElementById('cfg_colors').value),
                    quant_iters_initial: parseInt(document.getElementById('cfg_iter_init').value),
                    quant_iters_subsequent: parseInt(document.getElementById('cfg_iter_sub').value),
                    metadata: JSON.stringify(recipeMeta),
                    
                    // 🚀 [핵심 아키텍처 반영] JS에서 이미 비율 맞춤 처리를 하므로 Rust에게는 Force를 강제합니다.
                    aspect_mode: "force", 
                    crop_left: 0, 
                    crop_up: 0,
                    
                    sample_rate: TARGET_SAMPLE_RATE, fps: TARGET_FPS, 
                    metric: document.getElementById('cfg_metric').value
                };

                statusText.innerText = "Initializing WASM Worker...";
                await new Promise((resolve, reject) => {
                    worker.onmessage = (e) => {
                        if (e.data.type === 'INIT_DONE') resolve();
                        if (e.data.type === 'ERROR') reject(e.data.payload);
                    };
                    worker.postMessage({ type: 'INIT', payload: { config: JSON.stringify(config) } });
                });

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: TARGET_SAMPLE_RATE });
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const pcmFloat32 = audioBuffer.getChannelData(0); 
                
                const startSample = Math.floor(startTime * TARGET_SAMPLE_RATE);
                const endSample = Math.floor(endTime * TARGET_SAMPLE_RATE);
                const slicedFloat32 = pcmFloat32.subarray(startSample, endSample);

                const pcmInt16 = new Int16Array(slicedFloat32.length);
                for (let i = 0; i < slicedFloat32.length; i++) {
                    let s = Math.max(-1, Math.min(1, slicedFloat32[i]));
                    pcmInt16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                statusText.innerText = "Encoding MP3 Audio...";
                const mp3Encoder = new lamejs.Mp3Encoder(1, TARGET_SAMPLE_RATE, 128); 
                const mp3Data = [];
                
                const mp3ChunkSize = 1152 * 10;
                for (let i = 0; i < pcmInt16.length; i += mp3ChunkSize) {
                    const chunk = pcmInt16.subarray(i, i + mp3ChunkSize);
                    const mp3buf = mp3Encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) mp3Data.push(new Uint8Array(mp3buf));
                }
                const leftover = mp3Encoder.flush();
                if (leftover.length > 0) mp3Data.push(new Uint8Array(leftover));
                
                const totalMp3Len = mp3Data.reduce((acc, curr) => acc + curr.length, 0);
                const fullMp3 = new Uint8Array(totalMp3Len);
                let offset = 0;
                for (const chunk of mp3Data) { fullMp3.set(chunk, offset); offset += chunk.length; }


                // 🚀 [고해상도 캔버스 치수 계산 로직 추가]
                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const vr = vw / vh;
                
                const aspectMode = document.getElementById('cfg_aspect').value;
                const targetRatioStr = document.querySelector('input[name="cfg_target_ratio"]:checked').value;
                const tr = targetRatioStr === '5:3' ? (5/3) : (4/3);
                
                let drawW, drawH;
                
                if (aspectMode === 'force') {
                    // Force 모드: 원본 비디오 해상도 그대로 전달 (Rust가 256x192로 욱여넣음)
                    drawW = vw;
                    drawH = vh;
                } else if (aspectMode === 'crop') {
                    // Crop 모드: 영상에서 필요한 부분만 고해상도로 추출
                    if (vr > tr) {
                        drawH = vh;
                        drawW = vh * tr;
                    } else {
                        drawW = vw;
                        drawH = vw / tr;
                    }
                } else if (aspectMode === 'pad') {
                    // Pad 모드: 타겟 비율에 맞춘 거대한 캔버스를 만듦
                    if (vr > tr) {
                        drawW = vw;
                        drawH = vw / tr; // 위아래 여백을 위해 캔버스가 더 길어짐
                    } else {
                        drawH = vh;
                        drawW = vh * tr; // 좌우 여백을 위해 캔버스가 더 넓어짐
                    }
                }

                // 소수점 오차 방지를 위해 반올림
                drawW = Math.round(drawW);
                drawH = Math.round(drawH);

                // 동적으로 계산된 고해상도 오프스크린 캔버스 생성
                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = drawW; 
                offscreenCanvas.height = drawH;
                const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });


                progressBar.max = totalFrames;
                let globalMp3Offset = 0;
                const bps = 16000; // 128kbps / 8
                let encodedFramesCount = 0;

                // 2. 메인 인코딩 루프
                for (let frameIdx = 0; frameIdx < totalFrames; frameIdx++) {
                    if (shouldStopEncoding) {
                        statusText.innerText = `Encoding Stopped at frame ${frameIdx}. Finalizing...`;
                        break;
                    }
                    
                    statusText.innerText = `Encoding Frame ${frameIdx + 1} / ${totalFrames}...`;
                    progressBar.value = frameIdx + 1;

                    await new Promise((resolve) => {
                        const targetTime = startTime + (frameIdx / TARGET_FPS);
                        if (Math.abs(video.currentTime - targetTime) < 0.01) {
                            resolve(); 
                        } else {
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                resolve();
                            };
                            video.addEventListener('seeked', onSeeked);
                            video.currentTime = targetTime;
                        }
                    });

                    // 🚀 [GPU 가속 고해상도 크롭/패드 연산]
                    offCtx.fillStyle = '#000';
                    offCtx.fillRect(0, 0, drawW, drawH);

                    const cropLeft = parseFloat(document.getElementById('cfg_crop_left').value) || 0;
                    const cropUp = parseFloat(document.getElementById('cfg_crop_up').value) || 0;

                    if (aspectMode === 'force') {
                        offCtx.drawImage(video, 0, 0, drawW, drawH);
                    } else if (aspectMode === 'crop') {
                        let sx = 0, sy = 0;
                        if (vr > tr) {
                            const maxOffX = vw - drawW;
                            sx = (maxOffX / 2) + (maxOffX / 2) * (cropLeft / 100);
                        } else {
                            const maxOffY = vh - drawH;
                            sy = (maxOffY / 2) + (maxOffY / 2) * (cropUp / 100);
                        }
                        offCtx.drawImage(video, sx, sy, drawW, drawH, 0, 0, drawW, drawH);
                    } else if (aspectMode === 'pad') {
                        let dx = 0, dy = 0;
                        if (vr > tr) {
                            dy = (drawH - vh) / 2;
                            offCtx.drawImage(video, 0, 0, vw, vh, 0, dy, vw, vh);
                        } else {
                            dx = (drawW - vw) / 2;
                            offCtx.drawImage(video, 0, 0, vw, vh, dx, 0, vw, vh);
                        }
                    }

                    // 👉 최종적으로 완벽하게 재단된 '고화질 타겟 비율' 픽셀 추출
                    const frameData = offCtx.getImageData(0, 0, drawW, drawH);
                    const rgbaBytes = new Uint8Array(frameData.data.buffer);


                    const target_a = Math.floor((frameIdx + 1) * (bps / TARGET_FPS));
                    let sz_blocks = Math.max(1, Math.min(111, Math.ceil((target_a - globalMp3Offset) / 32)));
                    let chunkByteSize = sz_blocks * 32;
                    let mp3Chunk;
                    if (globalMp3Offset >= fullMp3.length) {
                        mp3Chunk = new Uint8Array(0); 
                    } else {
                        mp3Chunk = fullMp3.slice(globalMp3Offset, globalMp3Offset + chunkByteSize);
                        globalMp3Offset += chunkByteSize;
                    }
                    
                    const samplesPerFrame = Math.floor(TARGET_SAMPLE_RATE / TARGET_FPS);
                    const actualAudioStart = frameIdx * samplesPerFrame;
                    const endSample = Math.min(actualAudioStart + samplesPerFrame, pcmInt16.length);
                    const pcmSlice = pcmInt16.subarray(actualAudioStart, endSample);

                    await new Promise((resolve, reject) => {
                        worker.onmessage = (e) => {
                            if (e.data.type === 'FRAME_DONE') {
                                const ditheredRGB = e.data.payload.ditheredRGB; 
                                
                                const split1 = Math.floor(256 * monitorLeftSplit);
                                const split2 = Math.floor(256 * monitorRightSplit);
                                
                                if (!window.monitorTempCanvas) {
                                    window.monitorTempCanvas = document.createElement('canvas');
                                    window.monitorTempCanvas.width = 256; window.monitorTempCanvas.height = 192;
                                }
                                const tCtx = window.monitorTempCanvas.getContext('2d');
                                const tImg = tCtx.createImageData(256, 192);
                                for (let i = 0, j = 0; i < ditheredRGB.length; i += 3, j += 4) {
                                    tImg.data[j] = ditheredRGB[i]; tImg.data[j+1] = ditheredRGB[i+1];
                                    tImg.data[j+2] = ditheredRGB[i+2]; tImg.data[j+3] = 255;
                                }
                                tCtx.putImageData(tImg, 0, 0);

                                ctx.clearRect(0, 0, canvas.width, canvas.height);
                                
                                // Region 1: Source (Left)
                                if (split1 > 0) {
                                    ctx.save();
                                    ctx.beginPath(); ctx.rect(0, 0, split1, 192); ctx.clip();
                                    // 🚀 오프스크린(고해상도) 캔버스를 모니터용 256x192 창에 예쁘게 축소해서 그립니다.
                                    ctx.drawImage(offscreenCanvas, 0, 0, drawW, drawH, 0, 0, 256, 192); 
                                    ctx.restore();
                                }

                                // Region 2 & 3: Result (Middle & Right)
                                if (split1 < 256) {
                                    ctx.save();
                                    ctx.beginPath(); ctx.rect(split1, 0, 256 - split1, 192); ctx.clip();
                                    ctx.drawImage(window.monitorTempCanvas, 0, 0);
                                    ctx.restore();
                                }

                                ctx.lineWidth = 1;
                                if (split1 > 0 && split1 < 256) {
                                    ctx.strokeStyle = '#4CAF50'; 
                                    ctx.beginPath(); ctx.moveTo(split1, 0); ctx.lineTo(split1, 192); ctx.stroke();
                                }
                                if (split2 > split1 && split2 < 256) {
                                    ctx.strokeStyle = '#ff9800'; 
                                    ctx.beginPath(); ctx.moveTo(split2, 0); ctx.lineTo(split2, 192); ctx.stroke();
                                }

                                resolve();
                            }
                            if (e.data.type === 'ERROR') reject(e.data.payload);
                        };
                        
                        // 🚀 Worker에게 고해상도 치수(drawW, drawH)와 픽셀을 전송합니다.
                        worker.postMessage({ 
                            type: 'ENCODE_FRAME', 
                            payload: { rgbaBytes, origW: drawW, origH: drawH, mp3Chunk, pcmSlice, frameIdx } 
                        });
                    });
                    
                    encodedFramesCount++;
                }

                statusText.innerText = "Finalizing & Muxing binary files...";
                const remainingMp3 = shouldStopEncoding ? new Uint8Array(0) : fullMp3.slice(globalMp3Offset);

                await new Promise((resolve, reject) => {
                    worker.onmessage = (e) => {
                        if (e.data.type === 'FINISHED') {
                            const { mv2Bytes, rgbBytes } = e.data.payload;
                            downloadFile(mv2Bytes, "retro_output.mv2", "application/octet-stream");
                            // downloadFile(rgbBytes, "retro_output.rgb", "application/octet-stream");
                            resolve();
                        }
                        if (e.data.type === 'ERROR') reject(e.data.payload);
                    };
                    worker.postMessage({ type: 'FINISH', payload: { remainingMp3, earlyAbort: shouldStopEncoding } });
                });

                statusText.innerText = shouldStopEncoding ? `Encoding Stopped. Exported ${encodedFramesCount} frames.` : "Encoding Complete! 🎉";

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: " + err;
            } finally {
                isEncoding = false; shouldStopEncoding = false; currentMode = 'preview';
                previewContainer.classList.remove('monitor-mode');
                btnStart.innerText = "Start Encoding"; btnStart.style.background = "#007acc"; btnStart.disabled = false;
                
                document.querySelectorAll('input, select').forEach(el => el.disabled = false);
                seekSlider.style.pointerEvents = 'auto'; seekSlider.style.opacity = '1';
                
                document.getElementById('progress-container').style.display = 'none';
                renderPreview();
            }
        });

        function downloadFile(uint8Array, filename, mimeType) {
            const blob = new Blob([uint8Array], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
