<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MSX2 MV Player & Recorder</title>
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --eq-opacity: 0.25; --accent: #d9534f; --bg: #0f0f0f; --surface: #1a1a1a; --border: #2a2a2a; }
        *, *::before, *::after { box-sizing: border-box; }
        html { height: 100%; /* 스크롤을 허용하여 아이폰 주소창 숨김 유도 */ }
        body { margin: 0; background-color: var(--bg); color: #eee; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-y: auto; display: flex; flex-direction: column; width: 100%; min-height: 100vh; min-height: 100dvh; }

        /* ── App Bar ── */
        #app-bar { display: none; }
        @media (min-width: 768px) { #app-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border); height: 40px; } }
        .app-bar-title { font-size: 14px; font-weight: 600; color: #ddd; display: flex; align-items: center; gap: 8px; }
        .app-bar-title svg { fill: var(--accent); }
        #btn-info-toggle { background: transparent; border: none; cursor: pointer; fill: #888; padding: 4px; display: flex; align-items: center; transition: fill 0.2s; }
        #btn-info-toggle:hover { fill: var(--accent); }

        /* ── Screen Wrapper & Video ── */
        #screen-wrapper { position: relative; background-color: #000; width: 100%; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
        #video-container { position: relative; display: flex; flex-direction: column; align-items: center; background: #000; width: 100%; max-width: min(100vw, calc((100vh - 120px) * 5 / 3)); margin: 0 auto; flex-shrink: 0; }
        #canvas-area { position: relative; aspect-ratio: 5 / 3; background: #000; width: 100%; max-width: 100%; overflow: hidden; }
        @media (min-width: 768px) { #video-container { max-width: min(960px, calc((100vh - 150px) * 5 / 3)); } }

        /* ── 정상적인 전체화면 (PC, 안드로이드, 아이폰 가로로 눕혔을 때) ── */
        #screen-wrapper:fullscreen { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; }
        #screen-wrapper:fullscreen #video-container { max-width: 100% !important; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #screen-wrapper:fullscreen #canvas-area { width: 100% !important; height: 100% !important; max-width: calc(100vh * 5 / 3) !important; max-height: calc(100vw * 3 / 5) !important; margin: auto; }
        @media (orientation: landscape) { 
            #screen-wrapper:fullscreen #palette-histogram, #screen-wrapper:fullscreen #playlist-sidebar { display: none !important; } 
        }

        /* ── 아이폰 전용 강제 가로모드 (세로로 들고 있을 때 가짜 전체화면 발동) ── */
        @media screen and (orientation: portrait) {
            .ios-fullscreen-fix { position: fixed !important; top: 50% !important; left: 50% !important; width: 100vh !important; height: 100vw !important; width: 100dvh !important; height: 100dvw !important; transform: translate(-50%, -50%) rotate(90deg) !important; transform-origin: center center !important; background: #000 !important; z-index: 9999 !important; margin: 0 !important; padding: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; }
            .ios-fullscreen-fix #video-container { width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; margin: 0 !important; display: flex !important; align-items: center !important; justify-content: center !important; }
            .ios-fullscreen-fix #canvas-area { width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; aspect-ratio: 5 / 3 !important; margin: auto !important; }
            .ios-fullscreen-fix #palette-histogram, .ios-fullscreen-fix #playlist-sidebar { display: none !important; }
        }

        #msx-screen { width: 100%; height: 100%; object-fit: fill; image-rendering: pixelated; display: block; }
        #canvas-msg-overlay { position: absolute; top: 20px; bottom: 20px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #777; z-index: 20; border: 1px dashed #333; margin: 0 40px; border-radius: 4px; cursor: pointer; pointer-events: auto; transition: background 0.2s, color 0.2s; }
        #canvas-msg-overlay:hover { background: rgba(255, 255, 255, 0.05); color: #aaa; }

        /* ── EQ Overlay ── */
        #eq-overlay { position: absolute; top: 0; left: 0; width: 25%; height: 25%; pointer-events: auto; cursor: pointer; display: flex; align-items: flex-end; justify-content: space-between; padding: 2%; gap: 2%; z-index: 40; transition: opacity 0.2s; }
        #eq-overlay.hidden { opacity: 0; }
        .overlay-eq-bar { flex: 1; background-color: rgba(255, 255, 255, var(--eq-opacity)); height: 0%; border-radius: 1px 1px 0 0; transition: height 0.05s ease-out; }

        /* ── OSD Controls ── */
        #osd-controls { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 30%, transparent 70%, rgba(0, 0, 0, 0.4) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; opacity: 0; transition: opacity 0.3s; z-index: 25; pointer-events: none; }
        @media (min-width: 768px) { #osd-controls { padding: 15px; } }
        
        /* 마우스가 있는 기기에서만 hover 작동, 터치 기기는 hover 무시 */
        @media (hover: hover) { #canvas-area:hover #osd-controls { opacity: 1; pointer-events: auto; } }
        .touch-active #osd-controls, .paused #osd-controls { opacity: 1; pointer-events: auto; }
        #canvas-area.empty #osd-controls { display: none !important; }

        .osd-center-controls { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 20px; pointer-events: auto; }
        @media (min-width: 768px) { .osd-center-controls { gap: 30px; } }
        .osd-icon-btn { background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; cursor: pointer; fill: white; display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; transition: background 0.2s, transform 0.1s; }
        .osd-icon-btn:hover { background: rgba(0, 0, 0, 0.7); }
        .osd-icon-btn:active { transform: scale(0.9); }
        .btn-osd-track svg { width: 28px; height: 28px; }
        @media (min-width: 768px) { .btn-osd-track svg { width: 36px; height: 36px; } }
        #btn-osd-play-pause { min-width: 56px; min-height: 56px; }
        #btn-osd-play-pause svg { width: 36px; height: 36px; }
        @media (min-width: 768px) { #btn-osd-play-pause svg { width: 48px; height: 48px; } }

        .osd-frame-controls { display: none; justify-content: center; gap: 10px; margin-bottom: 5px; pointer-events: auto; }
        @media (min-width: 600px) { .osd-frame-controls { display: flex; } }
        .osd-frame-btn { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px; cursor: pointer; fill: #aaa; display: flex; align-items: center; justify-content: center; padding: 4px 12px; min-height: 44px; transition: all 0.2s; }
        .osd-frame-btn:hover { fill: #fff; }

        .osd-bottom-bar { display: flex; flex-direction: column; gap: 4px; width: 100%; pointer-events: auto; }
        .osd-slider-row { display: flex; align-items: center; gap: 8px; width: 100%; }
        .osd-controls-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .osd-left-controls, .osd-right-controls { display: flex; align-items: center; gap: 2px; }
        @media (min-width: 768px) { .osd-left-controls, .osd-right-controls { gap: 5px; } }

        #btn-volume, #btn-repeat, #btn-zoom, #btn-fullscreen-toggle, #btn-osd-open, #btn-osd-save { background: transparent; border: none; cursor: pointer; fill: white; padding: 8px; display: flex; align-items: center; min-width: 40px; min-height: 40px; justify-content: center; transition: transform 0.1s; }
        #btn-osd-open:active, #btn-osd-save:active { transform: scale(0.9); }
        #btn-zoom { display: none !important; }

        #osd-codec-container { display: flex; align-items: center; width: 0; opacity: 0; overflow: hidden; transition: all 0.3s ease; white-space: nowrap; gap: 5px; }
        .osd-save-group { display: flex; align-items: center; }
        .osd-save-group:hover #osd-codec-container { width: 130px; opacity: 1; margin-right: 5px; }
        #osd-seek-slider { flex-grow: 1; cursor: pointer; accent-color: #ff0000; margin: 0; height: 20px; }
        .osd-time { font-family: monospace; font-size: 11px; color: #ddd; min-width: 75px; text-align: left; white-space: nowrap; }

        .osd-volume-group { display: flex; align-items: center; gap: 2px; }
        #volume-slider { width: 0; opacity: 0; transition: width 0.2s, opacity 0.2s; cursor: pointer; accent-color: #fff; }
        @media (min-width: 768px) { .osd-volume-group:hover #volume-slider { width: 60px; opacity: 1; } }
        .osd-btn-active { fill: var(--accent) !important; }

        /* ── Palette Histogram ── */
        #palette-histogram { width: 100%; max-width: 960px; margin: 0 auto; height: auto; min-height: 40px; background: var(--surface); display: flex; flex-direction: row; justify-content: space-between; padding: 8px 5px; border-top: 1px solid var(--border); cursor: pointer; transition: height 0.3s, opacity 0.3s; }
        @media (orientation: landscape) {
            #palette-histogram { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 20px; height: auto; max-width: none; flex-direction: column; background: rgba(0, 0, 0, 0.5); border-top: none; border-left: 1px solid var(--border); border-radius: 4px 0 0 4px; padding: 5px 2px; gap: 2px; z-index: 20; }
            #palette-histogram.hidden { width: 20px; height: auto; padding: 5px 2px; opacity: 0.6; }
            #palette-histogram .hist-row { width: 100%; height: 12px; flex-direction: row; margin-bottom: 2px; }
            #palette-histogram .hist-bar { display: none; }
        }
        #palette-histogram.hidden { height: 12px; padding: 8px 5px; opacity: 0.6; overflow: hidden; }
        .hist-row { display: flex; flex-direction: column; align-items: center; width: calc(100% / 16); height: 100%; gap: 3px; }
        .hist-color-box { width: 12px; height: 12px; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2px; }
        #palette-histogram.hidden .hist-color-box { background-color: #000 !important; }
        .hist-bar { width: 12px; background-color: rgba(77, 182, 172, 0.8); border-radius: 0 0 1px 1px; transition: height 0.1s; }

        /* ── Playlist Sidebar ── */
        #playlist-sidebar { width: 100%; max-width: 960px; margin: 0 auto; background: var(--surface); display: flex; flex-direction: column; border-top: 1px solid var(--border); overflow: hidden; flex-grow: 1; flex-shrink: 1; min-height: 0; }
        #playlist-sidebar.hidden .playlist-content { display: none; }
        #playlist-folder { width: 100%; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); transition: background 0.2s; flex-shrink: 0; }
        #playlist-folder:hover { background: rgba(255, 255, 255, 0.08); }
        #playlist-folder svg { fill: #666; transition: transform 0.3s; transform: rotate(90deg); }
        #playlist-sidebar.hidden #playlist-folder svg { transform: rotate(270deg); }
        .playlist-content { display: flex; flex-direction: column; width: 100%; flex-grow: 1; min-height: 0; overflow: hidden; }
        .playlist-header { padding: 6px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; background: rgba(255, 255, 255, 0.02); flex-shrink: 0; }
        .playlist-header-btn { display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; border-radius: 8px; transition: background 0.2s; min-width
