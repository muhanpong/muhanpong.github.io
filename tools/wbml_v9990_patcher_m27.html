<title>WBML V9990 Patcher</title>
<style>
:root { --bg: #f6f6f3; --fg: #1d1d1b; --mut: #66655f; --card: #fff; --line: #d9d8d2; --acc: #0b7a6e; --bad: #b3261e; --ok: #1d7a2f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecebe6; --mut: #a3a29b; --card: #20201e; --line: #3a3936; --acc: #3cc1b0; --bad: #f2867d; --ok: #7fd48e; color-scheme: dark; } }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
.sub { color: var(--mut); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 12px; text-align: center; cursor: pointer; }
#drop.over { border-color: var(--acc); }
button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--acc); background: var(--acc); color: #fff; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
ul { margin: 6px 0 0; padding-left: 18px; }
li.ok { color: var(--ok); } li.no { color: var(--bad); }
a { color: var(--acc); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; word-break: break-all; }
.mut { color: var(--mut); font-size: .9em; }
#msg.bad { color: var(--bad); } #msg.ok { color: var(--ok); }
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.top > div:first-child { min-width: 0; flex: 1 1 320px; }
.card ul + b { display: block; margin-top: 12px; }
.shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 16px; }
.shots figure { margin: 0; min-width: 0; }
.shots img { width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border-radius: 6px; display: block; cursor: zoom-in; background: #000; }
.shots figcaption { font-size: .8rem; color: var(--mut); text-align: center; }
@media (max-width: 560px) { .shots { grid-template-columns: repeat(2, 1fr); } }
#zoom { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; z-index: 10; }
#zoom img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
#zoom[hidden] { display: none; }
.lang { margin-bottom: 12px; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); flex: none; }
.lang button { background: transparent; color: var(--mut); border: 0; border-radius: 0; padding: 5px 12px; font-size: .85rem; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: color-mix(in srgb, var(--acc) 14%, transparent); color: var(--fg); font-weight: 600; }
</style>
</head>
<body>
<main>
<div class="top">
  <div>
    <h1><span data-t="title"></span> m27</h1>
    <p class="sub" data-t="sub"></p>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">English</button><button type="button" data-lang="ja">日本語</button>
  </div>
</div>

<div class="shots">
  <figure><img id="i_t" alt=""><figcaption data-t="c_t"></figcaption></figure>
  <figure><img id="i_r1" alt=""><figcaption data-t="c_r1"></figcaption></figure>
  <figure><img id="i_r3" alt=""><figcaption data-t="c_r3"></figcaption></figure>
  <figure><img id="i_m" alt=""><figcaption data-t="c_m"></figcaption></figure>
</div>
<div id="zoom" hidden><img alt=""></div>

<div class="card">
  <div id="drop"><span data-t="drop"></span>
    <input id="file" type="file" multiple hidden>
  </div>
  <ul class="mut" data-t="hint"></ul>
  <p id="set" class="mut"></p>
  <ul id="list"></ul>

  <button id="go" disabled data-t="go"></button>
  <p id="msg"></p>
  <p id="again" hidden><a id="dl" href="#" data-t="again"></a></p>

  const got = {}, byCrc = {};
  for (const f of files) byCrc[f.data.length + ':' + crc32(f.data)] = f;
  for (const [n, r] of Object.entries(PD.need)) {
    const f = byCrc[r.size + ':' + (r.crc >>> 0)];
    if (f) got[n] = f.data;
  }
  return { got, missing: Object.keys(PD.need).filter(n => !got[n]) };
}

// the user's files -> the canonical files (tools/webpatch.py prep_of): c copy, x XOR with the stored
// delta, m opcodes/data halves of a 64 KB bootleg file by the stored bit mask (+ fixed bytes), h its data half
async function prep(got) {
  const out = {};
  for (const [n, p] of Object.entries(PD.prep)) {
    const u = got[p.f];
    if (p.k === 'c') out[n] = u;
    else if (p.k === 'h') out[n] = u.slice(0x8000);
    else if (p.k === 'x') { const d = await inflateRaw(b64(p.d)), o = new Uint8Array(u.length); for (let i = 0; i < u.length; i++) o[i] = u[i] ^ d[i]; out[n] = o; }
    else {
      const m = await inflateRaw(b64(p.m)), o = new Uint8Array(0x8000);
      for (let i = 0; i < 0x8000; i++) o[i] = (m[i >> 3] >> (i & 7)) & 1 ? u[i] : u[0x8000 + i];
      for (const [i, h] of p.x) o[i] = parseInt(h, 16);
      out[n] = o;
    }
  }
  return out;
}

// ---- the arcade-derived image (as port/mk.py and tools/webpatch.py), then our runs over it
function derived(F) {
  const t = new Uint8Array(0x18000); t.set(F['epr-11034.4'], 0); t.set(F['epr-11035.5'], 0x8000); t.set(F['epr-11036.6'], 0x10000);
  const packed = new Uint8Array(4096 * 32), pmask = new Uint8Array(4096), unif = new Uint8Array(4096).fill(0xFF), px = new Uint8Array(64);
  for (let code = 0; code < 4096; code++) {
    for (let y = 0; y < 8; y++) {
      const b0 = t[code * 8 + y], b1 = t[0x8000 + code * 8 + y], b2 = t[0x10000 + code * 8 + y];
      for (let x = 0; x < 8; x++) { const m = 0x80 >> x; px[y * 8 + x] = (b0 & m ? 4 : 0) | (b1 & m ? 2 : 0) | (b2 & m ? 1 : 0); }
    }
    let same = true;
    for (let i = 0; i < 64; i++) { pmask[code] |= 1 << px[i]; if (px[i] !== px[0]) same = false; }
    if (same) unif[code] = px[0];
    for (let i = 0; i < 32; i++) packed[code * 32 + i] = px[2 * i] * 8 + px[2 * i + 1];
  }
  const lvl = v => Math.floor(((0x0e * (v & 1) + 0x1f * (v >> 1 & 1) + 0x43 * (v >> 2 & 1) + 0x8f * (v >> 3 & 1)) * 31 + 127) / 255);
  const R = new Uint8Array(0x80000);
  R.set(packed.subarray(0x1E000, 0x20000), 0x06000);
  R.set(F['decrypted_epr-11031a.90'], 0x08000);
  R.set(F['decrypted_epr-11032.91'], 0x10000); R.set(F['decrypted_epr-11033.92'], 0x18000);
  ['pr11026.20', 'pr11025.14', 'pr11024.8'].forEach((n, k) => R.set(F[n].map(lvl), 0x22800 + 0x100 * k));
  R.set(pmask, 0x24000); R.set(unif, 0x26000);
  R.set(F['epr-11037.126'], 0x28000);
  ['epr-11028.87', 'epr-11027.86', 'epr-11030.89', 'epr-11029.88'].forEach((n, k) => R.set(F[n], 0x40000 + 0x8000 * k));
  R.set(packed, 0x60000);
  return R;
}
async function build(F) {
  const R = derived(F);
  const p = await inflateRaw(b64(PDA.roms[PD.tag].patch));
  const v = new DataView(p.buffer);
  for (let i = 0; i < p.length;) { const o = v.getUint32(i, true), n = v.getUint32(i + 4, true); R.set(p.subarray(i + 8, i + 8 + n), o); i += 8 + n; }
  return R;
}

const files = [];
let ready = null, built = false;
const $ = id => document.getElementById(id);

async function add(list) {
  built = false;
  for (const f of list) {
    const u = new Uint8Array(await f.arrayBuffer());
    if (/\.zip$/i.test(f.name) || (u[0] === 0x50 && u[1] === 0x4b)) {
      try { files.push(...await unzip(u)); } catch (e) { $('msg').textContent = f.name + ': ' + e.message; }
    } else files.push({ name: f.name, data: u });
  }
  show();
}
// the data sets whose files are all here (size + CRC32); several: the user picks one (radio buttons)
let pick = 0;
function show(relang) {
  const res = PDA.sets.map(st => { PD = Object.assign({}, st); return { st, r: match(files) }; });
  const full = res.filter(x => !x.r.missing.length);
  let cur;
  if (full.length) { if (pick >= full.length) pick = 0; cur = full[pick]; }
  else cur = res.reduce((a, x) => x.r.missing.length < a.r.missing.length ? x : a, res[0]);
  PD = Object.assign({}, cur.st);
  const R = PDA.roms[PD.tag];
  const { got, missing } = cur.r;
  $('set').innerHTML = !files.length ? '' : full.length > 1
    ? T().several + full.map((x, i) => `<label><input type="radio" name="pk" value="${i}"${i === pick ? ' checked' : ''}> ${lb(x.st)}</label>`).join(' ')
    : T().input + lb(PD);
  document.querySelectorAll('input[name=pk]').forEach(e => e.onchange = () => { pick = +e.value; show(); });
  $('list').innerHTML = !files.length ? '' : Object.keys(PD.need).map(n =>
    `<li class="${got[n] ? 'ok' : 'no'}">${got[n] ? '✓' : '✗'} <code>${n}</code></li>`).join('');
  ready = missing.length ? null : got;
  $('go').disabled = !ready;
  $('cmd').textContent = `openmsx -machine Panasonic_FS-A1ST -ext gfx9000 -cart ${R.name} -romtype KonamiSCC`;
  if (!files.length || (relang && built)) return;
  $('msg').className = missing.length ? 'bad' : '';
  $('msg').textContent = missing.length ? T().missing(missing.length, [...new Set(PDA.sets.map(lb))].join(', ')) : T().willmake(lb(PD), R.md5);
}

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => add(e.target.files);
for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); });
for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); });
drop.addEventListener('drop', e => add(e.dataTransfer.files));

$('go').onclick = async () => {
  $('go').disabled = true;
  try {
    const R = PDA.roms[PD.tag];
    const rom = await build(await prep(ready));
    const m = md5(rom);
    const okm = m === R.md5;
    $('msg').className = okm ? 'ok' : 'bad';
    built = true;
    $('msg').innerHTML = (okm ? T().done(R.name) : T().diff) + `MD5 <code>${m}</code>` + (okm ? '' : ` (${T().ref} <code>${R.md5}</code>)`);
    const a = $('dl');
    a.href = URL.createObjectURL(new Blob([rom], { type: 'application/octet-stream' }));
    a.download = R.name;
    $('again').hidden = false;
    a.click();
  } catch (e) {
    $('msg').className = 'bad'; $('msg').textContent = T().fail + e.message;
  }
  $('go').disabled = false;
};
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.querySelectorAll('.shots img').forEach(i => i.onclick = () => { $('zoom').firstChild.src = i.src; $('zoom').hidden = false; });
$('zoom').onclick = () => { $('zoom').hidden = true; };
setLang(lang);
if (typeof DecompressionStream === 'undefined') { $('msg').className = 'bad'; $('msg').textContent = T().nods; }
</script>
</body>
