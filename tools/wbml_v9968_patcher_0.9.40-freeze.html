<style>
:root { --bg: #f6f6f3; --fg: #1d1d1b; --mut: #66655f; --card: #fff; --line: #d9d8d2; --acc: #0b7a6e; --bad: #b3261e; --ok: #1d7a2f; --seg: #e3f1ef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecebe6; --mut: #a3a29b; --card: #20201e; --line: #3a3936; --acc: #3cc1b0; --bad: #f2867d; --ok: #7fd48e; --seg: #1f3532; } }
:root[data-theme="dark"] { --bg: #161615; --fg: #ecebe6; --mut: #a3a29b; --card: #20201e; --line: #3a3936; --acc: #3cc1b0; --bad: #f2867d; --ok: #7fd48e; --seg: #1f3532; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; gap: 8px 12px; align-items: flex-start; flex-wrap: wrap; }
header h1 { flex: 1 1 360px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
.sub { color: var(--mut); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 0 0 16px; }
#drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px 12px; text-align: center; cursor: pointer; }
#drop.over { border-color: var(--acc); }
button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--acc); background: var(--acc); color: #fff; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
.lang { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); flex: none; }
.lang button { border: 0; border-radius: 0; background: transparent; color: var(--mut); padding: 5px 12px; font-size: .88rem; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--seg); color: var(--fg); font-weight: 600; }
ul { margin: 6px 0 0; padding-left: 18px; }
li.ok { color: var(--ok); } li.no { color: var(--bad); }
a { color: var(--acc); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; word-break: break-all; }
.mut { color: var(--mut); font-size: .9em; }
#msg.bad { color: var(--bad); } #msg.ok { color: var(--ok); }
.shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 0 0 6px; }
@media (max-width: 560px) { .shots { grid-template-columns: repeat(2, 1fr); } }
.shots figure { margin: 0; }
.shots img { display: block; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; border-radius: 6px; background: #000; cursor: zoom-in; }
.shots figcaption { color: var(--mut); font-size: .8rem; margin-top: 3px; text-align: center; }
#big { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; z-index: 10; }
#big.on { display: flex; }
#big img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
</style>
</head>

// [{name, data}] -> {need name: data} by size + CRC32 (names may differ); missing: [names]
function match(files) {

    if (f) got[n] = f.data;

function b64(s) {
  const bin = atob(s), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

function hex(s) {
  const u = new Uint8Array(s.length / 2);
  for (let i = 0; i < u.length; i++) u[i] = parseInt(s.substr(i * 2, 2), 16);

}


// sprite colour sets (v0.9.7): the same as tools/sprcol.py

const SC_ACCEPT = [72, 8, 124];
const SC_PALS = [0x80A0, 0x80AE, 0x80BC, 0x80CA, 0x80D8, 0x80E6, 0x80A0, 0x80F4, 0x81F0];

// the user's files (by their names in PD.need) -> the canonical files build() takes (PD.prep, tools/mkpatcher.py):
// c copy, x XOR with the stored delta, m opcodes/data halves of a 64 KB bootleg file by the stored bit mask (+ fixed
// bytes), h its data half
async function prep(got) {
  const out = {};
  for (const [n, p] of Object.entries(PD.prep || {})) {
    const u = got[p.f];
    if (p.k === 'c') out[n] = u;
    else if (p.k === 'h') out[n] = u.slice(0x8000);
    else if (p.k === 'x') { const d = await inflateRaw(b64(p.d)), o = new Uint8Array(u.length); for (let i = 0; i < u.length; i++) o[i] = u[i] ^ d[i]; out[n] = o; }

      const m = await inflateRaw(b64(p.m)), o = new Uint8Array(0x8000);
      for (let i = 0; i < 0x8000; i++) o[i] = (m[i >> 3] >> (i & 7)) & 1 ? u[i] : u[0x8000 + i];
      for (const [i, h] of p.x) o[i] = parseInt(h, 16);
      out[n] = o;
    }
  }
  return PD.prep ? out : got;
}

async function build(f) {
  const cart = await inflateRaw(b64(PD.tpl));
  if (cart.length !== 0x100000) throw new Error('template');
  const B = bank => bank * 0x2000;
  const cat = (...names) => {
    const t = names.reduce((s, n) => s + f[n].length, 0), u = new Uint8Array(t);
    let o = 0; for (const n of names) { u.set(f[n], o); o += f[n].length; }

    cart.set(raw, at);
    for (const [o, h] of runs) cart.set(hex(h), at + o);
  };
  // arcade program (RST 0 I/O traps, jumps), its banks, sound ROM (driver, tables)
  patched(B(4), f['decrypted_epr-11031a.90'], PD.arc);
  cart.set(cat('decrypted_epr-11032.91', 'decrypted_epr-11033.92'), B(8));
  for (const [o, h] of PD.bnk) cart.set(hex(h), B(8) + o);   // the ending's star loop (mk.py)
  patched(B(20), f['epr-11037.126'], PD.snd);
  // sprites
  cart.set(cat('epr-11028.87', 'epr-11027.86', 'epr-11030.89', 'epr-11029.88'), B(32));
  // tiles: 4096 x 64 bytes, pixel = plane0 << 2 | plane1 << 1 | plane2
  const t = cat('epr-11034.4', 'epr-11035.5', 'epr-11036.6');

  const pmask = new Uint8Array(4096), unif = new Uint8Array(4096).fill(0xFF);

      for (let x = 0; x < 8; x++) {
        const m = 0x80 >> x;

        if (p === 1 && (code === 0x4E0 || code === 0x4ED || code === 0x4F0)) p = 0;   // the ending's stars (mk.py)

// input set names (labels in the patcher data are Korean)
const LBL = {
  '한글 패치 v0.21': { en: 'Korean patch v0.21', ja: '韓国語パッチ v0.21' },
  '한글 패치 v0.10': { en: 'Korean patch v0.10', ja: '韓国語パッチ v0.10' },
  '일본판 (wbmld, 복호화본)': { en: 'Japanese (wbmld, decrypted)', ja: '日本版（wbmld、復号版）' },
  '일본판 (wbml)': { en: 'Japanese (wbml)', ja: '日本版（wbml）' },
  '영문판 (wbmlb)': { en: 'English (wbmlb)', ja: '英語版（wbmlb）' },
};
let lang = 'ko';
const t = k => T[lang][k];
const lbl = s => (LBL[s] && LBL[s][lang]) || s;
const files = [];
let ready = null;
const $ = id => document.getElementById(id);
let msgFn = null;                     // the message under the button, redrawn on a language change
function setMsg(cls, fn) { msgFn = fn; $('msg').className = cls; $('msg').innerHTML = fn ? fn() : ''; }

function setLang(l) {
  if (!T[l]) l = 'ko';
  lang = l;
  document.documentElement.lang = l;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(e => { e.innerHTML = t(e.dataset.t); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === l));
  document.querySelectorAll('img[data-s]').forEach(e => { const k = e.dataset.s; e.src = SHOTS[k + '_' + l] || SHOTS[k]; e.alt = t(k === 'bossroom' ? 's_boss' : 's_' + k); });
  try { localStorage.setItem('wbml_v9968_lang', l); } catch (e) {}
  if (files.length) renderSet();
  if (msgFn) $('msg').innerHTML = msgFn();
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.l));
// screenshots: click for a large view, click or Esc to close
const big = document.getElementById('big');
document.querySelectorAll('img[data-s]').forEach(e => e.onclick = () => { big.firstElementChild.src = e.src; big.classList.add('on'); });
big.onclick = () => big.classList.remove('on');
addEventListener('keydown', e => { if (e.key === 'Escape') big.classList.remove('on'); });
{
  let l = new URLSearchParams(location.search).get('lang');
  if (!l) try { l = localStorage.getItem('wbml_v9968_lang'); } catch (e) {}
  if (!l) l = (navigator.language || 'ko').slice(0, 2);
  setLang(l === 'ja' || l === 'en' ? l : 'ko');
}
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

async function add(list) {
  for (const f of list) {
    const u = new Uint8Array(await f.arrayBuffer());
    if (/\.zip$/i.test(f.name) || (u[0] === 0x50 && u[1] === 0x4b)) {
      try { files.push(...await unzip(u)); } catch (e) { const m = esc(f.name + ': ' + e.message); setMsg('bad', () => m); return; }
    } else files.push({ name: f.name, data: u });
  }
  show();
}
// the data sets whose files are all here (size + CRC32); several: the user picks one (radio buttons)
let pick = 0, full = [], cur = null;
function show() {
  const res = PDA.sets.map(st => { PD = Object.assign({}, PDA, st); return { st, r: match(files) }; });
  full = res.filter(x => !x.r.missing.length);
  if (full.length) { if (pick >= full.length) pick = 0; cur = full[pick]; }
  else cur = res.reduce((a, x) => x.r.missing.length < a.r.missing.length ? x : a, res[0]);
  PD = Object.assign({}, PDA, cur.st);
  renderSet();
  const { got, missing } = cur.r;
  ready = missing.length ? null : got;
  $('go').disabled = !ready;
  const lab = PD.label, m5 = PD.md5;
  setMsg(missing.length ? 'bad' : '', missing.length
    ? () => t('missing')(missing.length, [...new Set(PDA.sets.map(s => lbl(s.label)))].join(', '))
    : () => t('ready')(lbl(lab), m5));
}
function renderSet() {
  const { got } = cur.r;
  $('set').innerHTML = !files.length ? '' : full.length > 1
    ? t('pick') + full.map((x, i) => `<label><input type="radio" name="pk" value="${i}"${i === pick ? ' checked' : ''}> ${lbl(x.st.label)}</label>`).join(' ')
    : t('input') + lbl(PD.label);
  document.querySelectorAll('input[name=pk]').forEach(e => e.onchange = () => { pick = +e.value; show(); });
  $('list').innerHTML = Object.keys(PD.need).map(n =>
    `<li class="${got[n] ? 'ok' : 'no'}">${got[n] ? '✓' : '✗'} <code>${n}</code></li>`).join('');
}

$('xml').innerHTML = Object.keys(PD.xml).map(n => `<li><a href="#" data-x="${n}">${n}</a></li>`).join('');
$('xml').onclick = e => {
  const n = e.target.dataset && e.target.dataset.x;
  if (!n) return;
  e.preventDefault();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([PD.xml[n]], { type: 'application/xml' }));
  a.download = n;
  a.click();
};
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => add(e.target.files);
for (const ev of ['dragenter', 'dragover']) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); });
for (const ev of ['dragleave', 'drop']) drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); });
drop.addEventListener('drop', e => add(e.dataTransfer.files));

$('go').onclick = async () => {
  $('go').disabled = true;
  try {
    const rom = await build(await prep(ready));
    const m = md5(rom), ref = PD.md5;
    const okm = m === ref;
    setMsg(okm ? 'ok' : 'bad', () => (okm ? t('done') : t('diff')) + `MD5 <code>${m}</code>` + (okm ? '' : ` (${t('ref')} <code>${ref}</code>)`));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([rom], { type: 'application/octet-stream' }));
    a.download = `wbml_v9968_${PD.ver}_${PD.tag}.rom`;
    a.click();
  } catch (e) {
    const em = esc(e.message);
    setMsg('bad', () => t('fail') + em);
  }
  $('go').disabled = false;
};
</script>
