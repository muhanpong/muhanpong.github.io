<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MSX2 MV Player & Recorder (MV1/MV2 Supported)</title>
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #111;
            color: #eee;
            font-family: sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        #screen-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
            background-color: #000;
            max-width: 100%;
            box-sizing: border-box;
        }

        #screen-wrapper:fullscreen {
            border: none;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
        }

        #screen-wrapper::backdrop {
            background-color: #000;
        }

        #msx-screen {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            display: block;
        }

        #screen-wrapper:fullscreen #msx-screen {
            width: 100vw;
            height: 100vh;
            max-height: 100vh;
        }

        #video-container {
            position: relative;
            display: inline-block;
            max-width: min(100%, calc(55vh * 5 / 3));
            max-height: 55vh;
            aspect-ratio: 5 / 3;
            width: 960px;
            /* Managed by JS slider */
            height: auto;
            transition: width 0.2s;
        }

        #screen-wrapper:fullscreen #video-container {
            max-width: min(100vw, calc(100vh * 5 / 3));
            max-height: 100vh;
            width: 100vw !important;
            height: auto !important;
        }

        #eq-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 25%;
            background-color: transparent;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 2%;
            box-sizing: border-box;
            gap: 2%;
            z-index: 10;
        }

        .overlay-eq-bar {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.25);
            height: 0%;
            border-radius: 2px 2px 0 0;
            transition: height 0.05s ease-out;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        button,
        input[type="file"] {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #333;
            color: white;
            border: 1px solid #555;
            border-radius: 4px;
        }

        button:hover {
            background: #555;
        }

        button:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
        }

        .panel {
            background: #222;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #4CAF50;
        }

        #dashboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .dash-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .dash-title {
            font-size: 12px;
            color: #888;
            letter-spacing: 1px;
        }

        #vis-palette {
            display: flex;
            gap: 2px;
        }

        .pal-box {
            width: 24px;
            height: 24px;
            border: 1px solid #555;
            border-radius: 2px;
        }

        #vis-eq {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 60px;
            border-bottom: 2px solid #555;
            padding-bottom: 2px;
            width: 280px;
            justify-content: center;
        }

        .eq-bar {
            width: 12px;
            background-color: #00ffcc;
            border-radius: 2px 2px 0 0;
            transition: height 0.05s ease-out;
        }

        .eq-center-divider {
            width: 2px;
            height: 10px;
            background-color: #666;
            margin: 0 4px;
        }

        #btn-export {
            background-color: #28a745;
            font-weight: bold;
        }

        #btn-export:hover {
            background-color: #218838;
        }

        #btn-fullscreen {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            padding: 0;
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 4px;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, background-color 0.2s, transform 0.1s, visibility 0.3s;
        }

        /* Show button when wrapper has the 'active' class (mouse moved / touched) */
        #screen-wrapper.active #btn-fullscreen:not(:disabled) {
            opacity: 1;
            visibility: visible;
        }

        #btn-fullscreen:hover {
            background-color: rgba(0, 123, 255, 0.8);
        }

        #btn-fullscreen:active {
            transform: scale(0.95);
        }

        #btn-fullscreen:disabled {
            display: none;
        }

        .drop-zone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            background: #1a1a1a;
            transition: all 0.3s ease;
            margin: 20px auto;
            width: 90%;
            max-width: 600px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .drop-zone.dragover {
            background: #2a2a35;
            border-color: #4CAF50;
            transform: scale(1.02);
        }

        .drop-zone p {
            margin: 0 0 15px 0;
            color: #ccc;
            font-size: 15px;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <h2>MSX2 MV Player & Recorder (.MV / .MV2)</h2>

    <div id="screen-wrapper">
        <div id="video-container">
            <canvas id="msx-screen" width="256" height="192"></canvas>
            <div id="eq-overlay">
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
                <div class="overlay-eq-bar"></div>
            </div>
        </div>
        <button id="btn-fullscreen" disabled title="Fullscreen">⤡</button>
    </div>

    <div id="drop-zone" class="drop-zone">
        <p>여기에 .MV, .MV2 또는 .ZIP 파일을 드래그 앤 드롭하거나 클릭해서 선택하세요.</p>
        <input type="file" id="file-input" accept=".mv,.mv2,.zip" />
    </div>

    <div class="controls">
        <button id="btn-play" disabled>▶ Play</button>
        <button id="btn-pause" disabled>⏸ Pause</button>
        <button id="btn-export" disabled>💾 Export MP4</button>

        <div class="panel"
            style="width: 100%; max-width: 600px; display: flex; align-items: center; justify-content: space-between; padding: 10px 0;">
            <span id="time-current" style="font-family: monospace;">00:00</span>
            <div style="display: flex; gap: 5px; margin-left: 10px;">
                <button id="btn-prev-frame" title="Previous Frame"
                    style="padding: 2px 8px; font-size: 12px;">-1F</button>
                <button id="btn-next-frame" title="Next Frame" style="padding: 2px 8px; font-size: 12px;">+1F</button>
            </div>
            <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.1"
                style="flex-grow: 1; margin: 0 10px;" disabled>
            <span id="time-total" style="font-family: monospace;">00:00</span>
        </div>

        <div class="panel">
            <label for="scale-slider">📺 Size: <span id="scale-label">3x</span></label>
            <input type="range" id="scale-slider" min="1" max="5" step="1" value="3">
        </div>

        <div class="panel">
            <label style="cursor: pointer;"><input type="checkbox" id="toggle-dashboard" checked> 📊 Dash View</label>
        </div>

        <div class="panel">
            <label style="cursor: pointer;" title="Allow playing when tab is in background"><input type="checkbox"
                    id="toggle-bg-play" checked> 🔄 BG Play</label>
        </div>

        <div class="panel">
            <button id="toggle-overlay-btn"
                style="padding: 5px 10px; font-size: 14px; background-color: #d9534f">Overlay OFF</button>
            <label for="overlay-opacity" style="margin-left: 10px; font-size: 14px;">Opacity: <span
                    id="opacity-label">25%</span></label>
            <input type="range" id="overlay-opacity" min="0" max="1" step="0.05" value="0.25" style="width: 80px;">
        </div>
    </div>

    <div id="status">대기 중... .MV, .MV2 또는 .ZIP 파일을 선택하세요.</div>

    <div id="dashboard">
        <div class="dash-section">
            <div class="dash-title">PALETTE MEMORY (16 COLORS)</div>
            <div id="vis-palette"></div>
        </div>
        <div class="dash-section">
            <div class="dash-title">STEREO EQ SPECTRUM (18 BANDS)</div>
            <div id="vis-eq"></div>
        </div>
    </div>

    <canvas id="export-canvas" width="256" height="192" style="display:none;"></canvas>

    <script>
        class MSXMediaDemuxer {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                this.frames = [];
                this.audioBuffer = null;
                this.audioSource = null;
                this.rawAudioBytes = null;
                this.isPlaying = false;
                this.startTime = 0;
                this.pauseTime = 0;
                this.lastRenderedFrame = -1;
                this.timerWorker = null;
                this.fps = 15;
                this.isMV1 = false; // 💡 MP4 Export 분기용 포맷 플래그
                this.initDashboard();
                this.initWorker();
            }

            formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            initWorker() {
                const workerCode = `
                    let timerID = null;
                    self.onmessage = function(e) {
                        if (e.data === 'start') {
                            if (timerID) clearInterval(timerID);
                            timerID = setInterval(() => self.postMessage('tick'), 16); // Check ~60 times a second
                        } else if (e.data === 'stop') {
                            if (timerID) clearInterval(timerID);
                            timerID = null;
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                this.timerWorker = new Worker(URL.createObjectURL(blob));
                this.timerWorker.onmessage = () => {
                    if (!this.isPlaying || this.isScrubbing) return;
                    let currentTime = this.audioCtx.currentTime - this.startTime;
                    if (currentTime > this.duration) currentTime = this.duration;

                    const currentFrame = Math.floor(currentTime * this.fps);

                    if (!this.isScrubbing) {
                        const slider = document.getElementById('seek-slider');
                        if (this.duration > 0) slider.value = (currentTime / this.duration) * 100;
                        document.getElementById('time-current').innerText = this.formatTime(currentTime);
                    }

                    if (currentFrame < this.totalFrames) {
                        if (this.lastRenderedFrame !== currentFrame) {
                            this.renderFrame(currentFrame);
                            this.lastRenderedFrame = currentFrame;
                        }
                    } else {
                        this.pause();
                    }
                };
            }

            initDashboard() {
                const palContainer = document.getElementById('vis-palette');
                for (let i = 0; i < 16; i++) {
                    const d = document.createElement('div');
                    d.className = 'pal-box';
                    palContainer.appendChild(d);
                }
                const eqContainer = document.getElementById('vis-eq');
                for (let i = 0; i < 19; i++) {
                    if (i === 9) {
                        const divider = document.createElement('div');
                        divider.className = 'eq-center-divider';
                        eqContainer.appendChild(divider);
                        continue;
                    }
                    const d = document.createElement('div');
                    d.className = 'eq-bar';
                    d.style.height = '0px';
                    eqContainer.appendChild(d);
                }
            }

            reset() {
                this.isPlaying = false;
                if (this.timerWorker) this.timerWorker.postMessage('stop');
                if (this.audioSource) { try { this.audioSource.stop(); } catch (e) { } this.audioSource.disconnect(); this.audioSource = null; }
                this.frames = [];
                this.audioBuffer = null;
                this.rawAudioBytes = null;
                this.startTime = 0;
                this.pauseTime = 0;
                this.lastRenderedFrame = -1;
                this.ctx.fillStyle = "black";
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                document.getElementById('btn-play').disabled = true;
                document.getElementById('btn-pause').disabled = true;
                document.getElementById('btn-export').disabled = true;
                document.getElementById('btn-fullscreen').disabled = true;
                const sl = document.getElementById('seek-slider');
                sl.value = 0; sl.disabled = true;
                document.getElementById('time-current').innerText = "00:00";
                document.getElementById('time-total').innerText = "00:00";
            }

            async loadFile(file) {
                this.reset();
                if (file.name.toLowerCase().endsWith('.zip')) {
                    document.getElementById('status').innerText = "ZIP 압축 해제 중...";
                    try {
                        const zip = new JSZip();
                        const zipContent = await zip.loadAsync(file);
                        let mvData = null;
                        let mvFilename = "";
                        for (const [filename, zipEntry] of Object.entries(zipContent.files)) {
                            if (!zipEntry.dir && (filename.toLowerCase().endsWith('.mv') || filename.toLowerCase().endsWith('.mv2'))) {
                                mvData = await zipEntry.async('uint8array');
                                mvFilename = filename;
                                break;
                            }
                        }
                        if (!mvData) {
                            throw new Error("ZIP 파일 내에 .MV 또는 .MV2 파일이 없습니다.");
                        }
                        document.getElementById('status').innerText = `${mvFilename} 분석 중...`;
                        await this.processData(mvData);
                        return;
                    } catch (err) {
                        document.getElementById('status').innerText = `에러: ${err.message}`;
                        document.getElementById('status').style.color = "#ff4444";
                        return;
                    }
                }

                document.getElementById('status').innerText = "파일 분석 중...";
                const data = new Uint8Array(await file.arrayBuffer());
                await this.processData(data);
            }

            async processData(data) {
                const sig = String.fromCharCode(...data.slice(0, 8));
                const ver = String.fromCharCode(...data.slice(16, 21));

                try {
                    // 💡 [핵심] MV1과 MV2를 모두 에러 없이 통과!
                    if (sig === "MMCSD_MV" && ver === "v1.00") {
                        this.fps = 12;
                        this.isMV1 = true;
                        await this.parseMV1(data);
                    } else if (sig === "MMCSD_MV" && ver === "v2.00") {
                        this.fps = 15;
                        this.isMV1 = false;
                        await this.parseMV2(data, 16384);
                    } else if (sig.startsWith("MV2")) {
                        this.fps = 15;
                        this.isMV1 = false;
                        await this.parseMV2(data, 512); // Legacy MV2
                    } else {
                        throw new Error("올바른 .MV 또는 .MV2 포맷이 아닙니다.");
                    }

                    document.getElementById('status').innerText = `파싱 완료! (${this.isMV1 ? 'MV1' : 'MV2'}, ${this.fps}FPS, ${this.totalFrames} 프레임)`;
                    document.getElementById('status').style.color = "#4CAF50";
                    document.getElementById('btn-play').disabled = false;
                    document.getElementById('btn-export').disabled = false;
                    document.getElementById('btn-fullscreen').disabled = false;

                    this.duration = this.totalFrames / this.fps;
                    document.getElementById('time-total').innerText = this.formatTime(this.duration);
                    document.getElementById('seek-slider').disabled = false;
                } catch (err) {
                    document.getElementById('status').innerText = `에러: ${err.message}`;
                    document.getElementById('status').style.color = "#ff4444";
                }
            }

            async parseMV1(data) {
                this.frames = [];
                let offset = 16384;
                let pcmChunks = [];

                while (offset + 16384 <= data.length) {
                    const block = data.subarray(offset, offset + 16384);
                    const pgt = block.slice(0, 6144);
                    const ct = block.slice(6144, 12288);
                    const pcm = block.slice(12288, 13232);
                    const palette = [[0, 0, 0]].concat(this.extractPalette(block.slice(13232, 13262), 15));
                    const eqRaw = block.slice(13264, 13273); // 완벽한 13264번지 오프셋

                    this.frames.push({ pgt, ct, palette, eqRaw });
                    pcmChunks.push(pcm);
                    offset += 16384;
                }
                this.totalFrames = this.frames.length;

                const totalLen = pcmChunks.length * 944;
                this.rawAudioBytes = new Uint8Array(totalLen);
                let aOff = 0;
                for (let c of pcmChunks) {
                    this.rawAudioBytes.set(c, aOff);
                    aOff += c.length;
                }

                const sampleRate = 944 * 12; // 11328Hz
                this.audioBuffer = this.audioCtx.createBuffer(1, totalLen, sampleRate);
                const channelData = this.audioBuffer.getChannelData(0);
                for (let i = 0; i < totalLen; i++) {
                    channelData[i] = (this.rawAudioBytes[i] - 128) / 128.0;
                }
            }

            async parseMV2(data, headerSize) {
                this.frames = [];
                let offset = headerSize;
                let mp3Chunks = [];

                while (offset < data.length) {
                    const blockSize = (headerSize === 512 && offset === 512) ? 15872 : 16384;
                    if (offset + blockSize > data.length) break;

                    const block = data.subarray(offset, offset + blockSize);
                    const pgt = block.slice(0, 6144);
                    const ct = block.slice(6144, 12288);
                    const palette = [[0, 0, 0]].concat(this.extractPalette(block.slice(12288, 12318), 15));
                    const eqRaw = block.slice(12320, 12329); // MV2 고유의 12320번지 오프셋
                    const sz = block[12800];
                    const mp3 = block.slice(12801, 12801 + (sz * 32));

                    this.frames.push({ pgt, ct, palette, eqRaw });
                    if (mp3.length > 0) {
                        mp3Chunks.push(mp3);
                    }
                    offset += blockSize;
                }
                this.totalFrames = this.frames.length;

                const totalLen = mp3Chunks.reduce((acc, chunk) => acc + chunk.length, 0);
                this.rawAudioBytes = new Uint8Array(totalLen);

                // [안전망 1] 오디오 데이터가 아예 없는 파일인 경우 뻗지 않고 무음 버퍼 생성
                if (totalLen === 0) {
                    this.audioBuffer = this.audioCtx.createBuffer(1, Math.ceil((this.totalFrames / this.fps) * 44100), 44100);
                    return;
                }

                let aOff = 0;
                for (let c of mp3Chunks) {
                    this.rawAudioBytes.set(c, aOff);
                    aOff += c.length;
                }

                try {
                    // 브라우저 네이티브 디코더로 MP3 해석 시도
                    this.audioBuffer = await this.audioCtx.decodeAudioData(this.rawAudioBytes.buffer.slice(0));
                } catch (err) {
                    console.warn("오디오 디코딩 실패 (손상되거나 지원하지 않는 형식). 무음 처리합니다.", err);
                    // [안전망 2] 디코딩 에러 시 크래시를 방지하고 강제로 무음(빈) 버퍼 생성
                    this.audioBuffer = this.audioCtx.createBuffer(1, Math.ceil((this.totalFrames / this.fps) * 44100), 44100);
                }
            }

            extractPalette(d, count) {
                const p = [];
                for (let i = 0; i < count; i++) {
                    const r8 = Math.round(((d[i * 2] >> 4) & 0x07) * 255 / 7);
                    const b8 = Math.round((d[i * 2] & 0x07) * 255 / 7);
                    const g8 = Math.round((d[i * 2 + 1] & 0x07) * 255 / 7);
                    p.push([r8, g8, b8]);
                }
                return p;
            }

            renderFrameToCanvas(frameIndex, targetCtx, withOverlay = true) {
                const frame = this.frames[frameIndex];
                const img = targetCtx.createImageData(256, 192);
                for (let y = 0; y < 192; y++) {
                    for (let cx = 0; cx < 32; cx++) {
                        const off = (Math.floor(y / 8) * 32 + cx) * 8 + (y % 8);
                        const p = frame.pgt[off], c = frame.ct[off];
                        const fg = c >> 4, bg = c & 0x0F;
                        for (let px = 0; px < 8; px++) {
                            const color = (p & (1 << (7 - px))) ? frame.palette[fg] : frame.palette[bg];
                            const idx = (y * 256 + (cx * 8 + px)) * 4;
                            img.data[idx] = color[0]; img.data[idx + 1] = color[1]; img.data[idx + 2] = color[2]; img.data[idx + 3] = 255;
                        }
                    }
                }
                targetCtx.putImageData(img, 0, 0);

                if (withOverlay) {
                    const opacity = document.getElementById('overlay-opacity').value;
                    targetCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                    const eqWidth = 256 * 0.25;
                    const eqHeight = 192 * 0.25;
                    const barW = (eqWidth / 9) - 1;
                    for (let i = 0; i < 9; i++) {
                        const val = 15 - Math.min(frame.eqRaw[i], 15);
                        const h = (val / 15) * (eqHeight * 0.9);
                        targetCtx.fillRect(2 + i * (barW + 1), eqHeight - h + 2, barW, Math.max(1, h));
                    }
                }
            }

            renderFrame(idx) {
                this.renderFrameToCanvas(idx, this.ctx, false);
                const frame = this.frames[idx];

                if (document.getElementById('toggle-dashboard').checked) {
                    const palDivs = document.getElementById('vis-palette').children;
                    for (let i = 0; i < 16; i++) {
                        const rgb = frame.palette[i] || [0, 0, 0];
                        palDivs[i].style.backgroundColor = `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`;
                    }

                    const eqDivs = document.getElementById('vis-eq').children;
                    for (let i = 0; i < 9; i++) {
                        const realVal = 15 - Math.min(frame.eqRaw[i], 15);
                        const heightPx = (realVal / 15.0) * 60;
                        eqDivs[i].style.height = `${heightPx}px`;
                        eqDivs[18 - i].style.height = `${heightPx}px`;
                    }
                }

                const eqOverlay = document.getElementById('eq-overlay');
                if (eqOverlay.style.display !== 'none') {
                    const bars = eqOverlay.children;
                    for (let i = 0; i < 9; i++) bars[i].style.height = `${((15 - Math.min(frame.eqRaw[i], 15)) / 15) * 100}%`;
                }
            }

            async play() {
                if (this.isPlaying) return;
                if (this.audioCtx.state === 'suspended' || this.audioCtx.state === 'interrupted') {
                    await this.audioCtx.resume();
                }
                this.audioSource = this.audioCtx.createBufferSource();
                this.audioSource.buffer = this.audioBuffer;
                this.audioSource.connect(this.audioCtx.destination);
                this.audioSource.start(0, this.pauseTime);
                this.startTime = this.audioCtx.currentTime - this.pauseTime;
                this.isPlaying = true;
                document.getElementById('btn-play').disabled = true;
                document.getElementById('btn-pause').disabled = false;
                if (this.timerWorker) this.timerWorker.postMessage('start');
            }

            pause() {
                if (!this.isPlaying) return;
                this.isPlaying = false;
                if (this.audioSource) {
                    try { this.audioSource.stop(); } catch (e) { }
                }
                if (!this.isScrubbing) {
                    this.pauseTime = this.audioCtx.currentTime - this.startTime;
                }
                if (this.timerWorker) this.timerWorker.postMessage('stop');
                document.getElementById('btn-play').disabled = false;
                document.getElementById('btn-pause').disabled = true;
            }

            async exportMP4() {
                if (!this.frames || this.totalFrames === 0) {
                    alert("먼저 추출할 파일을 열어주세요.");
                    return;
                }

                if (typeof window.Mp4Muxer === 'undefined') {
                    alert("mp4-muxer 라이브러리가 로드되지 않았습니다. 인터넷 연결을 확인해주세요.");
                    return;
                }

                if (typeof VideoEncoder === "undefined") {
                    alert("이 브라우저는 WebCodecs API를 지원하지 않습니다. 최신 크롬, 엣지, 사파리를 사용해주세요.");
                    return;
                }

                const btn = document.getElementById('btn-export');
                const status = document.getElementById('status');
                btn.disabled = true;
                status.innerText = "오디오 규격 변환 중 (Resampling)...";

                try {
                    // [수정 1] 비표준 오디오 샘플레이트를 AAC 표준 규격(44100Hz)으로 리샘플링
                    const targetSampleRate = 44100;
                    const offlineCtx = new OfflineAudioContext(1, Math.ceil(this.duration * targetSampleRate), targetSampleRate);
                    const source = offlineCtx.createBufferSource();
                    source.buffer = this.audioBuffer;
                    source.connect(offlineCtx.destination);
                    source.start(0);
                    const resampledAudioBuffer = await offlineCtx.startRendering();

                    status.innerText = "하드웨어 가속 인코딩 준비 중...";

                    const muxer = new Mp4Muxer.Muxer({
                        target: new Mp4Muxer.ArrayBufferTarget(),
                        video: {
                            codec: 'avc',
                            width: 960,
                            height: 576
                        },
                        audio: {
                            codec: 'aac',
                            sampleRate: targetSampleRate, // 리샘플링된 44100Hz 적용
                            numberOfChannels: 1
                        },
                        fastStart: 'in-memory'
                    });

                    const videoEncoder = new VideoEncoder({
                        output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                        error: e => console.error("비디오 인코딩 에러:", e)
                    });
                    videoEncoder.configure({
                        codec: 'avc1.42001f',
                        width: 960,
                        height: 576,
                        bitrate: 5_000_000,
                        framerate: this.fps
                    });

                    const audioEncoder = new AudioEncoder({
                        output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
                        error: e => console.error("오디오 인코딩 에러:", e)
                    });
                    audioEncoder.configure({
                        codec: 'mp4a.40.2',
                        sampleRate: targetSampleRate, // 리샘플링된 44100Hz 적용
                        numberOfChannels: 1,
                        bitrate: 128_000
                    });

                    // 추출한 44100Hz 오디오 데이터를 인코더에 주입
                    const channelData = resampledAudioBuffer.getChannelData(0);

                    for (let i = 0; i < channelData.length; i += targetSampleRate) {
                        // subarray를 사용하여 메모리 복사 최소화
                        const chunk = channelData.subarray(i, i + targetSampleRate);
                        const audioData = new AudioData({
                            format: 'f32-planar',
                            sampleRate: targetSampleRate,
                            numberOfFrames: chunk.length,
                            numberOfChannels: 1,
                            timestamp: Math.round((i / targetSampleRate) * 1_000_000),
                            data: chunk
                        });
                        audioEncoder.encode(audioData);
                        audioData.close();
                    }

                    const baseCanvas = document.createElement('canvas');
                    baseCanvas.width = 256;
                    baseCanvas.height = 192;
                    const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });

                    const scaleCanvas = document.createElement('canvas');
                    scaleCanvas.width = 960;
                    scaleCanvas.height = 576;
                    const scaleCtx = scaleCanvas.getContext('2d');
                    scaleCtx.imageSmoothingEnabled = false;

                    const includeEQ = document.getElementById('eq-overlay').style.display !== 'none';

                    // [수정 2] 1프레임당 머무르는 시간(마이크로초) 계산 (duration 에러 해결)
                    const durationMicros = Math.round((1 / this.fps) * 1_000_000);

                    for (let i = 0; i < this.totalFrames; i++) {
                        this.renderFrameToCanvas(i, baseCtx, includeEQ);
                        scaleCtx.drawImage(baseCanvas, 0, 0, 256, 192, 0, 0, 768, 576);

                        const timestampMicros = Math.round((i / this.fps) * 1_000_000);
                        const frame = new VideoFrame(scaleCanvas, {
                            timestamp: timestampMicros,
                            duration: durationMicros // 누락되었던 duration 추가
                        });

                        videoEncoder.encode(frame);
                        frame.close();

                        if (i % 30 === 0) {
                            status.innerText = `GPU 인코딩 중... (${i}/${this.totalFrames})`;
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }

                    status.innerText = "스트림 병합 및 마무리 중...";
                    await new Promise(r => setTimeout(r, 0));

                    await videoEncoder.flush();
                    await audioEncoder.flush();
                    muxer.finalize();

                    const buffer = muxer.target.buffer;
                    const blob = new Blob([buffer], { type: 'video/mp4' });

                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `msx_export_gpu_${Date.now()}.mp4`;
                    a.click();

                    status.innerText = "초고속 내보내기 완료!";
                    status.style.color = "#4CAF50";

                } catch (err) {
                    console.error("인코딩 중 예외 발생:", err);
                    status.innerText = "에러: 인코딩 실패 (콘솔 확인)";
                    status.style.color = "#ff4444";
                } finally {
                    btn.disabled = false;
                }
            }
        }

        const player = new MSXMediaDemuxer('msx-screen');

        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) {
                player.loadFile(e.target.files[0]);
                e.target.value = '';
            }
        });

        dropZone.addEventListener('click', e => {
            if (e.target !== fileInput) {
                fileInput.click();
            }
        });

        dropZone.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                player.loadFile(e.dataTransfer.files[0]);
            }
        });

        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => e.preventDefault());

        document.getElementById('btn-play').addEventListener('click', () => player.play());
        document.getElementById('btn-pause').addEventListener('click', () => player.pause());
        document.getElementById('btn-export').addEventListener('click', () => player.exportMP4());

        const seekSlider = document.getElementById('seek-slider');
        let wasPlayingBeforeSeek = false;

        seekSlider.addEventListener('input', e => {
            if (!player.frames || player.frames.length === 0) return;
            if (!player.isScrubbing) {
                wasPlayingBeforeSeek = player.isPlaying;
                player.isScrubbing = true;
                if (player.isPlaying) player.pause();
            }
            const pct = parseFloat(e.target.value) / 100;
            const targetTime = pct * player.duration;
            document.getElementById('time-current').innerText = player.formatTime(targetTime);

            const targetFrame = Math.min(Math.floor(targetTime * player.fps), player.totalFrames - 1);
            player.renderFrame(targetFrame);
        });

        seekSlider.addEventListener('change', e => {
            if (!player.frames || player.frames.length === 0) return;
            const pct = parseFloat(e.target.value) / 100;
            player.pauseTime = pct * player.duration;
            player.isScrubbing = false;

            if (wasPlayingBeforeSeek) {
                player.play();
            }
        });

        document.getElementById('scale-slider').addEventListener('input', e => {
            const s = e.target.value;
            document.getElementById('scale-label').innerText = s + 'x';
            const container = document.getElementById('video-container');
            container.style.width = (320 * s) + 'px';
            container.style.height = 'auto'; // let aspect-ratio compute height naturally
        });

        document.getElementById('toggle-dashboard').addEventListener('change', e => {
            document.getElementById('dashboard').style.display = e.target.checked ? 'flex' : 'none';
        });

        document.getElementById('toggle-overlay-btn').addEventListener('click', e => {
            const o = document.getElementById('eq-overlay');
            const isOff = window.getComputedStyle(o).display === 'none';

            o.style.display = isOff ? 'flex' : 'none';
            e.target.innerText = isOff ? 'Overlay OFF' : 'Overlay ON';
            e.target.style.backgroundColor = isOff ? '#d9534f' : '#333';
        });

        document.getElementById('overlay-opacity').addEventListener('input', e => {
            const alpha = e.target.value;
            document.getElementById('opacity-label').innerText = Math.round(alpha * 100) + '%';
            const bars = document.getElementsByClassName('overlay-eq-bar');
            for (let b of bars) b.style.backgroundColor = `rgba(255, 255, 255, ${alpha})`;
        });

        // Autohide Fullscreen button logic
        let hideBtnTimeout;
        const screenWrapper = document.getElementById('screen-wrapper');

        const showFullscreenBtn = () => {
            screenWrapper.classList.add('active');
            clearTimeout(hideBtnTimeout);
            hideBtnTimeout = setTimeout(() => {
                screenWrapper.classList.remove('active');
            }, 2500);
        };

        screenWrapper.addEventListener('mousemove', showFullscreenBtn);
        screenWrapper.addEventListener('touchstart', showFullscreenBtn);
        screenWrapper.addEventListener('click', showFullscreenBtn);
        screenWrapper.addEventListener('mouseleave', () => {
            clearTimeout(hideBtnTimeout);
            screenWrapper.classList.remove('active');
        });

        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                if (screenWrapper.requestFullscreen) {
                    screenWrapper.requestFullscreen();
                } else if (screenWrapper.webkitRequestFullscreen) {
                    screenWrapper.webkitRequestFullscreen();
                } else if (screenWrapper.msRequestFullscreen) {
                    screenWrapper.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        });

        document.addEventListener("visibilitychange", () => {
            const allowBg = document.getElementById('toggle-bg-play').checked;
            if (document.hidden && player.isPlaying && !allowBg) {
                player.pause();
            }
        });

        document.getElementById('btn-prev-frame').addEventListener('click', () => {
            if (!player.frames || player.frames.length === 0) return;
            if (player.isPlaying) player.pause();
            const curIdx = Math.round(player.pauseTime * player.fps);
            const targetFrame = Math.max(0, curIdx - 1);
            player.pauseTime = targetFrame / player.fps;
            player.renderFrame(targetFrame);
            document.getElementById('time-current').innerText = player.formatTime(player.pauseTime);
            document.getElementById('seek-slider').value = (player.pauseTime / player.duration) * 100;
        });

        document.getElementById('btn-next-frame').addEventListener('click', () => {
            if (!player.frames || player.frames.length === 0) return;
            if (player.isPlaying) player.pause();
            const curIdx = Math.round(player.pauseTime * player.fps);
            const targetFrame = Math.min(player.totalFrames - 1, curIdx + 1);
            player.pauseTime = targetFrame / player.fps;
            player.renderFrame(targetFrame);
            document.getElementById('time-current').innerText = player.formatTime(player.pauseTime);
            document.getElementById('seek-slider').value = (player.pauseTime / player.duration) * 100;
        });
    </script>
</body>

</html>
